<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 10 — CTA Finale</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9922a;--gold-l:#f5d98e;--deep:#060402}
body{background:var(--deep);display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden}
.scene{position:relative;width:820px;height:820px;overflow:hidden;background:var(--deep)}

/* BG food photo, heavily blurred */
.bg{position:absolute;inset:0;
  background:url('https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=1280&q=85') center/cover no-repeat;
  filter:blur(6px) brightness(.55) saturate(1.3);transform:scale(1.1);
  opacity:0;animation:fadeIn 1.5s .1s ease-out forwards}
@keyframes fadeIn{to{opacity:1}}
.overlay{position:absolute;inset:0;z-index:2;
  background:radial-gradient(ellipse at 50% 50%,rgba(6,4,2,.35) 0%,rgba(6,4,2,.82) 100%),
             linear-gradient(180deg,rgba(6,4,2,.65) 0%,rgba(6,4,2,.1) 40%,rgba(6,4,2,.75) 100%)}
.grain{position:absolute;inset:0;z-index:3;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* Content */
.stage{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px}

/* Logo name small */
.logo-sm{font-family:'Great Vibes',cursive;font-size:68px;letter-spacing:3px;
  background:linear-gradient(160deg,#fff8e7 0%,#f5d98e 28%,#c9922a 50%,#f5d98e 70%,#fff8e7 88%);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(201,146,42,.5));
  opacity:0;transform:translateY(20px);
  animation:fadeUp .9s .3s ease forwards,shimmer 4s 1.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 60%}50%{background-position:100% 40%}}

.sub-name{font-family:'Cinzel',serif;font-size:11px;letter-spacing:8px;color:rgba(245,217,142,.6);text-transform:uppercase;
  opacity:0;animation:fadeUp .7s .8s ease forwards;margin-top:2px;margin-bottom:36px}

/* Gem divider */
.gems{display:flex;align-items:center;gap:10px;opacity:0;animation:fadeUp .6s 1s ease forwards}
.gem-line{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.gem{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg);box-shadow:0 0 8px var(--gold);animation:gemP 2.5s 2s ease-in-out infinite}
.gem-sm{width:4px;height:4px;background:var(--gold);transform:rotate(45deg);animation:gemP 2.5s 2.2s ease-in-out infinite}
@keyframes gemP{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 14px var(--gold-l),0 0 28px var(--gold)}}

/* Phone */
.eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:5px;color:rgba(201,146,42,.55);text-transform:uppercase;
  opacity:0;animation:fadeUp .6s 1.3s ease forwards;margin-top:32px;margin-bottom:8px}
.phone{font-family:'Cinzel',serif;font-size:30px;font-weight:600;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,.8);
  opacity:0;transform:translateY(10px);animation:fadeUp .7s 1.6s ease forwards;margin-bottom:26px}

/* Reserve button */
.reserve{display:inline-block;padding:14px 44px;
  background:linear-gradient(135deg,#c45e00,#f07800);
  color:#fff;font-family:'Cinzel',serif;font-size:11px;font-weight:700;
  letter-spacing:5px;text-transform:uppercase;border:none;cursor:pointer;
  border-radius:2px;
  opacity:0;transform:translateY(10px);
  animation:fadeUp .8s 2.0s ease forwards,btnPulse 2.4s 3s ease-in-out infinite alternate}
@keyframes btnPulse{from{box-shadow:0 4px 18px rgba(240,120,0,.45)}to{box-shadow:0 4px 44px rgba(240,120,0,1),0 0 80px rgba(240,120,0,.35)}}

/* Bottom details */
.details{display:flex;gap:28px;margin-top:36px;opacity:0;animation:fadeUp .7s 2.4s ease forwards}
.det-item{text-align:center}
.det-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:rgba(201,146,42,.5);text-transform:uppercase;margin-bottom:4px}
.det-val{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(255,248,231,.65);letter-spacing:1px}
.det-sep{width:1px;background:rgba(201,146,42,.25);margin:0 4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="grain"></div>
  <canvas id="c"></canvas>

  <div class="stage">
    <div class="logo-sm">Bukhara</div>
    <div class="sub-name">Indian Restoran</div>

    <div class="gems">
      <div class="gem-line"></div><div class="gem-sm"></div><div class="gem"></div><div class="gem-sm"></div><div class="gem-line"></div>
    </div>

    <div class="eyebrow">Reservations &amp; Enquiries</div>
    <div class="phone">+994 75 519 1300</div>

    <div class="reserve">Reserve Your Table</div>

    <div class="details">
      <div class="det-item">
        <div class="det-label">Open Daily</div>
        <div class="det-val">12:00 — 23:00</div>
      </div>
      <div class="det-sep"></div>
      <div class="det-item">
        <div class="det-label">Location</div>
        <div class="det-val">Baku, Azerbaijan</div>
      </div>
      <div class="det-sep"></div>
      <div class="det-item">
        <div class="det-label">Cuisine</div>
        <div class="det-val">Authentic Indian</div>
      </div>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');canvas.width=canvas.height=820;const C=['#c9922a','#f5d98e','#ff8c00','#fff3c4','#e65c00'];class E{constructor(){this.reset(true)}reset(init){this.x=Math.random()*820;this.y=init?Math.random()*820:830;this.vx=(Math.random()-.5)*.55;this.vy=-(0.35+Math.random()*1.1);this.r=.5+Math.random()*2;this.col=C[Math.floor(Math.random()*C.length)];this.alpha=0;this.life=0;this.maxLife=130+Math.random()*220;this.flicker=Math.random()*Math.PI*2}update(){this.life++;this.x+=this.vx+Math.sin(this.life*.04+this.flicker)*.28;this.y+=this.vy;const t=this.life/this.maxLife;this.alpha=(t<.15?t/.15:t>.75?(1-t)/.25:1)*.52;if(this.life>=this.maxLife||this.y<-10)this.reset(false)}draw(){ctx.save();ctx.globalAlpha=this.alpha;ctx.shadowColor=this.col;ctx.shadowBlur=this.r*5;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
const embers=Array.from({length:80},()=>new E());(function loop(){ctx.clearRect(0,0,820,820);embers.forEach(e=>{e.update();e.draw()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
