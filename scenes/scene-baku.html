<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bukhara — Baku Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9922a;--gold-l:#f5d98e;--gold-p:#fff8e7;--deep:#060402}
body{background:var(--deep);display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden}
.stage{position:relative;width:820px;height:820px;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* ── Shared keyframes ─────────────────────────────── */
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{0%,100%{background-position:0% 60%}50%{background-position:100% 40%}}
@keyframes gemP{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 14px var(--gold-l),0 0 28px var(--gold)}}
@keyframes bukIn{to{opacity:1;transform:scale(1) translateY(0)}}

/* ── Baku / Azerbaijan Scenic ─────────────────────── */
.az-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0}

/* Image 1 — Azerbaijan mountain valley */
.az-bg1{
  background-image:url('https://images.pexels.com/photos/9356284/pexels-photo-9356284.jpeg?auto=compress&cs=tinysrgb&w=1280');
  animation:azBg1 9s .1s ease-in-out forwards
}
/* Image 2 — Baku city at night (aerial) */
.az-bg2{
  background-image:url('https://images.pexels.com/photos/19544256/pexels-photo-19544256.jpeg?auto=compress&cs=tinysrgb&w=1280');
  animation:azBg2 9s .1s ease-in-out forwards
}
/* Image 3 — Heydar Aliyev Center drone */
.az-bg3{
  background-image:url('https://images.pexels.com/photos/8412668/pexels-photo-8412668.jpeg?auto=compress&cs=tinysrgb&w=1280');
  animation:azBg3 9s .1s ease-in-out forwards
}

@keyframes azBg1{
  0%  {opacity:0;transform:scale(1.0)}
  5%  {opacity:1}
  32% {opacity:1;transform:scale(1.09)}
  40% {opacity:0}
  100%{opacity:0;transform:scale(1.13)}
}
@keyframes azBg2{
  0%  {opacity:0;transform:scale(1.04)}
  30% {opacity:0}
  38% {opacity:1}
  64% {opacity:1;transform:scale(1.12)}
  72% {opacity:0}
  100%{opacity:0;transform:scale(1.16)}
}
@keyframes azBg3{
  0%  {opacity:0;transform:scale(1.0)}
  64% {opacity:0}
  72% {opacity:1}
  100%{opacity:1;transform:scale(1.10)}
}

.az-overlay{
  position:absolute;inset:0;z-index:2;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(6,4,2,.10) 0%, rgba(6,4,2,.68) 100%),
    linear-gradient(180deg, rgba(6,4,2,.70) 0%, rgba(6,4,2,.03) 42%, rgba(6,4,2,.85) 100%)
}

/* ── Text stage ───────────────────────────────────── */
.az-stage{
  position:absolute;inset:0;z-index:8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px;
  animation:azOut .9s 8.1s ease-in forwards
}
@keyframes azOut{to{opacity:0;transform:translateY(-8px)}}

.az-eyebrow{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:8px;
  color:rgba(201,146,42,.62);text-transform:uppercase;
  opacity:0;animation:fadeUp .7s .4s ease forwards;margin-bottom:14px
}

.az-title{
  font-family:'Great Vibes',cursive;font-size:124px;line-height:1;
  background:linear-gradient(160deg,#fff8e7 0%,#f5d98e 22%,#c9922a 46%,#f5d98e 62%,#fff8e7 78%);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:scale(.88) translateY(28px);
  filter:drop-shadow(0 0 42px rgba(201,146,42,.55));
  animation:bukIn 1.1s .7s cubic-bezier(.22,1,.36,1) forwards, shimmer 5s 2s ease-in-out infinite
}

.az-orn{opacity:0;animation:fadeUp .7s 1.5s ease forwards;margin:6px 0 2px}
.az-orn-path{
  stroke:var(--gold);stroke-width:.9;fill:none;opacity:.55;
  stroke-dasharray:300;stroke-dashoffset:300;
  animation:draw 1.3s 1.5s ease-out forwards
}

.az-country{
  font-family:'Cinzel',serif;font-size:20px;font-weight:600;letter-spacing:12px;
  color:rgba(245,217,142,.82);text-transform:uppercase;
  opacity:0;animation:fadeUp .8s 1.8s ease forwards;
  margin-top:6px;text-shadow:0 0 30px rgba(201,146,42,.4)
}

.az-divider{
  width:1px;height:28px;
  background:linear-gradient(to bottom,transparent,rgba(201,146,42,.5),transparent);
  margin:18px auto;
  opacity:0;animation:fadeIn .6s 2.3s ease forwards
}

.az-tagline{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;
  color:rgba(255,248,231,.70);letter-spacing:2px;text-align:center;line-height:1.5;
  opacity:0;animation:fadeUp .8s 2.4s ease forwards;
  text-shadow:0 0 40px rgba(201,146,42,.25)
}

.az-sub{
  font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:5px;
  color:rgba(201,146,42,.50);text-transform:uppercase;
  opacity:0;animation:fadeUp .6s 3.0s ease forwards;margin-top:10px
}

.az-gems{
  display:flex;align-items:center;gap:10px;margin-top:26px;
  opacity:0;animation:fadeUp .6s 3.2s ease forwards
}
.az-gem-line{width:72px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.az-gem{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg);animation:gemP 2.5s 3.5s ease-in-out infinite}
.az-gem-sm{width:4px;height:4px;background:var(--gold);transform:rotate(45deg);animation:gemP 2.5s 3.7s ease-in-out infinite}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>

  <!-- 3 scenic backgrounds — crossfade: mountains → Baku night → Heydar Aliyev Center -->
  <div class="az-bg az-bg1"></div>
  <div class="az-bg az-bg2"></div>
  <div class="az-bg az-bg3"></div>

  <div class="az-overlay"></div>

  <div class="az-stage">

    <div class="az-eyebrow">Serving Baku Since Day One</div>

    <div class="az-title">Baku</div>

    <div class="az-orn">
      <svg width="300" height="18" viewBox="0 0 300 18">
        <path class="az-orn-path" d="M0,9 L42,9 Q58,9 68,3 Q83,0 98,3 Q108,9 150,9 Q192,9 202,3 Q217,0 232,3 Q242,9 258,9 L300,9"/>
      </svg>
    </div>

    <div class="az-country">Azerbaijan</div>

    <div class="az-divider"></div>

    <!-- Tagline -->
    <div class="az-tagline">A land of ancient spice routes &amp; breathtaking beauty —<br>where every meal tells a story.</div>

    <div class="az-sub">The Caspian Shore &nbsp;·&nbsp; Land of Fire &nbsp;·&nbsp; Gateway of the East</div>

    <div class="az-gems">
      <div class="az-gem-line"></div>
      <div class="az-gem-sm"></div>
      <div class="az-gem"></div>
      <div class="az-gem-sm"></div>
      <div class="az-gem-line"></div>
    </div>

  </div>
</div>

<script>
/* ── Ember particle system ─────────────────────── */
const EC = ['#c9922a','#f5d98e','#ff8c00','#fff3c4','#e65c00'];
const cv  = document.getElementById('cv');
cv.width = cv.height = 820;
const ctx = cv.getContext('2d');

class E {
  constructor(){ this.reset(true) }
  reset(init){
    this.x = Math.random()*820;
    this.y = init ? Math.random()*820 : 830;
    this.vx = (Math.random()-.5)*.55;
    this.vy = -(0.35+Math.random()*1.1);
    this.r  = .5+Math.random()*2;
    this.col = EC[Math.floor(Math.random()*EC.length)];
    this.alpha=0; this.life=0;
    this.maxLife=130+Math.random()*220;
    this.flicker=Math.random()*Math.PI*2;
  }
  update(){
    this.life++;
    this.x += this.vx + Math.sin(this.life*.04+this.flicker)*.28;
    this.y += this.vy;
    const t=this.life/this.maxLife;
    this.alpha=(t<.15?t/.15:t>.75?(1-t)/.25:1)*.52;
    if(this.life>=this.maxLife||this.y<-10) this.reset(false);
  }
  draw(){
    ctx.save();
    ctx.globalAlpha=this.alpha;
    ctx.shadowColor=this.col;ctx.shadowBlur=this.r*5;
    ctx.fillStyle=this.col;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

const particles = Array.from({length:65},()=>new E());
(function loop(){
  ctx.clearRect(0,0,820,820);
  particles.forEach(p=>{p.update();p.draw()});
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
