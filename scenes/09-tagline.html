<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 09 — Tagline</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9922a;--gold-l:#f5d98e;--deep:#060402}
body{background:var(--deep);display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden}
.scene{position:relative;width:820px;height:820px;overflow:hidden;background:var(--deep)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.vignette{position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 20%,rgba(6,4,2,.5) 65%,rgba(6,4,2,.96) 100%)}

.stage{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:60px}

/* Decorative top gem row */
.gems-top{display:flex;align-items:center;gap:10px;opacity:0;animation:fadeUp .6s .3s ease forwards;margin-bottom:40px}
.gem-line{width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.gem{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg);box-shadow:0 0 8px var(--gold);animation:gemP 2.5s 1.5s ease-in-out infinite}
.gem-sm{width:4px;height:4px;background:var(--gold);transform:rotate(45deg);animation:gemP 2.5s 1.7s ease-in-out infinite}
@keyframes gemP{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 14px var(--gold-l),0 0 28px var(--gold)}}

/* Main tagline */
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:46px;font-weight:300;letter-spacing:3px;
  color:var(--gold-p,#fff8e7);text-align:center;line-height:1.3;
  opacity:0;transform:translateY(22px);
  animation:fadeUp 1.2s .7s cubic-bezier(.22,1,.36,1) forwards;
  text-shadow:0 0 60px rgba(201,146,42,.3)}

/* SVG underline */
.u-wrap{opacity:0;animation:show .1s 1.9s forwards;margin-top:6px}
.u-path{stroke:url(#gG);stroke-width:1.4;fill:none;stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1.3s 1.9s ease-out forwards;filter:drop-shadow(0 0 5px rgba(201,146,42,.7))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes show{to{opacity:1}}

/* Sub copy */
.sub{font-family:'Cinzel',serif;font-size:11px;letter-spacing:7px;
  color:rgba(201,146,42,.62);text-transform:uppercase;text-align:center;
  opacity:0;transform:translateY(10px);animation:fadeUp .8s 2.4s ease forwards;
  margin-top:28px}

/* Bottom gem row */
.gems-bot{display:flex;align-items:center;gap:10px;opacity:0;animation:fadeUp .6s 2.8s ease forwards;margin-top:36px}

/* Glow loop on tagline */
.tagline{animation:fadeUp 1.2s .7s cubic-bezier(.22,1,.36,1) forwards,glow 3s 3.5s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 20px rgba(201,146,42,.2)}to{text-shadow:0 0 50px rgba(201,146,42,.55),0 0 90px rgba(201,146,42,.2)}}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="scene">
  <canvas id="c"></canvas>
  <div class="vignette"></div>

  <div class="stage">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stop-color="#f5d98e"/>
          <stop offset="50%" stop-color="#c9922a"/>
          <stop offset="100%" stop-color="#f5d98e"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="gems-top">
      <div class="gem-line"></div><div class="gem-sm"></div><div class="gem"></div><div class="gem-sm"></div><div class="gem-line"></div>
    </div>

    <div class="tagline">Flavours of the Silk Road</div>

    <div class="u-wrap">
      <svg width="380" height="16" viewBox="0 0 380 16">
        <path class="u-path" d="M10,12 Q95,2 190,9 Q285,16 370,6"/>
      </svg>
    </div>

    <div class="sub">Authentic Indian Cuisine &nbsp;·&nbsp; Baku, Azerbaijan</div>

    <div class="gems-bot">
      <div class="gem-line"></div><div class="gem-sm"></div><div class="gem"></div><div class="gem-sm"></div><div class="gem-line"></div>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');canvas.width=canvas.height=820;const C=['#c9922a','#f5d98e','#ff8c00','#fff3c4','#e65c00'];class E{constructor(){this.reset(true)}reset(init){this.x=Math.random()*820;this.y=init?Math.random()*820:830;this.vx=(Math.random()-.5)*.55;this.vy=-(0.35+Math.random()*1.1);this.r=.5+Math.random()*2;this.col=C[Math.floor(Math.random()*C.length)];this.alpha=0;this.life=0;this.maxLife=130+Math.random()*220;this.flicker=Math.random()*Math.PI*2}update(){this.life++;this.x+=this.vx+Math.sin(this.life*.04+this.flicker)*.28;this.y+=this.vy;const t=this.life/this.maxLife;this.alpha=(t<.15?t/.15:t>.75?(1-t)/.25:1)*.52;if(this.life>=this.maxLife||this.y<-10)this.reset(false)}draw(){ctx.save();ctx.globalAlpha=this.alpha;ctx.shadowColor=this.col;ctx.shadowBlur=this.r*5;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
const embers=Array.from({length:75},()=>new E());(function loop(){ctx.clearRect(0,0,820,820);embers.forEach(e=>{e.update();e.draw()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
