<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 05 — Dal Makhani</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9922a;--gold-l:#f5d98e}
body{background:#000;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden}
.scene{position:relative;width:820px;height:820px;overflow:hidden;background:#000}

.dish{position:absolute;inset:0;
  background:url('https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=1280&q=85') center/cover no-repeat;
  transform:scale(.80);opacity:0;animation:dishZoom 5s .2s ease-in-out forwards}
@keyframes dishZoom{0%{transform:scale(.80);opacity:0}10%{transform:scale(.84);opacity:1}58%{transform:scale(1.28);opacity:1}80%{transform:scale(1.36);opacity:1}92%{transform:scale(1.43);opacity:.35}100%{transform:scale(1.47);opacity:0}}

.vignette{position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse at center,rgba(6,4,2,0) 25%,rgba(6,4,2,.62) 100%)}
.bottom-grad{position:absolute;bottom:0;left:0;right:0;height:55%;z-index:3;background:linear-gradient(to top,rgba(6,4,2,.95) 0%,rgba(6,4,2,.7) 40%,transparent 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

.corner{position:absolute;top:52px;right:48px;z-index:7;text-align:right;
  font-family:'Great Vibes',cursive;font-size:84px;color:#fff;line-height:1;
  text-shadow:3px 4px 28px rgba(0,0,0,.9),0 0 50px rgba(201,146,42,.25);
  opacity:0;transform:translateX(24px);
  animation:slideL .8s .5s cubic-bezier(.34,1.2,.64,1) forwards}
@keyframes slideL{to{opacity:1;transform:translateX(0)}}

.label{position:absolute;bottom:52px;left:52px;right:52px;z-index:8;opacity:0;transform:translateY(20px);animation:labelIn 2.8s 1.6s ease-out forwards}
@keyframes labelIn{0%{opacity:0;transform:translateY(20px)}16%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
.label-num{font-family:'Cinzel',serif;font-size:10px;letter-spacing:5px;color:rgba(201,146,42,.7);text-transform:uppercase;margin-bottom:10px}
.label-name{font-family:'Cinzel',serif;font-size:52px;font-weight:600;color:#fff;letter-spacing:2px;text-transform:uppercase;line-height:1;text-shadow:0 3px 24px rgba(0,0,0,1)}
.label-bar{width:55px;height:3px;background:var(--gold);margin:14px 0 12px;border-radius:2px}
.label-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:rgba(245,217,142,.88);letter-spacing:2px}
.progress{position:absolute;bottom:0;left:0;height:4px;width:0;z-index:9;background:linear-gradient(90deg,#c45e00,#f07800,#f5d98e);box-shadow:0 0 12px rgba(240,120,0,.7);animation:prog 4.7s .2s linear forwards}
@keyframes prog{0%{width:0;opacity:1}95%{width:100%;opacity:1}100%{width:100%;opacity:0}}
</style>
</head>
<body>
<div class="scene">
  <div class="dish"></div>
  <div class="vignette"></div>
  <div class="bottom-grad"></div>
  <canvas id="c"></canvas>
  <div class="corner">Hungry?</div>
  <div class="label">
    <div class="label-num">04 &nbsp;/&nbsp; Slow-Cooked Comfort</div>
    <div class="label-name">Dal Makhani</div>
    <div class="label-bar"></div>
    <div class="label-sub">Black lentils &nbsp;·&nbsp; Overnight simmer &nbsp;·&nbsp; Cream finish</div>
  </div>
  <div class="progress"></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');canvas.width=canvas.height=820;const C=['#c9922a','#f5d98e','#ff8c00','#fff3c4'];class E{constructor(){this.reset(true)}reset(init){this.x=Math.random()*820;this.y=init?Math.random()*820:830;this.vx=(Math.random()-.5)*.5;this.vy=-(0.3+Math.random()*.9);this.r=.5+Math.random()*1.8;this.col=C[Math.floor(Math.random()*C.length)];this.alpha=0;this.life=0;this.maxLife=120+Math.random()*200;this.flicker=Math.random()*Math.PI*2}update(){this.life++;this.x+=this.vx+Math.sin(this.life*.04+this.flicker)*.25;this.y+=this.vy;const t=this.life/this.maxLife;this.alpha=(t<.15?t/.15:t>.75?(1-t)/.25:1)*.45;if(this.life>=this.maxLife||this.y<-10)this.reset(false)}draw(){ctx.save();ctx.globalAlpha=this.alpha;ctx.shadowColor=this.col;ctx.shadowBlur=this.r*5;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
const embers=Array.from({length:55},()=>new E());(function loop(){ctx.clearRect(0,0,820,820);embers.forEach(e=>{e.update();e.draw()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
