<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicken Biryani — The Sheedi's Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{width:100vw;height:100vh;background:#111;overflow:hidden;}

.stage{
  position:absolute;width:1080px;height:1920px;
  transform-origin:top left;overflow:hidden;
  background:
    radial-gradient(ellipse 85% 50% at 50% 15%,#FFF5DF 0%,transparent 65%),
    radial-gradient(ellipse 65% 40% at 50% 88%,#FDEBD0 0%,transparent 55%),
    linear-gradient(165deg,#FFFBF3 0%,#FFF6E8 40%,#FEF2DC 100%);
}
.stage::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(160,90,10,.05) 1px,transparent 1px);
  background-size:26px 26px;pointer-events:none;
}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}

/* ── CORNER ORNAMENTS ──────────────────────────── */
.corner-svg{position:absolute;width:90px;height:90px;pointer-events:none;z-index:4;}
.corner-svg.tl{top:32px;left:32px;}
.corner-svg.tr{top:32px;right:32px;transform:scaleX(-1);}
.corner-svg.bl{bottom:32px;left:32px;transform:scaleY(-1);}
.corner-svg.br{bottom:32px;right:32px;transform:scale(-1,-1);}
.cp{fill:none;stroke:#C9922A;stroke-width:1.4;stroke-dasharray:300;stroke-dashoffset:300;}
.cp2{fill:none;stroke:rgba(201,146,42,.38);stroke-width:.7;stroke-dasharray:180;stroke-dashoffset:180;}
.cdot{fill:#C9922A;opacity:0;}
.ctick{stroke:#C9922A;stroke-width:1.2;opacity:0;}

/* ── BORDER LINES ──────────────────────────────── */
.bline{position:absolute;left:60px;right:60px;height:1.5px;
  background:linear-gradient(90deg,transparent,#C9922A,transparent);
  transform:scaleX(0);transform-origin:center;}
.bline.t1{top:42px;}.bline.t2{top:50px;height:.6px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.45),transparent);}
.bline.b1{bottom:42px;}.bline.b2{bottom:50px;height:.6px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.45),transparent);}

/* ── LOGO ──────────────────────────────────────── */
.logo-wrap{
  position:absolute;top:72px;left:0;right:0;
  display:flex;justify-content:center;z-index:6;opacity:0;
}
.logo-circle{
  width:160px;height:160px;border-radius:50%;overflow:hidden;
  background:#6B1A1A;
  border:2px solid rgba(201,146,42,.60);
  box-shadow:0 0 0 6px rgba(201,146,42,.10),0 8px 35px rgba(80,10,5,.30);
  transform:scale(0) rotate(-180deg);
}
.logo-circle img{width:100%;height:100%;object-fit:cover;}

/* ── SPECIAL BANNER ─────────────────────────────── */
.special-banner{
  position:absolute;top:252px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  gap:14px;z-index:5;opacity:0;
}
.banner-pill{
  background:#1A4A2E;
  border:1.5px solid rgba(201,146,42,.60);
  border-radius:50px;
  padding:12px 40px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 20px rgba(26,74,46,.30),inset 0 1px 0 rgba(255,255,255,.06);
}
.banner-leaf{width:22px;height:22px;opacity:.90;}
.banner-txt{
  font-family:'Dancing Script',cursive;font-size:34px;
  color:#F5D98E;letter-spacing:1px;
  text-shadow:0 0 12px rgba(245,217,142,.35);
}

/* ── TITLE BLOCK ────────────────────────────────── */
.title-block{
  position:absolute;top:338px;left:0;right:0;
  text-align:center;z-index:5;
}
.dish-cat{
  font-family:'Cinzel',serif;font-size:20px;letter-spacing:9px;
  color:#C0501A;text-transform:uppercase;
  opacity:0;transform:translateY(12px);
  margin-bottom:6px;
}
.title-main{
  font-family:'Playfair Display',serif;font-weight:900;
  font-size:128px;line-height:.95;
  color:#1A4A2E;
  -webkit-text-stroke:2px rgba(201,146,42,.55);
  text-shadow:0 4px 24px rgba(26,74,46,.18);
  padding-bottom:12px;
}
.title-main .char{display:inline-block;opacity:0;transform:translateY(55px);}
.title-main .spc{display:inline-block;width:.28em;}

.title-orn{
  display:flex;align-items:center;justify-content:center;
  gap:10px;margin-top:4px;opacity:0;
}
.to-line{width:90px;height:1px;background:linear-gradient(90deg,transparent,#C9922A,transparent);transform:scaleX(0);transform-origin:center;}
.to-gem{width:7px;height:7px;background:#C9922A;transform:rotate(45deg) scale(0);}
.to-sm{width:4px;height:4px;background:#F5D98E;transform:rotate(45deg) scale(0);}

/* ── CONTENT AREA ───────────────────────────────── */
.side-tagline{
  position:absolute;left:24px;top:748px;
  width:175px;z-index:6;
}
.st-line{
  font-family:'Playfair Display',serif;
  font-size:28px;line-height:1.35;
  color:#1A4A2E;font-weight:700;
  opacity:0;transform:translateX(-30px);
  display:block;
}
.st-line.italic{
  font-style:italic;font-weight:500;
  font-size:30px;color:#C0501A;
  margin-top:4px;
}
.st-line.italic::after{
  content:'';display:block;width:60px;height:2px;
  background:linear-gradient(90deg,#C9922A,transparent);
  margin-top:8px;
}

.dish2-wrap{
  position:absolute;right:22px;top:602px;
  width:162px;height:162px;border-radius:50%;overflow:hidden;
  border:2.5px solid rgba(201,146,42,.50);
  box-shadow:0 0 0 6px rgba(201,146,42,.08),0 8px 30px rgba(80,40,5,.22);
  opacity:0;transform:scale(0);z-index:5;
}
.dish2-wrap img{width:100%;height:100%;object-fit:cover;}

.dish2-label{
  position:absolute;right:22px;top:774px;
  width:162px;text-align:center;z-index:5;opacity:0;
}
.dish2-label span{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;
  color:rgba(26,74,46,.65);text-transform:uppercase;
}

/* ── DISH ───────────────────────────────────────── */
.dish-area{
  position:absolute;top:558px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  z-index:3;
}
.dish-outer{
  width:610px;height:610px;border-radius:50%;
  border:1.5px solid rgba(201,146,42,.22);
  box-shadow:0 0 0 10px rgba(201,146,42,.06);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.4) translateY(100px);
  position:relative;
}
.dish-outer::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,
    rgba(201,146,42,0) 70deg,rgba(201,146,42,.70) 120deg,
    rgba(245,217,142,.75) 155deg,rgba(201,146,42,.70) 190deg,
    rgba(201,146,42,0) 250deg,transparent 360deg);
  animation:spinRing 5s linear infinite;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),black calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),black calc(100% - 2px));
}
@keyframes spinRing{to{transform:rotate(360deg);}}
.dish-inner{
  width:574px;height:574px;border-radius:50%;overflow:hidden;
  border:2.5px solid rgba(201,146,42,.38);
  box-shadow:0 18px 70px rgba(80,40,5,.22),inset 0 0 25px rgba(255,220,150,.05);
  animation:dishSpin 32s linear infinite;
}
.dish-inner img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);}
@keyframes dishSpin{to{transform:rotate(360deg);}}
.dish-ring-deco{position:absolute;width:650px;height:650px;border-radius:50%;
  border:1px solid rgba(201,146,42,.08);pointer-events:none;}

/* ── ORDER NOW BADGE ────────────────────────────── */
.cta{
  position:absolute;left:836px;top:830px;
  width:175px;height:175px;
  display:flex;align-items:center;justify-content:center;
  z-index:8;opacity:0;transform:scale(0) rotate(-20deg);
  filter:drop-shadow(-5px 4px 15px rgba(0,0,0,.25));
}
.cta-star{
  position:absolute;inset:0;background:#1A4A2E;
  clip-path:polygon(50% 0%,62% 14%,80% 8%,76% 27%,95% 30%,84% 46%,
    97% 57%,82% 65%,90% 83%,71% 82%,65% 99%,50% 90%,
    35% 99%,29% 82%,10% 83%,18% 65%,3% 57%,16% 46%,
    5% 30%,24% 27%,20% 8%,38% 14%);
}
.cta-pulse{
  position:absolute;inset:-12px;border-radius:50%;
  border:2px solid rgba(26,74,46,.40);
  opacity:0;animation:ctaPulse 2.2s ease-out infinite;
}
@keyframes ctaPulse{0%{transform:scale(.85);opacity:.7;}100%{transform:scale(1.5);opacity:0;}}
.cta-txt{position:relative;z-index:1;text-align:center;}
.cta-txt span{display:block;font-family:'Cinzel',serif;font-weight:600;color:#F5D98E;letter-spacing:2px;}
.cta-txt .l1{font-size:22px;}
.cta-txt .l2{font-size:30px;margin-top:2px;}

/* ── SALADS SECTION ─────────────────────────────── */
.salads-section{
  position:absolute;top:1188px;left:0;right:0;
  z-index:5;opacity:0;
}
.salads-header{
  display:flex;align-items:center;justify-content:center;
  gap:16px;margin-bottom:18px;
}
.sal-hline{
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,146,42,.55),transparent);
}
.salads-title{
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:5px;
  color:rgba(26,74,46,.70);text-transform:uppercase;
}
.salads-row{
  display:flex;align-items:flex-start;justify-content:center;
  gap:40px;padding:0 60px;
}
.sal-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;transform:translateY(24px) scale(.85);
}
.sal-circle{
  width:128px;height:128px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(201,146,42,.45);
  box-shadow:0 0 0 5px rgba(201,146,42,.07),0 6px 24px rgba(60,40,5,.18);
}
.sal-circle img{width:100%;height:100%;object-fit:cover;}
.sal-name{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;
  color:rgba(26,74,46,.65);text-transform:uppercase;text-align:center;
  line-height:1.5;
}

/* ── INFO BAR ───────────────────────────────────── */
.info-bar{
  position:absolute;top:1414px;left:0;right:0;
  height:148px;
  background:linear-gradient(135deg,#1A4A2E 0%,#143D24 60%,#1A4A2E 100%);
  border-top:1.5px solid rgba(201,146,42,.45);
  border-bottom:1.5px solid rgba(201,146,42,.45);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 30px;z-index:5;
  opacity:0;transform:translateY(30px);
}
.info-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  flex:1;
}
.info-icon{
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid rgba(201,146,42,.55);
  display:flex;align-items:center;justify-content:center;
}
.info-icon svg{width:22px;height:22px;}
.info-label{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;
  color:#F5D98E;text-transform:uppercase;text-align:center;line-height:1.4;
}
.info-divider{width:1px;height:70px;background:rgba(201,146,42,.30);}
.bar-leaf{position:absolute;opacity:.22;width:50px;}
.bar-leaf.l{left:16px;}
.bar-leaf.r{right:16px;transform:scaleX(-1);}

/* ── CONTACT ROW ────────────────────────────────── */
.contact-row{
  position:absolute;top:1582px;left:80px;right:80px;
  display:flex;align-items:center;justify-content:center;
  z-index:5;opacity:0;
}
.contact-pill{
  display:flex;align-items:center;gap:14px;
  border:1.5px solid rgba(201,146,42,.55);
  border-radius:50px;padding:13px 44px;
  background:rgba(201,146,42,.06);
}
.contact-icon{color:#C9922A;font-size:20px;}
.contact-num{
  font-family:'Cinzel',serif;font-size:26px;font-weight:600;
  color:#1A4A2E;letter-spacing:3px;
}

/* ── BOTTOM LINES ───────────────────────────────── */
.come-line{
  position:absolute;top:1666px;left:0;right:0;
  text-align:center;z-index:5;opacity:0;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
.come-orn{width:50px;height:1px;background:linear-gradient(90deg,transparent,#C9922A,transparent);}
.come-txt{
  font-family:'Cinzel',serif;font-size:17px;letter-spacing:8px;
  color:rgba(26,74,46,.65);text-transform:uppercase;
}

/* Word-by-word tagline */
.tagline{
  position:absolute;top:1710px;left:70px;right:70px;
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:30px;line-height:1.50;text-align:center;
  color:rgba(90,20,20,.65);z-index:5;
}
.tagline .word{
  display:inline-block;opacity:0;
  transform:translateY(16px);filter:blur(6px);
}
.tagline .word.accent{color:#1A4A2E;}
.tagline .word+.word{margin-left:.26em;}
.tagline .br{display:block;height:.06em;}

/* ── FLASH ──────────────────────────────────────── */
.flash{
  position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 72% 52% at 50% 36%,
    rgba(255,248,230,.85) 0%,rgba(245,215,140,.60) 32%,
    rgba(201,146,42,.25) 62%,transparent 84%);
}
@keyframes flashBurst{0%{opacity:.82}20%{opacity:.40}100%{opacity:0}}
.flash.pop{animation:flashBurst .52s ease-out forwards}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="flash" id="fl"></div>

  <!-- Corner ornaments -->
  <svg class="corner-svg tl" viewBox="0 0 90 90">
    <path class="cp"  d="M8 82 L8 8 L82 8"/>
    <path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/>
    <line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/>
    <line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>
  <svg class="corner-svg tr" viewBox="0 0 90 90">
    <path class="cp"  d="M8 82 L8 8 L82 8"/>
    <path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/>
    <line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/>
    <line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>
  <svg class="corner-svg bl" viewBox="0 0 90 90">
    <path class="cp"  d="M8 82 L8 8 L82 8"/>
    <path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/>
    <line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/>
    <line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>
  <svg class="corner-svg br" viewBox="0 0 90 90">
    <path class="cp"  d="M8 82 L8 8 L82 8"/>
    <path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/>
    <line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/>
    <line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>

  <!-- Border lines -->
  <div class="bline t1" id="bt1"></div>
  <div class="bline t2" id="bt2"></div>
  <div class="bline b1" id="bb1"></div>
  <div class="bline b2" id="bb2"></div>

  <!-- Logo -->
  <div class="logo-wrap" id="logoWrap">
    <div class="logo-circle" id="logoCircle">
      <img src="sheedi_logo.jpeg" alt="The Sheedi's Restaurant">
    </div>
  </div>

  <!-- "Signature Special" green banner -->
  <div class="special-banner" id="specialBanner">
    <div class="banner-pill">
      <svg class="banner-leaf" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6 8 4 14 8 20c2-4 6-7 10-8C14 8 12 2 12 2z" fill="rgba(245,217,142,.80)"/>
        <path d="M12 2C18 8 20 14 16 20" stroke="rgba(245,217,142,.60)" stroke-width=".8" fill="none"/>
      </svg>
      <span class="banner-txt">Signature Special</span>
      <svg class="banner-leaf" viewBox="0 0 24 24" fill="none" style="transform:scaleX(-1)">
        <path d="M12 2C6 8 4 14 8 20c2-4 6-7 10-8C14 8 12 2 12 2z" fill="rgba(245,217,142,.80)"/>
        <path d="M12 2C18 8 20 14 16 20" stroke="rgba(245,217,142,.60)" stroke-width=".8" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- Title block -->
  <div class="title-block">
    <div class="dish-cat" id="dishCat">Chicken</div>
    <div class="title-main" id="titleMain"></div>
    <div class="title-orn" id="titleOrn">
      <div class="to-line" id="tol1"></div>
      <div class="to-sm"  id="tos1"></div>
      <div class="to-gem" id="tog"></div>
      <div class="to-sm"  id="tos2"></div>
      <div class="to-line" id="tol2"></div>
    </div>
  </div>

  <!-- Left side tagline (beside dish) -->
  <div class="side-tagline" id="sideTagline">
    <span class="st-line" id="stl1">Slow</span>
    <span class="st-line" id="stl2">Cooked.</span>
    <span class="st-line" id="stl3">Boldly Spiced.</span>
    <span class="st-line italic" id="stl4">Unforgettable.</span>
  </div>

  <!-- Second dish image (top right) -->
  <div class="dish2-wrap" id="dish2Wrap">
    <img src="raita_bowl.jpg" alt="Sides">
  </div>
  <div class="dish2-label" id="dish2Label">
    <span>Sides &amp; Extras</span>
  </div>

  <!-- Main dish -->
  <div class="dish-area">
    <div class="dish-outer" id="dishOuter">
      <div class="dish-ring-deco"></div>
      <div class="dish-inner">
        <img src="biryani_dish2.jpg" alt="Chicken Biryani">
      </div>
    </div>
  </div>

  <!-- Order Now badge -->
  <div class="cta" id="ctaBadge">
    <div class="cta-star"></div>
    <div class="cta-pulse" id="ctaPulse"></div>
    <div class="cta-txt">
      <span class="l1">Order</span>
      <span class="l2">Now</span>
    </div>
  </div>

  <!-- ── SALADS SECTION ── -->
  <div class="salads-section" id="saladsSection">
    <div class="salads-header">
      <div class="sal-hline"></div>
      <span class="salads-title">Salads &amp; Fresh Sides</span>
      <div class="sal-hline"></div>
    </div>
    <div class="salads-row">
      <div class="sal-item" id="sal1">
        <div class="sal-circle">
          <img src="salad1.jpg" alt="Garden Salad">
        </div>
        <span class="sal-name">Garden<br>Salad</span>
      </div>
      <div class="sal-item" id="sal2">
        <div class="sal-circle">
          <img src="salad2.jpg" alt="Greek Salad">
        </div>
        <span class="sal-name">Greek<br>Salad</span>
      </div>
      <div class="sal-item" id="sal3">
        <div class="sal-circle">
          <img src="salad3.jpg" alt="Kachumber Salad">
        </div>
        <span class="sal-name">Kachumber<br>Salad</span>
      </div>
    </div>
  </div>

  <!-- Info bar -->
  <div class="info-bar" id="infoBar">
    <svg class="bar-leaf l" viewBox="0 0 55 80" fill="none">
      <path d="M28 78C28 78 8 60 8 35 8 15 28 2 28 2s20 13 20 33c0 25-20 43-20 43z" fill="#F5D98E"/>
      <line x1="28" y1="78" x2="28" y2="2" stroke="#C9922A" stroke-width=".8"/>
      <path d="M28 20 Q18 28 12 38M28 32 Q20 38 16 48M28 44 Q22 50 20 58" stroke="#C9922A" stroke-width=".6" fill="none"/>
    </svg>
    <div class="info-item" id="ii1">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5D98E" stroke-width="1.5">
          <path d="M3 16c0-4 2-8 9-8s9 4 9 8H3z"/>
          <line x1="12" y1="8" x2="12" y2="5"/>
          <line x1="8" y1="20" x2="16" y2="20"/>
          <line x1="3" y1="16" x2="21" y2="16"/>
        </svg>
      </div>
      <div class="info-label">Authentic<br>Flavors</div>
    </div>
    <div class="info-divider"></div>
    <div class="info-item" id="ii2">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5D98E" stroke-width="1.5">
          <path d="M12 2C8 6 6 10 8 15c1 3 4 5 4 5s3-2 4-5c2-5 0-9-4-13z"/>
          <line x1="12" y1="20" x2="12" y2="22"/>
          <path d="M9 12c1-2 3-3 3-3s2 1 3 3"/>
        </svg>
      </div>
      <div class="info-label">Fresh<br>Ingredients</div>
    </div>
    <div class="info-divider"></div>
    <div class="info-item" id="ii3">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5D98E" stroke-width="1.5">
          <path d="M12 21C12 21 3 14 3 8a5 5 0 0110 0 5 5 0 0110 0c0 6-9 13-9 13z"/>
        </svg>
      </div>
      <div class="info-label">Made<br>With Love</div>
    </div>
    <svg class="bar-leaf r" viewBox="0 0 55 80" fill="none">
      <path d="M28 78C28 78 8 60 8 35 8 15 28 2 28 2s20 13 20 33c0 25-20 43-20 43z" fill="#F5D98E"/>
      <line x1="28" y1="78" x2="28" y2="2" stroke="#C9922A" stroke-width=".8"/>
      <path d="M28 20 Q18 28 12 38M28 32 Q20 38 16 48M28 44 Q22 50 20 58" stroke="#C9922A" stroke-width=".6" fill="none"/>
    </svg>
  </div>

  <!-- Contact row -->
  <div class="contact-row" id="contactRow">
    <div class="contact-pill">
      <span class="contact-icon">📞</span>
      <span class="contact-num">+994 50 754 73 16</span>
    </div>
  </div>

  <!-- COME. INDULGE. ENJOY. -->
  <div class="come-line" id="comeLine">
    <div class="come-orn"></div>
    <span class="come-txt">Come · Indulge · Enjoy</span>
    <div class="come-orn"></div>
  </div>

  <!-- Word-by-word tagline -->
  <div class="tagline" id="tagline"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
/* Scale */
(function(){
  const s=document.getElementById('stage');
  function fit(){
    const scl=Math.min(window.innerWidth/1080,window.innerHeight/1920);
    s.style.transform=`scale(${scl})`;
    s.style.left=Math.max(0,(window.innerWidth-1080*scl)/2)+'px';
    s.style.top=Math.max(0,(window.innerHeight-1920*scl)/2)+'px';
  }
  fit(); window.addEventListener('resize',fit);
})();

/* Particles */
const cv=document.getElementById('cv');
cv.width=1080; cv.height=1920;
const ctx=cv.getContext('2d');

/* Dish steam sources — dish center (540, 863), inner radius ~287 */
const STEAM_SOURCES=[
  {x:408,y:638},{x:458,y:616},{x:510,y:608},
  {x:568,y:608},{x:622,y:616},{x:672,y:638},
];
let steamEnabled=false;

class DishSteam{
  constructor(src){this.src=src;this.live=false;this.reset();}
  reset(){
    this.x=this.src.x+(Math.random()-.5)*32;
    this.y=this.src.y+Math.random()*18;
    this.vx=(Math.random()-.5)*.36; this.vy=-(0.72+Math.random()*1.0);
    this.r=9+Math.random()*8; this.gr=0.20+Math.random()*.26;
    this.l=0; this.ml=90+Math.random()*115;
    this.w=Math.random()*Math.PI*2; this.del=Math.floor(Math.random()*85);
    this.live=false;
  }
  tick(){
    if(!steamEnabled)return;
    if(this.del>0){this.del--;return;}
    this.live=true; this.l++;
    this.x+=this.vx+Math.sin(this.l*.038+this.w)*.52;
    this.y+=this.vy; this.r+=this.gr;
    const t=this.l/this.ml;
    this.a=(t<.18?t/.18:t>.55?(1-t)/.45:1)*.14;
    if(this.l>=this.ml||this.y<345)this.reset();
  }
  draw(){
    if(!this.live||this.a<=0)return;
    const R=this.r*2.2;
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,R);
    g.addColorStop(0,`rgba(255,253,248,${Math.min(this.a*2,.21)})`);
    g.addColorStop(.30,`rgba(255,250,242,${this.a})`);
    g.addColorStop(.65,`rgba(255,247,236,${this.a*.50})`);
    g.addColorStop(1,'transparent');
    ctx.save(); ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,R,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Dot{
  constructor(){this.reset(true);}
  reset(init){
    this.x=60+Math.random()*960; this.y=init?Math.random()*1920:1940;
    this.vx=(Math.random()-.5)*.25; this.vy=-(0.16+Math.random()*.42);
    this.r=.4+Math.random()*1.6; this.l=0; this.ml=260+Math.random()*420;
    this.c=['#C9922A','#F5D98E','#1A4A2E','#D4A843'][Math.floor(Math.random()*4)];
    this.w=Math.random()*Math.PI*2;
  }
  tick(){
    this.l++; this.x+=this.vx+Math.sin(this.l*.020+this.w)*.20; this.y+=this.vy;
    const t=this.l/this.ml;
    this.a=(t<.12?t/.12:t>.80?(1-t)/.20:1)*.18;
    if(this.l>=this.ml||this.y<-5)this.reset(false);
  }
  draw(){
    ctx.save(); ctx.globalAlpha=this.a; ctx.fillStyle=this.c;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

const dishSteams=STEAM_SOURCES.flatMap(src=>Array.from({length:3},()=>new DishSteam(src)));
const dots=Array.from({length:26},()=>new Dot());

(function loop(){
  ctx.clearRect(0,0,1080,1920);
  dishSteams.forEach(s=>{s.tick();s.draw();});
  dots.forEach(d=>{d.tick();d.draw();});
  requestAnimationFrame(loop);
})();

/* Flash */
const flEl=document.getElementById('fl');
function flash(){flEl.classList.remove('pop');void flEl.offsetWidth;flEl.classList.add('pop');}

/* Char split for title */
function buildChars(el,text){
  el.innerHTML=text.split('').map(ch=>
    ch===' '?`<span class="spc"> </span>`:`<span class="char">${ch}</span>`
  ).join('');
}

/* Word-by-word tagline */
const TAGLINE_WORDS=[
  {text:'Slow-cooked'},{text:'with'},{text:'aromatic',accent:true},
  {text:'spices,'},{text:'tender',br:true},{text:'chicken',accent:true},
  {text:'&'},{text:'fragrant',accent:true},{text:'basmati'},
  {text:'—'},{text:'a',br:true},{text:'taste'},{text:'of'},
  {text:'tradition',accent:true},{text:'in'},{text:'every'},{text:'bite.'},
];
function buildTagline(el){
  el.innerHTML=TAGLINE_WORDS.map(w=>{
    const br=w.br?'<span class="br"></span>':'';
    const cls='word'+(w.accent?' accent':'');
    return `${br}<span class="${cls}">${w.text}</span>`;
  }).join('');
}
function animateTagline(){
  const el=document.getElementById('tagline');
  buildTagline(el);
  anime({targets:'#tagline .word',opacity:[0,1],translateY:[18,0],
    filter:['blur(6px)','blur(0px)'],easing:'easeOutCubic',
    duration:560,delay:anime.stagger(90,{start:0})});
}

/* Corner path animation */
function animateCorners(){
  anime({targets:'.cp',strokeDashoffset:[anime.setDashoffset,0],
    easing:'easeInOutSine',duration:1500,delay:anime.stagger(80)});
  setTimeout(()=>{
    anime({targets:'.cp2',strokeDashoffset:[anime.setDashoffset,0],
      easing:'easeInOutSine',duration:1000,delay:anime.stagger(60)});
    anime({targets:['.cdot','.ctick'],opacity:[0,1],easing:'easeOutQuad',
      duration:300,delay:anime.stagger(40)});
  },600);
}

/* Salad items stagger pop in */
function animateSalads(){
  anime({
    targets:['#sal1','#sal2','#sal3'],
    opacity:[0,1],translateY:[24,0],scale:[.85,1],
    easing:'easeOutBack',duration:600,
    delay:anime.stagger(120,{start:0}),
  });
}

/* ── GSAP TIMELINE ──────────────────────────────── */
const tl=gsap.timeline({defaults:{ease:'power2.out'}});

/* Initial states */
gsap.set(['#logoWrap','#specialBanner','#infoBar','#contactRow',
          '#comeLine','#dish2Wrap','#dish2Label','#saladsSection'],{opacity:0});
gsap.set('#logoCircle',{scale:0,rotation:-180});
gsap.set(['#bt1','#bt2','#bb1','#bb2'],{scaleX:0});
gsap.set('#dishOuter',{opacity:0,scale:.4,y:100});
gsap.set('.dish-cat',{opacity:0,y:14});
gsap.set('.char',{opacity:0,y:55});
gsap.set('#titleOrn',{opacity:0});
gsap.set(['#tol1','#tol2'],{scaleX:0});
gsap.set(['#tog','#tos1','#tos2'],{scale:0});
gsap.set(['#stl1','#stl2','#stl3','#stl4'],{opacity:0,x:-30});
gsap.set('#ctaBadge',{opacity:0,scale:0,rotation:-20});
gsap.set('#ctaPulse',{opacity:0});
gsap.set('#dish2Wrap',{opacity:0,scale:0});
gsap.set('#infoBar',{opacity:0,y:30});
gsap.set(['#sal1','#sal2','#sal3'],{opacity:0,y:24,scale:.85});

/* 0.0s — flash + borders + corners */
tl.add(()=>{ flash(); animateCorners(); }, 0)
  .to(['#bt1','#bt2','#bb1','#bb2'],{scaleX:1,duration:1.1,stagger:.06},0.05);

/* 0.7s — logo spins in */
tl.to('#logoWrap',{opacity:1,duration:.1},0.7)
  .to('#logoCircle',{scale:1,rotation:0,duration:.95,ease:'back.out(1.6)'},0.7);

/* 1.3s — banner drops in */
tl.to('#specialBanner',{opacity:1,y:0,duration:.55,ease:'back.out(1.4)'},1.3);
gsap.set('#specialBanner',{y:-20});

/* 1.8s — title */
tl.add(()=>flash(),1.8)
  .to('.dish-cat',{opacity:1,y:0,duration:.5},1.9)
  .add(()=>{
    buildChars(document.getElementById('titleMain'),'BIRYANI');
    anime({targets:'#titleMain .char',opacity:[0,1],translateY:[55,0],
      easing:'easeOutCubic',duration:460,delay:anime.stagger(65)});
  },2.1);

/* 2.8s — title ornament */
tl.to('#titleOrn',{opacity:1,duration:.2},2.8)
  .to(['#tol1','#tol2'],{scaleX:1,duration:.6,stagger:.07},2.85)
  .to(['#tos1','#tos2','#tog'],{scale:1,duration:.3,ease:'back.out(2)',stagger:.07},3.1);

/* 3.0s — dish rises */
tl.add(()=>flash(),3.0)
  .to('#dishOuter',{opacity:1,scale:1,y:0,duration:1.2,ease:'back.out(1.2)'},3.1)
  .add(()=>{ steamEnabled=true; },4.4);

/* 3.6s — second dish image */
tl.to('#dish2Wrap',{opacity:1,scale:1,duration:.65,ease:'back.out(2)'},3.6)
  .to('#dish2Label',{opacity:1,duration:.4},4.1);

/* 3.8s — left side tagline */
tl.to('#stl1',{opacity:1,x:0,duration:.5,ease:'back.out(1.4)'},3.8)
  .to('#stl2',{opacity:1,x:0,duration:.5,ease:'back.out(1.4)'},4.05)
  .to('#stl3',{opacity:1,x:0,duration:.5,ease:'back.out(1.4)'},4.25)
  .to('#stl4',{opacity:1,x:0,duration:.5,ease:'back.out(1.4)'},4.48);

/* 4.3s — Order Now badge */
tl.add(()=>flash(),4.3)
  .to('#ctaBadge',{opacity:1,scale:1,rotation:0,duration:.7,ease:'back.out(2.2)'},4.4)
  .to('#ctaPulse',{opacity:1,duration:.1},5.0);

/* 5.1s — salads section fades in, then circles pop */
tl.to('#saladsSection',{opacity:1,duration:.4},5.1)
  .add(()=>animateSalads(),5.2);

/* 5.9s — info bar slides up */
tl.to('#infoBar',{opacity:1,y:0,duration:.7},5.9);

/* 6.7s — contact row */
tl.to('#contactRow',{opacity:1,duration:.6},6.7);

/* 7.2s — COME. INDULGE. ENJOY. */
tl.to('#comeLine',{opacity:1,duration:.5},7.2);

/* 7.6s — word-by-word tagline */
tl.add(()=>animateTagline(),7.6);
</script>
</body>
</html>
