<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicken Biryani — The Sheedi's Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{width:100vw;height:100vh;background:#111;overflow:hidden;}

.stage{
  position:absolute;width:1080px;height:1920px;
  transform-origin:top left;overflow:hidden;
  background:
    radial-gradient(ellipse 85% 50% at 50% 15%,#FFF5DF 0%,transparent 65%),
    radial-gradient(ellipse 65% 40% at 50% 88%,#FDEBD0 0%,transparent 55%),
    linear-gradient(165deg,#FFFBF3 0%,#FFF6E8 40%,#FEF2DC 100%);
}
.stage::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(160,90,10,.05) 1px,transparent 1px);
  background-size:26px 26px;pointer-events:none;
}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}

/* ── DECO ELEMENTS ──────────────────────────────── */
.deco{position:absolute;pointer-events:none;z-index:2;}

/* ── CORNER ORNAMENTS ──────────────────────────── */
.corner-svg{position:absolute;width:90px;height:90px;pointer-events:none;z-index:14;}
.corner-svg.tl{top:32px;left:32px;}
.corner-svg.tr{top:32px;right:32px;transform:scaleX(-1);}
.corner-svg.bl{bottom:32px;left:32px;transform:scaleY(-1);}
.corner-svg.br{bottom:32px;right:32px;transform:scale(-1,-1);}
.cp{fill:none;stroke:#C9922A;stroke-width:1.4;stroke-dasharray:300;stroke-dashoffset:300;}
.cp2{fill:none;stroke:rgba(201,146,42,.38);stroke-width:.7;stroke-dasharray:180;stroke-dashoffset:180;}
.cdot{fill:#C9922A;opacity:0;}
.ctick{stroke:#C9922A;stroke-width:1.2;opacity:0;}

/* ── BORDER LINES ──────────────────────────────── */
.bline{position:absolute;left:60px;right:60px;height:1.5px;
  background:linear-gradient(90deg,transparent,#C9922A,transparent);
  transform:scaleX(0);transform-origin:center;}
.bline.t1{top:42px;}.bline.t2{top:50px;height:.6px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.45),transparent);}
.bline.b1{bottom:42px;}.bline.b2{bottom:50px;height:.6px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.45),transparent);}

/* ── LOGO ──────────────────────────────────────── */
.logo-wrap{position:absolute;top:72px;left:0;right:0;display:flex;justify-content:center;z-index:6;opacity:0;}
.logo-circle{
  width:160px;height:160px;border-radius:50%;overflow:hidden;
  background:#6B1A1A;border:2px solid rgba(201,146,42,.60);
  box-shadow:0 0 0 6px rgba(201,146,42,.10),0 8px 35px rgba(80,10,5,.30);
  transform:scale(0) rotate(-180deg);
}
.logo-circle img{width:100%;height:100%;object-fit:cover;}

/* ── SPECIAL BANNER ─────────────────────────────── */
.special-banner{position:absolute;top:252px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:5;opacity:0;}
.banner-pill{
  background:#1A4A2E;border:1.5px solid rgba(201,146,42,.60);border-radius:50px;
  padding:12px 40px;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 20px rgba(26,74,46,.30),inset 0 1px 0 rgba(255,255,255,.06);
}
.banner-leaf{width:22px;height:22px;opacity:.90;}
.banner-txt{font-family:'Dancing Script',cursive;font-size:40px;font-weight:700;color:#FFE97A;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.25);}

/* ── TITLE ──────────────────────────────────────── */
.title-block{position:absolute;top:338px;left:0;right:0;text-align:center;z-index:5;}
.dish-cat{font-family:'Cinzel',serif;font-size:26px;font-weight:600;letter-spacing:10px;color:#B83800;text-transform:uppercase;opacity:0;transform:translateY(12px);margin-bottom:8px;text-shadow:0 2px 8px rgba(184,56,0,.18);}
.title-main{font-family:'Playfair Display',serif;font-weight:900;font-size:136px;line-height:.93;color:#133A22;-webkit-text-stroke:2.5px rgba(201,146,42,.70);text-shadow:0 6px 28px rgba(26,74,46,.28),0 2px 0 rgba(26,74,46,.12);padding-bottom:14px;}
.title-main .char{display:inline-block;opacity:0;transform:translateY(55px);}
.title-main .spc{display:inline-block;width:.28em;}
.title-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;opacity:0;}
.to-line{width:90px;height:1px;background:linear-gradient(90deg,transparent,#C9922A,transparent);transform:scaleX(0);transform-origin:center;}
.to-gem{width:7px;height:7px;background:#C9922A;transform:rotate(45deg) scale(0);}
.to-sm{width:4px;height:4px;background:#F5D98E;transform:rotate(45deg) scale(0);}

/* ── DUAL DISH AREA ─────────────────────────────── */
.dual-dish-area{
  position:absolute;top:538px;left:0;right:0;
  display:flex;justify-content:center;align-items:flex-start;
  gap:28px;z-index:3;padding:0 62px;
}
.dish-col{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  flex:1;max-width:462px;
}
.dish-outer{
  width:462px;height:462px;border-radius:50%;
  border:2px solid rgba(201,146,42,.28);
  box-shadow:0 0 0 10px rgba(201,146,42,.07),0 20px 60px rgba(80,40,5,.18);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.4) translateY(80px);position:relative;
}
.dish-outer::before{
  content:'';position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,
    rgba(201,146,42,0) 70deg,rgba(201,146,42,.80) 115deg,
    rgba(245,217,142,.90) 152deg,rgba(201,146,42,.80) 188deg,
    rgba(201,146,42,0) 250deg,transparent 360deg);
  animation:spinRing 5s linear infinite;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),black calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),black calc(100% - 2px));
}
.dish-outer.rev::before{animation-direction:reverse;animation-duration:6s;}
@keyframes spinRing{to{transform:rotate(360deg);}}
.dish-inner{
  width:432px;height:432px;border-radius:50%;overflow:hidden;
  border:3px solid rgba(201,146,42,.45);
  box-shadow:0 16px 60px rgba(80,40,5,.26),inset 0 0 30px rgba(255,220,150,.06);
  animation:dishSpin 30s linear infinite;
}
.dish-inner.rev{animation-direction:reverse;animation-duration:28s;}
.dish-inner img{width:100%;height:100%;object-fit:cover;transform:scale(1.10);}
@keyframes dishSpin{to{transform:rotate(360deg);}}

/* Dish name label under each circle */
.dish-label{
  font-family:'Cinzel',serif;font-size:15px;font-weight:600;
  letter-spacing:4px;color:#0F3018;text-transform:uppercase;
  text-align:center;padding-bottom:10px;
  border-bottom:2px solid rgba(201,146,42,.50);
  opacity:0;
}
.dish-label span{
  display:block;font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:18px;letter-spacing:1px;
  color:#B83800;margin-top:5px;font-weight:500;
}

/* ── ORDER NOW ──────────────────────────────────── */
.cta{position:absolute;left:50%;top:942px;transform:translateX(-50%) scale(0) rotate(-20deg);width:190px;height:190px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;filter:drop-shadow(-5px 4px 18px rgba(0,0,0,.30));}
.cta-star{position:absolute;inset:0;background:#1A4A2E;clip-path:polygon(50% 0%,62% 14%,80% 8%,76% 27%,95% 30%,84% 46%,97% 57%,82% 65%,90% 83%,71% 82%,65% 99%,50% 90%,35% 99%,29% 82%,10% 83%,18% 65%,3% 57%,16% 46%,5% 30%,24% 27%,20% 8%,38% 14%);}
.cta-pulse{position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(26,74,46,.40);opacity:0;animation:ctaPulse 2.2s ease-out infinite;}
@keyframes ctaPulse{0%{transform:scale(.85);opacity:.7;}100%{transform:scale(1.5);opacity:0;}}
.cta-txt{position:relative;z-index:1;text-align:center;}
.cta-txt span{display:block;font-family:'Cinzel',serif;font-weight:600;color:#FFE97A;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.30);}
.cta-txt .l1{font-size:26px;}.cta-txt .l2{font-size:36px;margin-top:2px;}

/* ── SALADS SECTION ─────────────────────────────── */
.salads-section{position:absolute;top:1188px;left:0;right:0;z-index:5;opacity:0;}
.salads-header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
.sal-hline{width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.55),transparent);}
.salads-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:5px;color:rgba(15,48,24,.92);text-transform:uppercase;}
.salads-row{display:flex;align-items:flex-start;justify-content:center;gap:40px;padding:0 60px;}
.sal-item{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(24px) scale(.85);}
.sal-circle{width:128px;height:128px;border-radius:50%;overflow:hidden;border:2px solid rgba(201,146,42,.45);box-shadow:0 0 0 5px rgba(201,146,42,.07),0 6px 24px rgba(60,40,5,.18);}
.sal-circle img{width:100%;height:100%;object-fit:cover;}
.sal-name{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:3px;color:rgba(15,48,24,.90);text-transform:uppercase;text-align:center;line-height:1.5;}

/* ── INFO BAR ───────────────────────────────────── */
.info-bar{
  position:absolute;top:1414px;left:0;right:0;height:162px;
  background:linear-gradient(135deg,#0F2E1A 0%,#143D24 50%,#0F2E1A 100%);
  border-top:2px solid rgba(201,146,42,.50);
  border-bottom:2px solid rgba(201,146,42,.50);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 18px;z-index:5;opacity:0;transform:translateY(30px);
}
/* Individual item cards */
.info-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  flex:1;border-radius:16px;padding:14px 10px;
  border-top:3px solid transparent;
  margin:12px 6px;
}
/* Gold card — Authentic Flavors */
.ii-gold{
  background:rgba(245,200,66,.12);
  border-top-color:#F5C842;
  box-shadow:0 0 20px rgba(245,200,66,.10) inset;
}
.ii-gold .info-icon{
  border-color:#F5C842;
  box-shadow:0 0 14px rgba(245,200,66,.35),inset 0 0 8px rgba(245,200,66,.10);
}
.ii-gold .info-icon svg{stroke:#F5C842;}
.ii-gold .info-label{color:#F5C842;}

/* Mint card — Fresh Ingredients */
.ii-green{
  background:rgba(100,220,140,.12);
  border-top-color:#5ED48A;
  box-shadow:0 0 20px rgba(100,220,140,.10) inset;
}
.ii-green .info-icon{
  border-color:#5ED48A;
  box-shadow:0 0 14px rgba(100,220,140,.35),inset 0 0 8px rgba(100,220,140,.10);
}
.ii-green .info-icon svg{stroke:#5ED48A;}
.ii-green .info-label{color:#5ED48A;}

/* Rose card — Made With Love */
.ii-rose{
  background:rgba(255,130,110,.12);
  border-top-color:#FF8A72;
  box-shadow:0 0 20px rgba(255,130,110,.10) inset;
}
.ii-rose .info-icon{
  border-color:#FF8A72;
  box-shadow:0 0 14px rgba(255,130,110,.35),inset 0 0 8px rgba(255,130,110,.10);
}
.ii-rose .info-icon svg{stroke:#FF8A72;}
.ii-rose .info-label{color:#FF8A72;}

.info-icon{width:50px;height:50px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;}
.info-icon svg{width:24px;height:24px;}
.info-label{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;text-align:center;line-height:1.45;}
.bar-leaf{position:absolute;opacity:.18;width:46px;}
.bar-leaf.l{left:12px;}.bar-leaf.r{right:12px;transform:scaleX(-1);}

/* ── CONTACT ────────────────────────────────────── */
.contact-row{position:absolute;top:1582px;left:80px;right:80px;display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;}
.contact-pill{display:flex;align-items:center;gap:14px;border:1.5px solid rgba(201,146,42,.55);border-radius:50px;padding:13px 44px;background:rgba(201,146,42,.06);}
.contact-icon{color:#C9922A;font-size:20px;}
.contact-num{font-family:'Cinzel',serif;font-size:32px;font-weight:600;color:#0F3018;letter-spacing:3px;text-shadow:0 2px 6px rgba(15,48,24,.12);}

/* ── COME LINE ──────────────────────────────────── */
.come-line{position:absolute;top:1666px;left:0;right:0;text-align:center;z-index:5;opacity:0;display:flex;align-items:center;justify-content:center;gap:14px;}
.come-orn{width:50px;height:1px;background:linear-gradient(90deg,transparent,#C9922A,transparent);}
.come-txt{font-family:'Cinzel',serif;font-size:22px;font-weight:600;letter-spacing:8px;color:rgba(15,48,24,.88);text-transform:uppercase;}

/* ── TAGLINE ─────────────────────────────────────── */
.tagline{position:absolute;top:1710px;left:70px;right:70px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:36px;font-weight:500;line-height:1.48;text-align:center;color:rgba(70,12,12,.88);z-index:5;}
.tagline .word{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(6px);}
.tagline .word.accent{color:#0F3018;font-weight:600;}
.tagline .word+.word{margin-left:.26em;}
.tagline .br{display:block;height:.06em;}

/* ── FLASH ──────────────────────────────────────── */
.flash{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(ellipse 72% 52% at 50% 36%,rgba(255,248,230,.85) 0%,rgba(245,215,140,.60) 32%,rgba(201,146,42,.25) 62%,transparent 84%);}
@keyframes flashBurst{0%{opacity:.82}20%{opacity:.40}100%{opacity:0}}
.flash.pop{animation:flashBurst .52s ease-out forwards}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="flash" id="fl"></div>

  <!-- Corner ornaments -->
  <svg class="corner-svg tl" viewBox="0 0 90 90">
    <path class="cp" d="M8 82 L8 8 L82 8"/><path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/><line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/><line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>
  <svg class="corner-svg tr" viewBox="0 0 90 90">
    <path class="cp" d="M8 82 L8 8 L82 8"/><path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/><line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/><line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>
  <svg class="corner-svg bl" viewBox="0 0 90 90">
    <path class="cp" d="M8 82 L8 8 L82 8"/><path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/><line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/><line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>
  <svg class="corner-svg br" viewBox="0 0 90 90">
    <path class="cp" d="M8 82 L8 8 L82 8"/><path class="cp2" d="M18 72 L18 18 L72 18"/>
    <circle class="cdot" cx="8" cy="8" r="3"/>
    <line class="ctick" x1="35" y1="8" x2="35" y2="14"/><line class="ctick" x1="58" y1="8" x2="58" y2="14"/>
    <line class="ctick" x1="8" y1="35" x2="14" y2="35"/><line class="ctick" x1="8" y1="58" x2="14" y2="58"/>
  </svg>

  <!-- Border lines -->
  <div class="bline t1" id="bt1"></div><div class="bline t2" id="bt2"></div>
  <div class="bline b1" id="bb1"></div><div class="bline b2" id="bb2"></div>

  <!-- Logo -->
  <div class="logo-wrap" id="logoWrap">
    <div class="logo-circle" id="logoCircle">
      <img src="sheedi_logo.jpeg" alt="The Sheedi's Restaurant">
    </div>
  </div>

  <!-- Signature Special banner -->
  <div class="special-banner" id="specialBanner">
    <div class="banner-pill">
      <svg class="banner-leaf" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6 8 4 14 8 20c2-4 6-7 10-8C14 8 12 2 12 2z" fill="rgba(245,217,142,.80)"/>
        <path d="M12 2C18 8 20 14 16 20" stroke="rgba(245,217,142,.60)" stroke-width=".8" fill="none"/>
      </svg>
      <span class="banner-txt">Signature Special</span>
      <svg class="banner-leaf" viewBox="0 0 24 24" fill="none" style="transform:scaleX(-1)">
        <path d="M12 2C6 8 4 14 8 20c2-4 6-7 10-8C14 8 12 2 12 2z" fill="rgba(245,217,142,.80)"/>
        <path d="M12 2C18 8 20 14 16 20" stroke="rgba(245,217,142,.60)" stroke-width=".8" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <div class="title-block">
    <div class="dish-cat" id="dishCat">Chicken</div>
    <div class="title-main" id="titleMain"></div>
    <div class="title-orn" id="titleOrn">
      <div class="to-line" id="tol1"></div><div class="to-sm" id="tos1"></div>
      <div class="to-gem" id="tog"></div>
      <div class="to-sm" id="tos2"></div><div class="to-line" id="tol2"></div>
    </div>
  </div>

  <!-- Dual Dish Area -->
  <div class="dual-dish-area" id="dualDishArea">
    <div class="dish-col">
      <div class="dish-outer" id="dishLeft">
        <div class="dish-inner"><img src="biryani_dish2.jpg" alt="Chicken Biryani"></div>
      </div>
      <div class="dish-label" id="dlLeft">Chicken<br><span>Dum Biryani</span></div>
    </div>
    <div class="dish-col">
      <div class="dish-outer rev" id="dishRight">
        <div class="dish-inner rev"><img src="matka_bowl.jpg" alt="Matka Biryani"></div>
      </div>
      <div class="dish-label" id="dlRight">Matka<br><span>Biryani</span></div>
    </div>
  </div>

  <!-- Order Now -->
  <div class="cta" id="ctaBadge">
    <div class="cta-star"></div>
    <div class="cta-pulse" id="ctaPulse"></div>
    <div class="cta-txt"><span class="l1">Order</span><span class="l2">Now</span></div>
  </div>

  <!-- Salads section -->
  <div class="salads-section" id="saladsSection">
    <div class="salads-header">
      <div class="sal-hline"></div>
      <span class="salads-title">Salads &amp; Fresh Sides</span>
      <div class="sal-hline"></div>
    </div>
    <div class="salads-row">
      <div class="sal-item" id="sal1"><div class="sal-circle"><img src="salad1.jpg" alt="Garden Salad"></div><span class="sal-name">Garden<br>Salad</span></div>
      <div class="sal-item" id="sal2"><div class="sal-circle"><img src="salad2.jpg" alt="Greek Salad"></div><span class="sal-name">Greek<br>Salad</span></div>
      <div class="sal-item" id="sal3"><div class="sal-circle"><img src="salad3.jpg" alt="Kachumber Salad"></div><span class="sal-name">Kachumber<br>Salad</span></div>
    </div>
  </div>

  <!-- Info bar -->
  <div class="info-bar" id="infoBar">
    <svg class="bar-leaf l" viewBox="0 0 55 80" fill="none">
      <path d="M28 78C28 78 8 60 8 35 8 15 28 2 28 2s20 13 20 33c0 25-20 43-20 43z" fill="#F5D98E"/>
      <line x1="28" y1="78" x2="28" y2="2" stroke="#C9922A" stroke-width=".8"/>
      <path d="M28 20 Q18 28 12 38M28 32 Q20 38 16 48M28 44 Q22 50 20 58" stroke="#C9922A" stroke-width=".6" fill="none"/>
    </svg>
    <div class="info-item ii-gold">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
          <path d="M3 16c0-4 2-8 9-8s9 4 9 8H3z"/>
          <line x1="12" y1="8" x2="12" y2="5"/>
          <line x1="8" y1="20" x2="16" y2="20"/>
          <line x1="3" y1="16" x2="21" y2="16"/>
        </svg>
      </div>
      <div class="info-label">Authentic<br>Flavors</div>
    </div>
    <div class="info-item ii-green">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
          <path d="M12 2C8 6 6 10 8 15c1 3 4 5 4 5s3-2 4-5c2-5 0-9-4-13z"/>
          <line x1="12" y1="20" x2="12" y2="22"/>
          <path d="M9 11c1-2 3-3 3-3s2 1 3 3"/>
        </svg>
      </div>
      <div class="info-label">Fresh<br>Ingredients</div>
    </div>
    <div class="info-item ii-rose">

/* ── Canvas particles ───────────────────────────── */
const cv=document.getElementById('cv');
cv.width=1080; cv.height=1920;
const ctx=cv.getContext('2d');

const STEAM_SOURCES=[
  // Left dish (Chicken Biryani) — center ~x:293, dish top ~y:538
  {x:218,y:658},{x:268,y:638},{x:318,y:628},{x:370,y:640},
  // Right dish (Matka Biryani) — center ~x:783, dish top ~y:538
  {x:710,y:640},{x:760,y:628},{x:810,y:638},{x:858,y:658},
];
let steamEnabled=false;

class DishSteam{
  constructor(src){this.src=src;this.live=false;this.reset();}
  reset(){
    this.x=this.src.x+(Math.random()-.5)*32; this.y=this.src.y+Math.random()*18;
    this.vx=(Math.random()-.5)*.36; this.vy=-(0.72+Math.random()*1.0);
    this.r=9+Math.random()*8; this.gr=0.20+Math.random()*.26;
    this.l=0; this.ml=90+Math.random()*115;
    this.w=Math.random()*Math.PI*2; this.del=Math.floor(Math.random()*85); this.live=false;
  }
  tick(){
    if(!steamEnabled)return;
    if(this.del>0){this.del--;return;}
    this.live=true; this.l++;
    this.x+=this.vx+Math.sin(this.l*.038+this.w)*.52;
    this.y+=this.vy; this.r+=this.gr;
    const t=this.l/this.ml;
    this.a=(t<.18?t/.18:t>.55?(1-t)/.45:1)*.14;
    if(this.l>=this.ml||this.y<345)this.reset();
  }
  draw(){
    if(!this.live||this.a<=0)return;
    const R=this.r*2.2;
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,R);
    g.addColorStop(0,`rgba(255,253,248,${Math.min(this.a*2,.21)})`);
    g.addColorStop(.30,`rgba(255,250,242,${this.a})`);
    g.addColorStop(.65,`rgba(255,247,236,${this.a*.50})`);
    g.addColorStop(1,'transparent');
    ctx.save(); ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,R,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
class Dot{
  constructor(){this.reset(true);}
  reset(init){
    this.x=60+Math.random()*960; this.y=init?Math.random()*1920:1940;
    this.vx=(Math.random()-.5)*.25; this.vy=-(0.16+Math.random()*.42);
    this.r=.4+Math.random()*1.6; this.l=0; this.ml=260+Math.random()*420;
    this.c=['#C9922A','#F5D98E','#1A4A2E','#D4A843'][Math.floor(Math.random()*4)];
    this.w=Math.random()*Math.PI*2;
  }
  tick(){
    this.l++; this.x+=this.vx+Math.sin(this.l*.020+this.w)*.20; this.y+=this.vy;
    const t=this.l/this.ml;
    this.a=(t<.12?t/.12:t>.80?(1-t)/.20:1)*.18;
    if(this.l>=this.ml||this.y<-5)this.reset(false);
  }
  draw(){
    ctx.save(); ctx.globalAlpha=this.a; ctx.fillStyle=this.c;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
const dishSteams=STEAM_SOURCES.flatMap(src=>Array.from({length:3},()=>new DishSteam(src)));
const dots=Array.from({length:26},()=>new Dot());
(function loop(){
  ctx.clearRect(0,0,1080,1920);
  dishSteams.forEach(s=>{s.tick();s.draw();});
  dots.forEach(d=>{d.tick();d.draw();});
  requestAnimationFrame(loop);
})();

      duration: 0.8 + Math.random() * 0.5,
      ease: 'power2.out',
      delay: 0.1 + i * 0.035 + Math.random() * 0.25

    // Gentle perpetual float — each element drifts slightly differently
    const dy   = 5 + Math.random() * 9;
    const drot = (Math.random() - 0.5) * 7;
    const dur  = 2.0 + Math.random() * 1.8;

      duration: dur,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true,
      delay: Math.random() * 2.8
    });
  });
}
