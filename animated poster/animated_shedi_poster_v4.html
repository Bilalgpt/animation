<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicken Biryani — The Sheedi's Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body {
  width:100vw; height:100vh;
  background:#1a0a00;
  overflow:hidden;
}

.stage {
  position:absolute;
  width:1080px; height:1920px;
  transform-origin:top left;
  overflow:hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% 18%, #FFF3DC 0%, transparent 65%),
    radial-gradient(ellipse 70% 45% at 50% 85%, #FDEBD0 0%, transparent 55%),
    linear-gradient(160deg, #FFFAF3 0%, #FFF4E2 35%, #FEF0D8 70%, #FDF0D8 100%);
}
.stage::before {
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(circle, rgba(180,100,20,.06) 1px, transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
}

canvas {
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none; z-index:1;
}

/* ── Borders ── */
.border-strip {
  position:absolute; left:50px; right:50px;
  display:flex; flex-direction:column; gap:5px;
  pointer-events:none; z-index:4;
}
.border-strip.top    { top:44px; }
.border-strip.bottom { bottom:44px; }
.bline {
  height:1.5px;
  background:linear-gradient(90deg, transparent, #C9922A, transparent);
  transform:scaleX(0); transform-origin:center;
}
.bline.thin {
  height:.7px;
  background:linear-gradient(90deg, transparent, rgba(201,146,42,.50), transparent);
}
.bdot-row { display:flex; justify-content:space-between; padding:0 4px; opacity:0; }
.bdot {
  width:6px; height:6px;
  background:#C9922A; transform:rotate(45deg) scale(0);
  display:inline-block;
}

/* ── Logo ── */
.logo-wrap {
  position:absolute; top:88px; left:0; right:0;
  display:flex; flex-direction:column; align-items:center;
  z-index:6; opacity:0;
}
.logo-circle {
  width:260px; height:260px;
  border-radius:50%; overflow:hidden;
  background:#6B1A1A;
  border:3px solid #C9922A;
  box-shadow:
    0 0 0 8px rgba(201,146,42,.15),
    0 12px 50px rgba(90,10,10,.30),
    0 0 80px rgba(201,146,42,.10);
  transform:scale(0) rotate(-200deg);
  display:flex; align-items:center; justify-content:center;
}
.logo-circle img { width:100%; height:100%; object-fit:contain; }
.logo-name {
  font-family:'Cinzel',serif; font-size:22px; letter-spacing:5px;
  color:#6B1A1A; text-transform:uppercase;
  margin-top:14px; opacity:0; transform:translateY(10px);
}

/* ── Eyebrow ── */
.eyebrow {
  position:absolute; top:408px; left:0; right:0;
  display:flex; align-items:center; justify-content:center;
  gap:16px; z-index:5; opacity:0;
}
.ey-line {
  height:1px; width:110px;
  background:linear-gradient(90deg, transparent, #C9922A, transparent);
  transform:scaleX(0); transform-origin:center;
}
.ey-gem {
  width:7px; height:7px; background:#C0501A;
  transform:rotate(45deg) scale(0); display:inline-block;
}
.ey-text {
  font-family:'Cinzel',serif; font-size:15px; letter-spacing:6px;
  color:#C0501A; text-transform:uppercase; opacity:0;
}

/* ── Dish ── */
.dish-area {
  position:absolute; top:470px; left:0; right:0;
  display:flex; align-items:center; justify-content:center;
  z-index:3;
}
.dish-outer {
  width:720px; height:720px; border-radius:50%;
  border:1.5px solid rgba(201,146,42,.22);
  box-shadow:0 0 0 12px rgba(201,146,42,.07);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(.4) translateY(120px);
  position:relative;
}
.dish-outer::before {
  content:'';
  position:absolute; inset:-4px; border-radius:50%;
  background:conic-gradient(
    from 0deg,
    transparent 0deg, rgba(201,146,42,0) 70deg,
    rgba(201,146,42,.75) 120deg, rgba(245,217,142,.80) 155deg,
    rgba(201,146,42,.75) 190deg, rgba(201,146,42,0) 250deg,
    transparent 360deg
  );
  animation:spinRing 5s linear infinite;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),black calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),black calc(100% - 2px));
}
@keyframes spinRing { to { transform:rotate(360deg); } }

.dish-inner {
  width:680px; height:680px; border-radius:50%;
  overflow:hidden;
  border:3px solid rgba(201,146,42,.40);
  box-shadow:
    0 20px 80px rgba(90,10,10,.22),
    0 0 0 8px rgba(201,146,42,.08),
    inset 0 0 30px rgba(255,220,150,.06);
  animation:dishSpin 32s linear infinite;
}
.dish-inner img { width:100%; height:100%; object-fit:cover; transform:scale(1.08); }
@keyframes dishSpin { to { transform:rotate(360deg); } }

.dish-ring-deco {
  position:absolute;
  width:760px; height:760px; border-radius:50%;
  border:1px solid rgba(201,146,42,.10);
  pointer-events:none;
}

/* ── Order Now badge — floats at right side of dish ── */
.cta {
  position:absolute;
  /* right side of dish: dish right edge ≈ 900px at y≈830
     badge left=838px → ~62px overlap into dish */
  left:838px;
  top:740px;
  width:190px; height:190px;
  display:flex; align-items:center; justify-content:center;
  z-index:8;
  opacity:0; transform:scale(0) rotate(-20deg);
  /* ensure it renders above the dish */
  filter:drop-shadow(-6px 4px 18px rgba(0,0,0,.28));
}
.cta-star {
  position:absolute; inset:0;
  background:#C0501A;
  clip-path:polygon(
    50% 0%,   62% 14%,  80% 8%,   76% 27%,
    95% 30%,  84% 46%,  97% 57%,  82% 65%,
    90% 83%,  71% 82%,  65% 99%,  50% 90%,
    35% 99%,  29% 82%,  10% 83%,  18% 65%,
     3% 57%,  16% 46%,   5% 30%,  24% 27%,
    20% 8%,   38% 14%
  );
}
.cta-txt { position:relative; z-index:1; text-align:center; }
.cta-txt span {
  display:block;
  font-family:'Cinzel',serif; font-weight:600;
  color:#fff; letter-spacing:2px;
}
.cta-txt .l1 { font-size:24px; }
.cta-txt .l2 { font-size:31px; margin-top:2px; }

.cta-pulse {
  position:absolute; inset:-14px; border-radius:50%;
  border:2.5px solid rgba(192,80,26,.45);
  opacity:0; animation:ctaPulse 2.2s ease-out infinite;
}
@keyframes ctaPulse {
  0%  { transform:scale(.85); opacity:.7; }
  100%{ transform:scale(1.5);  opacity:0;  }
}

/* ── Title area ── */
.title-area {
  position:absolute; top:1220px; left:60px; right:60px;
  text-align:center; z-index:6;
}
.dish-cat {
  font-family:'Cinzel',serif; font-size:20px; letter-spacing:8px;
  color:#C0501A; text-transform:uppercase;
  margin-bottom:8px; opacity:0; transform:translateY(15px);
}
.title-text {
  font-family:'Playfair Display',serif; font-weight:900;
  font-size:130px; line-height:1.0;
  color:#6B1A1A;
  text-shadow:0 4px 20px rgba(107,26,26,.15);
  /* NO overflow:hidden — was clipping the descender of "y" */
  padding-bottom:18px;
}
.title-text .char { display:inline-block; opacity:0; transform:translateY(60px); }
.title-text .spc  { display:inline-block; width:.3em; }

/* ── Divider ── */
.divider {
  position:absolute; top:1470px; left:0; right:0;
  display:flex; align-items:center; justify-content:center;
  gap:14px; z-index:5; opacity:0;
}
.dv-line {
  height:1px; width:100px;
  background:linear-gradient(90deg, transparent, #C9922A, transparent);
  transform:scaleX(0); transform-origin:center;
}
.dv-gem {
  width:8px; height:8px; background:#C0501A;
  transform:rotate(45deg) scale(0); display:inline-block;
}
.dv-dot {
  width:4px; height:4px; background:#F5D98E;
  transform:rotate(45deg) scale(0); display:inline-block;
}

/* ── Tagline ── */
.tagline {
  position:absolute; top:1512px; left:80px; right:80px;
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:36px; line-height:1.50; text-align:center;
  color:rgba(90,20,20,.68);
  opacity:0; transform:translateY(20px);
  z-index:5;
}

/* ── Bottom info ── */
.bottom-info {
  position:absolute; top:1840px; left:0; right:0;
  text-align:center; z-index:5; opacity:0;
}
.bottom-info span {
  font-family:'Cinzel',serif; font-size:16px; letter-spacing:5px;
  color:rgba(107,26,26,.42); text-transform:uppercase;
}

/* ── Flash ── */
.flash {
  position:absolute; inset:0; z-index:40; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse 75% 55% at 50% 38%,
    rgba(255,248,230,.88) 0%,rgba(245,215,140,.65) 32%,
    rgba(201,146,42,.28) 62%,transparent 84%);
}
@keyframes flashBurst { 0%{opacity:.85} 20%{opacity:.42} 100%{opacity:0} }
.flash.pop { animation:flashBurst .55s ease-out forwards }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="flash" id="fl"></div>

  <!-- Top border -->
  <div class="border-strip top">
    <div class="bline" id="tl1"></div>
    <div class="bdot-row" id="tdr">
      <div class="bdot"></div><div class="bdot"></div><div class="bdot"></div>
    </div>
    <div class="bline thin" id="tl2"></div>
  </div>

  <!-- Bottom border -->
  <div class="border-strip bottom">
    <div class="bline thin" id="bl1"></div>
    <div class="bdot-row" id="bdr">
      <div class="bdot"></div><div class="bdot"></div><div class="bdot"></div>
    </div>
    <div class="bline" id="bl2"></div>
  </div>

  <!-- Logo -->
  <div class="logo-wrap" id="logoWrap">
    <div class="logo-circle" id="logoCircle">
      <img src="sheedi_logo.jpeg" alt="The Sheedi's Restaurant">
    </div>
    <div class="logo-name" id="logoName">The Sheedi's Restaurant</div>
  </div>

  <!-- Eyebrow -->
  <div class="eyebrow" id="eyebrow">
    <div class="ey-line" id="eyl1"></div>
    <div class="ey-gem" id="eyg1"></div>
    <div class="ey-text" id="eyt">Signature Dish</div>
    <div class="ey-gem" id="eyg2"></div>
    <div class="ey-line" id="eyl2"></div>
  </div>

  <!-- Dish -->
  <div class="dish-area">
    <div class="dish-outer" id="dishOuter">
      <div class="dish-ring-deco"></div>
      <div class="dish-inner">
        <img src="biryani_dish2.jpg" alt="Chicken Biryani">
      </div>
    </div>
  </div>

  <!-- Order Now — right side of dish, overlapping it slightly -->
  <div class="cta" id="ctaBadge">
    <div class="cta-star"></div>
    <div class="cta-pulse" id="ctaPulse"></div>
    <div class="cta-txt">
      <span class="l1">Order</span>
      <span class="l2">Now</span>
    </div>
  </div>

  <!-- Title -->
  <div class="title-area">
    <div class="dish-cat" id="dishCat">Chicken</div>
    <div class="title-text" id="titleText"></div>
  </div>

  <!-- Divider -->
  <div class="divider" id="divider">
    <div class="dv-line" id="dvl1"></div>
    <div class="dv-dot" id="dvd1"></div>
    <div class="dv-gem" id="dvg"></div>
    <div class="dv-dot" id="dvd2"></div>
    <div class="dv-line" id="dvl2"></div>
  </div>

  <!-- Tagline -->
  <div class="tagline" id="tagline">
    Slow-cooked with aromatic spices,<br>
    tender chicken &amp; fragrant basmati —<br>
    a taste of tradition in every bite.
  </div>

  <!-- Bottom info -->
  <div class="bottom-info" id="bottomInfo">
    <span>Dine In &nbsp;·&nbsp; Takeaway &nbsp;·&nbsp; Delivery</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
/* Scale */
(function(){
  const s = document.getElementById('stage');
  function fit(){
    const scl = Math.min(window.innerWidth/1080, window.innerHeight/1920);
    s.style.transform = `scale(${scl})`;
    s.style.left = Math.max(0,(window.innerWidth  - 1080*scl)/2) + 'px';
    s.style.top  = Math.max(0,(window.innerHeight - 1920*scl)/2) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
})();

/* Particles */
const cv = document.getElementById('cv');
cv.width = 1080; cv.height = 1920;
const ctx = cv.getContext('2d');

class Steam {
  constructor(){ this.reset(true); }
  reset(init){
    this.x=370+Math.random()*340;
    this.y=init?500+Math.random()*600:1200;
    this.vx=(Math.random()-.5)*.5; this.vy=-(0.6+Math.random()*1.0);
    this.r=3+Math.random()*7; this.l=0; this.ml=100+Math.random()*180;
    this.w=Math.random()*Math.PI*2;
  }
  tick(){
    this.l++; this.x+=this.vx+Math.sin(this.l*.035+this.w)*.7; this.y+=this.vy;
    const t=this.l/this.ml;
    this.a=(t<.2?t/.2:t>.70?(1-t)/.30:1)*.10;
    if(this.l>=this.ml||this.y<460) this.reset(false);
  }
  draw(){
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*3);
    g.addColorStop(0,'rgba(255,230,170,.85)'); g.addColorStop(1,'transparent');
    ctx.save(); ctx.globalAlpha=this.a; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r*3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
class Dot {
  constructor(){ this.reset(true); }
  reset(init){
    this.x=60+Math.random()*960; this.y=init?Math.random()*1920:1940;
    this.vx=(Math.random()-.5)*.28; this.vy=-(0.18+Math.random()*.45);
    this.r=.5+Math.random()*1.8; this.l=0; this.ml=250+Math.random()*450;
    this.c=['#C9922A','#F5D98E','#D4530A','#E8A840'][Math.floor(Math.random()*4)];
    this.w=Math.random()*Math.PI*2;
  }
  tick(){
    this.l++; this.x+=this.vx+Math.sin(this.l*.022+this.w)*.22; this.y+=this.vy;
    const t=this.l/this.ml;
    this.a=(t<.12?t/.12:t>.80?(1-t)/.20:1)*.20;
    if(this.l>=this.ml||this.y<-5) this.reset(false);
  }
  draw(){
    ctx.save(); ctx.globalAlpha=this.a; ctx.fillStyle=this.c;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
const steams=Array.from({length:16},()=>new Steam());
const dots=Array.from({length:28},()=>new Dot());
(function loop(){
  ctx.clearRect(0,0,1080,1920);
  steams.forEach(s=>{s.tick();s.draw()});
  dots.forEach(d=>{d.tick();d.draw()});
  requestAnimationFrame(loop);
})();

/* Flash */
const flEl=document.getElementById('fl');
function flash(){ flEl.classList.remove('pop'); void flEl.offsetWidth; flEl.classList.add('pop'); }

/* Char split */
function buildChars(el,text){
  el.innerHTML=text.split('').map(ch=>
    ch===' '?`<span class="spc"> </span>`:`<span class="char">${ch}</span>`
  ).join('');
}

/* GSAP Timeline */
const tl = gsap.timeline({ defaults:{ ease:'power2.out' } });

gsap.set(['#logoWrap','#eyebrow','#tagline','#divider','#bottomInfo'],{opacity:0});
gsap.set('#logoCircle',{scale:0,rotation:-200});
gsap.set('#logoName',{opacity:0,y:12});
gsap.set(['#tl1','#tl2','#bl1','#bl2'],{scaleX:0});
gsap.set(['.bdot','.ey-gem'],{scale:0});
gsap.set(['#tdr','#bdr'],{opacity:0});
gsap.set(['#eyl1','#eyl2'],{scaleX:0});
gsap.set('#eyt',{opacity:0});
gsap.set('#dishOuter',{opacity:0,scale:.4,y:120});
gsap.set('#dishCat',{opacity:0,y:15});
gsap.set('.char',{opacity:0,y:60});
gsap.set(['#dvl1','#dvl2'],{scaleX:0});
gsap.set(['#dvg','#dvd1','#dvd2'],{scale:0});
gsap.set('#ctaBadge',{opacity:0,scale:0,rotation:-20});
gsap.set('#ctaPulse',{opacity:0});

// Borders
tl.add(()=>flash(),0)
  .to(['#tl1','#tl2','#bl1','#bl2'],{scaleX:1,duration:1.1,stagger:.07},0.05)
  .to(['#tdr','#bdr'],{opacity:1,duration:.2},0.4)
  .to('.bdot',{scale:1,duration:.3,ease:'back.out(2)',stagger:.05},0.45);

// Logo
tl.to('#logoWrap',{opacity:1,duration:.1},0.7)
  .to('#logoCircle',{scale:1,rotation:0,duration:1.0,ease:'back.out(1.7)'},0.7)
  .to('#logoName',{opacity:1,y:0,duration:.6},1.4);

// Eyebrow
tl.to('#eyebrow',{opacity:1,duration:.2},1.5)
  .to(['#eyl1','#eyl2'],{scaleX:1,duration:.65,stagger:.08},1.55)
  .to('.ey-gem',{scale:1,duration:.3,ease:'back.out(2)',stagger:.1},1.8)
  .to('#eyt',{opacity:1,duration:.5},1.9);

// Dish rises in
tl.add(()=>flash(),2.1)
  .to('#dishOuter',{opacity:1,scale:1,y:0,duration:1.3,ease:'back.out(1.2)'},2.2);

// Order Now pops on the right side of the dish (t=3.0s)
tl.add(()=>flash(),3.0)
  .to('#ctaBadge',{opacity:1,scale:1,rotation:0,duration:.75,ease:'back.out(2.2)'},3.05)
  .to('#ctaPulse',{opacity:1,duration:.1},3.7);

// Title
tl.add(()=>flash(),3.8)
  .to('#dishCat',{opacity:1,y:0,duration:.55},3.9)
  .add(()=>{
    buildChars(document.getElementById('titleText'),'Biryani');
    anime({targets:'#titleText .char',opacity:[0,1],translateY:[60,0],
           easing:'easeOutCubic',duration:480,delay:anime.stagger(68)});
  },4.1);

// Divider + tagline
tl.to('#divider',{opacity:1,duration:.3},5.4)
  .to(['#dvl1','#dvl2'],{scaleX:1,duration:.6,stagger:.08},5.45)
  .to(['#dvg','#dvd1','#dvd2'],{scale:1,duration:.35,ease:'back.out(2)',stagger:.07},5.7)
  .to('#tagline',{opacity:1,y:0,duration:.8},5.9);

// Bottom info
tl.to('#bottomInfo',{opacity:1,duration:.7},7.0);
</script>
</body>
</html>
