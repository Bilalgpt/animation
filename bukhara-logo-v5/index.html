<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukhara — Menu Card</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#040302;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

#stage {
  position:relative;
  width:540px; height:960px;
  background:radial-gradient(ellipse at 50% 60%, #110d08 0%, #060402 65%);
  flex-shrink:0;
  transform-origin:center center;
  /* overflow:hidden removed — it breaks preserve-3d on the card */
}

/* Table surface hint at bottom */
#stage::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:200px;
  background:linear-gradient(0deg, rgba(18,10,4,0.55) 0%, transparent 100%);
  pointer-events:none; z-index:0;
}

/* Card drop-shadow on "table" */
#card-shadow {
  position:absolute;
  left:50%; top:53%;
  transform:translate(-50%,-50%);
  width:420px; height:40px;
  background:radial-gradient(ellipse, rgba(0,0,0,0.75) 0%, transparent 72%);
  filter:blur(14px);
  z-index:1; pointer-events:none;
  opacity:0;
}

/* ── 3D Card Scene ────────────────────────────── */
#card-scene {
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:460px; height:700px;
  perspective:1500px;
  z-index:2;
  opacity:0;
  /* No overflow:hidden here — must not flatten the 3D context */
}

#card {
  width:100%; height:100%;
  transform-style:preserve-3d;
  position:relative;
  will-change:transform;
}

.face {
  position:absolute; inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:10px;
  overflow:hidden;
}

/* ══════════════════════════════════════════════
   FRONT FACE — Leather green menu cover
══════════════════════════════════════════════ */
#front {
  transform:rotateY(0deg);
  /* Leather crosshatch texture */
  background:
    repeating-linear-gradient(
      45deg,
      transparent, transparent 2px,
      rgba(0,0,0,0.028) 2px, rgba(0,0,0,0.028) 4px
    ),
    repeating-linear-gradient(
      -45deg,
      transparent, transparent 2px,
      rgba(0,0,0,0.018) 2px, rgba(0,0,0,0.018) 4px
    ),
    linear-gradient(155deg, #182c1c 0%, #0f2013 35%, #0c1b10 60%, #111f14 100%);
  border:1.5px solid rgba(172,138,38,0.52);
  box-shadow:
    inset 0 0 0 9px rgba(0,0,0,0.28),
    inset 0 0 0 11px rgba(162,128,34,0.13),
    0 30px 80px rgba(0,0,0,0.95),
    0 10px 35px rgba(0,0,0,0.75);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* Outer inset border */
#front::before {
  content:'';
  position:absolute; inset:14px;
  border:1px solid rgba(172,138,38,0.30);
  border-radius:6px; pointer-events:none;
}

/* Inner inset border */
#front::after {
  content:'';
  position:absolute; inset:22px;
  border:0.5px solid rgba(172,138,38,0.14);
  border-radius:4px; pointer-events:none;
}

/* Subtle vignette inside card */
.front-vignette {
  position:absolute; inset:0; border-radius:10px;
  background:radial-gradient(ellipse at 50% 50%,
    transparent 40%, rgba(0,0,0,0.38) 100%);
  pointer-events:none;
}

.front-content {
  display:flex; flex-direction:column;
  align-items:center; z-index:1;
  padding:0 40px;
}

/* Top small ornament */
.fc-ornament-top {
  display:flex; align-items:center; gap:10px; margin-bottom:40px;
}
.fc-orn-line {
  width:55px; height:0.5px;
  background:linear-gradient(90deg, transparent, rgba(172,138,38,0.55), transparent);
}
.fc-orn-diamond {
  width:6px; height:6px; border-radius:1px;
  border:1px solid rgba(172,138,38,0.60);
  transform:rotate(45deg);
}

/* Main name */
.fc-name {
  font-family:'Playfair Display',serif;
  font-size:56px; font-weight:700;
  color:rgba(212,177,82,0.93);
  letter-spacing:0.10em; line-height:1;
  text-align:center;
  text-shadow:
    0 2px 4px rgba(0,0,0,0.9),
    0 0 40px rgba(175,140,42,0.28);
}

/* Gold rule */
.fc-rule {
  width:160px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(172,138,38,0.65), transparent);
  margin:22px 0;
}

/* Subtitle */
.fc-sub {
  font-family:'Playfair Display',serif;
  font-size:13px; font-weight:400; font-style:italic;
  color:rgba(182,148,52,0.70);
  letter-spacing:0.24em; text-transform:uppercase;
  text-align:center;
}

/* Diamond separator */
.fc-diamond {
  width:9px; height:9px;
  background:rgba(182,148,52,0.60);
  transform:rotate(45deg); border-radius:1px;
  margin:28px 0;
}

/* Tagline on cover */
.fc-tagline {
  font-family:'Playfair Display',serif;
  font-size:10.5px; font-style:italic;
  color:rgba(155,122,40,0.52);
  letter-spacing:0.16em; text-align:center;
}

/* Bottom ornament */
.fc-ornament-bot {
  display:flex; align-items:center; gap:10px; margin-top:42px;
}

/* ══════════════════════════════════════════════
   BACK FACE — Logo reveal
══════════════════════════════════════════════ */
#back {
  transform:rotateY(180deg);
  background:
    radial-gradient(ellipse at 50% 45%, #141009 0%, #0a0604 55%, #07040200 100%),
    #0a0604;
  border:1.5px solid rgba(152,118,32,0.32);
  box-shadow:
    inset 0 0 0 9px rgba(0,0,0,0.22),
    0 30px 80px rgba(0,0,0,0.95);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:35px 25px 30px;
  gap:0; overflow:hidden;
}

/* Subtle inner border on back too */
#back::before {
  content:'';
  position:absolute; inset:14px;
  border:0.5px solid rgba(152,118,32,0.18);
  border-radius:6px; pointer-events:none;
}

#back-logo {
  width:100%; max-width:410px;
  display:block;
  filter: drop-shadow(0 0 14px rgba(255,190,50,0.55))
          drop-shadow(0 0 40px rgba(210,120,20,0.22));
  opacity:0;
  position:relative; z-index:1;
}

#back-text {
  margin-top:28px;
  text-align:center; opacity:0;
  z-index:1;
}
.bt-name {
  font-family:'Cormorant Garamond',serif;
  font-size:19px; font-weight:300;
  letter-spacing:0.30em; text-transform:uppercase;
  color:rgba(208,172,78,0.82);
}
.bt-rule {
  width:120px; height:0.5px;
  background:linear-gradient(90deg, transparent, rgba(172,138,38,0.45), transparent);
  margin:10px auto;
}
.bt-sub {
  font-family:'Cormorant Garamond',serif;
  font-style:italic; font-size:13px; font-weight:300;
  color:rgba(165,130,46,0.52);
  letter-spacing:0.12em;
}

/* Shimmer overlay on back face */
#back-shimmer {
  position:absolute; top:0; left:-80%; width:55%; height:100%;
  background:linear-gradient(90deg,
    transparent 0%, rgba(255,215,105,0.16) 50%, transparent 100%);
  mix-blend-mode:screen; opacity:0; pointer-events:none; z-index:2;
  border-radius:10px;
}
</style>
</head>
<body>
<div id="stage">

  <div id="card-shadow"></div>

  <div id="card-scene">
    <div id="card">

      <!-- FRONT: Green leather cover -->
      <div class="face" id="front">
        <div class="front-vignette"></div>
        <div class="front-content">
          <div class="fc-ornament-top">
            <div class="fc-orn-line"></div>
            <div class="fc-orn-diamond"></div>
            <div class="fc-orn-line"></div>
          </div>
          <div class="fc-name">BUKHARA</div>
          <div class="fc-rule"></div>
          <div class="fc-sub">Indian Restoran</div>
          <div class="fc-diamond"></div>
          <div class="fc-tagline">Where Every Dish Tells a Story</div>
          <div class="fc-ornament-bot">
            <div class="fc-orn-line"></div>
            <div class="fc-orn-diamond"></div>
            <div class="fc-orn-line"></div>
          </div>
        </div>
      </div>

      <!-- BACK: Logo reveal -->
      <div class="face" id="back">
        <div id="back-shimmer"></div>
        <img id="back-logo" src="bukhara-logo.png" alt="Bukhara Logo">
        <div id="back-text">
          <div class="bt-name">Bukhara Indian Restoran</div>
          <div class="bt-rule"></div>
          <div class="bt-sub">Baku, Azerbaijan &nbsp;·&nbsp; Est. 2010</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="../libs/gsap.min.js"></script>
<script>

// ── Fit stage to viewport ─────────────────────────────────────────────────────
(function fitStage() {
  const el = document.getElementById('stage');
  const scale = Math.min(window.innerWidth / 540, window.innerHeight / 960);
  el.style.transform = 'scale(' + scale + ')';
})();
window.addEventListener('resize', function() {
  const el = document.getElementById('stage');
  const scale = Math.min(window.innerWidth / 540, window.innerHeight / 960);
  el.style.transform = 'scale(' + scale + ')';
});

const tl = gsap.timeline({ repeat:-1 });

// 0s — Card drops in from above (waiter placing it on the table)
tl.to('#card-scene', {
  opacity:1, y:0, duration:0.7, ease:'power2.out'
}, 0);
tl.from('#card-scene', { y:-35 }, 0);
tl.to('#card-shadow', { opacity:1, duration:0.6 }, 0.2);

// 1.0s — Hold — reader sees the green leather cover

// 1.8s — CARD FLIPS (the key animation)
tl.to('#card', {
  rotationY:180, duration:1.55,
  ease:'power2.inOut',
  transformOrigin:'center center'
}, 1.8);

// During flip — shadow flattens and re-expands
tl.to('#card-shadow', { scaleX:0.05, duration:0.75, ease:'power2.in'  }, 1.8);
tl.to('#card-shadow', { scaleX:1.0,  duration:0.75, ease:'power2.out' }, 2.6);

// 3.4s — Logo fades in on back face
tl.to('#back-logo', {
  opacity:1, duration:0.9, ease:'power1.out'
}, 3.4);
tl.from('#back-logo', { scale:0.96 }, 3.4);

// 3.6s — Shimmer sweep across logo
tl.set('#back-shimmer', { opacity:1, left:'-80%' }, 3.6);
tl.to('#back-shimmer',  { left:'130%', duration:0.9, ease:'power2.inOut' }, 3.6);
tl.set('#back-shimmer', { opacity:0 }, 4.55);

// 4.0s — Text fades in below logo
tl.to('#back-text', { opacity:1, duration:0.7, ease:'power1.out' }, 4.0);
tl.from('#back-text', { y:10 }, 4.0);

// 4.5s — Logo gentle breathe
tl.call(()=>{
  gsap.to('#back-logo', {
    scale:1.012, duration:3.6,
    ease:'sine.inOut', yoyo:true, repeat:-1
  });
}, [], 4.5);

// 9.5s — Text fades out first
tl.to('#back-text', { opacity:0, duration:0.5 }, 9.5);
tl.to('#back-logo', { opacity:0, duration:0.6, ease:'power1.in' }, 9.8);

// 10.2s — CARD FLIPS BACK
tl.to('#card', {
  rotationY:360, duration:1.45,
  ease:'power2.inOut',
  transformOrigin:'center center'
}, 10.2);
tl.to('#card-shadow', { scaleX:0.05, duration:0.70, ease:'power2.in'  }, 10.2);
tl.to('#card-shadow', { scaleX:1.0,  duration:0.70, ease:'power2.out' }, 10.9);

// 11.8s — Brief hold on front cover again

// 12.2s — Card lifts away (waiter picks it up)
tl.to('#card-scene', {
  opacity:0, y:-30, duration:0.6, ease:'power2.in'
}, 12.2);
tl.to('#card-shadow', { opacity:0, duration:0.4 }, 12.2);

// 12.9s — Reset for loop
tl.call(()=>{
  gsap.killTweensOf('#back-logo');
  gsap.set('#card',       { rotationY:0 });
  gsap.set('#card-scene', { opacity:0, y:-35 });
  gsap.set('#card-shadow',{ opacity:0, scaleX:1 });
  gsap.set('#back-logo',  { opacity:0, scale:1 });
  gsap.set('#back-text',  { opacity:0, y:10 });
  gsap.set('#back-shimmer',{ opacity:0, left:'-80%' });
}, [], 12.9);

tl.to({}, { duration:0.4 }, 12.9); // total ~13.3s
</script>
</body>
</html>
