<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trust DMC — V5 (9:16 Blue / Transparent BG)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:  #5B73C4;
  --blue-l:#8B9FD8;
  --blue-d:#3A55A8;
  --blue-xl:#C8D4F0;
  --ink:   #2A3A7A;
  --glow:  rgba(91,115,196,.50);
}

html,body{
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  width:100vw;height:100vh;overflow:hidden;
}

/* 9:16 stage — 1080×1920, scaled to fit the viewport */
.stage{
  position:relative;
  width:1080px;height:1920px;
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:transparent;
  transform-origin:center center;
}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

/* ── Top rule ────────────────────────────────── */
.top-rule{display:flex;align-items:center;gap:10px;margin-bottom:28px;opacity:0;animation:fadeIn .5s .1s ease forwards}
.tr-line{height:1px;width:0;background:linear-gradient(90deg,transparent,rgba(91,115,196,.60));animation:growR90 .7s .15s ease forwards}
.tr-dot{width:3px;height:3px;background:var(--blue);border-radius:50%;box-shadow:0 0 6px var(--glow)}
.tr-text{font-family:'Cinzel',serif;font-size:11px;letter-spacing:8px;color:var(--blue);text-transform:uppercase;opacity:.80;text-shadow:0 0 10px rgba(91,115,196,.35)}
@keyframes growR90{to{width:90px}}

/* ── Eyebrow ─────────────────────────────────── */
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:38px}
.ey-line{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--blue));animation:ey-lineR .8s .25s ease forwards}
.ey-line.right{background:linear-gradient(90deg,var(--blue),transparent)}
@keyframes ey-lineR{to{width:60px}}
.ey-text{font-family:'Cinzel',serif;font-size:13px;letter-spacing:9px;color:var(--blue);text-transform:uppercase;opacity:0;animation:fadeIn .7s .35s ease forwards;text-shadow:0 0 12px rgba(91,115,196,.40)}

/* ══ LOGO FRAME ════════════════════════════════ */
.logo-frame{position:relative;padding:32px 34px;display:inline-block}

.logo-frame::before{
  content:'';position:absolute;inset:0;border-radius:4px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(2px);
  opacity:0;animation:fadeIn .6s 1.5s ease forwards;
  z-index:0;
  box-shadow:0 4px 60px rgba(91,115,196,.18), 0 0 0 1px rgba(91,115,196,.12);
}

.frame-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:0;animation:fadeIn .5s 2.4s ease forwards}
.frame-rect{fill:none;stroke:rgba(91,115,196,.25);stroke-width:.9;stroke-dasharray:5 8;animation:marchAnt 3s 2.4s linear infinite}
@keyframes marchAnt{to{stroke-dashoffset:-26}}

.corner{position:absolute;width:42px;height:42px;z-index:4}
.c-tl{top:0;left:0}.c-tr{top:0;right:0}.c-bl{bottom:0;left:0}.c-br{bottom:0;right:0}
.c-h{position:absolute;height:2px;width:0;background:var(--blue);box-shadow:0 0 8px var(--glow)}
.c-v{position:absolute;width:2px;height:0;background:var(--blue);box-shadow:0 0 8px var(--glow)}
.c-tl .c-h{top:0;left:0; animation:growH42 .45s 1.80s ease-out forwards}
.c-tl .c-v{top:0;left:0; animation:growV42 .45s 1.80s ease-out forwards}
.c-tr .c-h{top:0;right:0;animation:growH42 .45s 1.88s ease-out forwards}
.c-tr .c-v{top:0;right:0;animation:growV42 .45s 1.88s ease-out forwards}
.c-bl .c-h{bottom:0;left:0;  animation:growH42 .45s 1.96s ease-out forwards}
.c-bl .c-v{bottom:0;left:0;  animation:growV42 .45s 1.96s ease-out forwards}
.c-br .c-h{bottom:0;right:0; animation:growH42 .45s 2.04s ease-out forwards}
.c-br .c-v{bottom:0;right:0; animation:growV42 .45s 2.04s ease-out forwards}
@keyframes growH42{to{width:42px}} @keyframes growV42{to{height:42px}}

.corner::after{
  content:'';position:absolute;width:6px;height:6px;border-radius:50%;
  background:var(--blue);opacity:0;
  animation:fadeIn .3s 2.25s ease forwards, cDotPulse 3s 3s ease-in-out infinite;
  box-shadow:0 0 10px var(--glow);
}
.c-tl::after{top:-1px;left:-1px}.c-tr::after{top:-1px;right:-1px}
.c-bl::after{bottom:-1px;left:-1px}.c-br::after{bottom:-1px;right:-1px}
@keyframes cDotPulse{0%,100%{box-shadow:0 0 7px var(--glow)}50%{box-shadow:0 0 20px rgba(91,115,196,.90),0 0 38px rgba(91,115,196,.32)}}

.c-arc{position:absolute;width:22px;height:22px;overflow:hidden;opacity:0;animation:fadeIn .4s 2.3s ease forwards}
.c-tl .c-arc{top:0;left:0}.c-tr .c-arc{top:0;right:0;transform:scaleX(-1)}
.c-bl .c-arc{bottom:0;left:0;transform:scaleY(-1)}.c-br .c-arc{bottom:0;right:0;transform:scale(-1,-1)}
.c-arc::after{content:'';position:absolute;width:42px;height:42px;border:1.5px solid rgba(91,115,196,.45);border-radius:50%;top:0;left:0;box-shadow:0 0 6px rgba(91,115,196,.30)}

.c-label{position:absolute;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;color:var(--blue);opacity:0;animation:fadeIn .4s 2.5s ease forwards;white-space:nowrap;z-index:5}
.c-tl .c-label{top:7px;left:46px}.c-tr .c-label{top:7px;right:46px}
.c-bl .c-label{bottom:7px;left:46px}.c-br .c-label{bottom:7px;right:46px}

.edge-t,.edge-b{position:absolute;left:42px;right:42px;height:1px;background:linear-gradient(90deg,rgba(91,115,196,.75) 0%,rgba(91,115,196,.20) 20%,rgba(91,115,196,.20) 80%,rgba(91,115,196,.75) 100%);z-index:3}
.edge-t{top:0;transform:scaleX(0);transform-origin:left;animation:edgeH .55s 2.35s ease-out forwards}
.edge-b{bottom:0;transform:scaleX(0);transform-origin:right;animation:edgeH .55s 2.40s ease-out forwards}
.edge-l,.edge-r{position:absolute;top:42px;bottom:42px;width:1px;background:linear-gradient(180deg,rgba(91,115,196,.75) 0%,rgba(91,115,196,.20) 20%,rgba(91,115,196,.20) 80%,rgba(91,115,196,.75) 100%);z-index:3}
.edge-l{left:0;transform:scaleY(0);transform-origin:top;animation:edgeV .55s 2.40s ease-out forwards}
.edge-r{right:0;transform:scaleY(0);transform-origin:bottom;animation:edgeV .55s 2.45s ease-out forwards}
@keyframes edgeH{to{transform:scaleX(1)}} @keyframes edgeV{to{transform:scaleY(1)}}

.tick{position:absolute;background:var(--blue);z-index:4;opacity:0;animation:fadeIn .35s 2.6s ease forwards;box-shadow:0 0 5px var(--glow)}
.tick-t,.tick-b{width:2px;height:12px;left:50%;transform:translateX(-50%)}.tick-t{top:0}.tick-b{bottom:0}
.tick-l,.tick-r{width:12px;height:2px;top:50%;transform:translateY(-50%)}.tick-l{left:0}.tick-r{right:0}

.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;opacity:0;animation:fadeIn .4s 2.55s ease forwards}
.ch-h{position:absolute;width:22px;height:1px;background:rgba(91,115,196,.40);top:0;left:-11px}
.ch-v{position:absolute;height:22px;width:1px;background:rgba(91,115,196,.40);left:0;top:-11px}
.ch-ring{position:absolute;width:11px;height:11px;border:1px solid rgba(91,115,196,.50);border-radius:50%;top:-5px;left:-5px;animation:ringPulse 3s 3s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.6);opacity:0}}

.prog-bar{position:absolute;bottom:0;left:0;height:2px;width:0;z-index:5;background:linear-gradient(90deg,var(--blue-d),var(--blue),var(--blue-l));box-shadow:0 0 10px var(--glow),0 0 20px rgba(91,115,196,.20);animation:progFill 2.8s .6s ease-out forwards}
@keyframes progFill{to{width:100%}}

.scan-line{position:absolute;left:0;right:0;height:2px;z-index:6;background:linear-gradient(90deg,transparent 0%,rgba(91,115,196,.45) 20%,rgba(91,115,196,.90) 50%,rgba(91,115,196,.45) 80%,transparent 100%);box-shadow:0 0 14px var(--glow);top:0;opacity:0;animation:scanDown 1.6s 2.75s ease-in-out forwards;pointer-events:none}
@keyframes scanDown{0%{top:0;opacity:0}5%{opacity:1}88%{opacity:.9}100%{top:100%;opacity:0}}

.logo-wrap{position:relative;width:420px;overflow:hidden;z-index:2}
.logo-img{
  display:block;width:420px;
  opacity:0;transform:scale(.82) translateY(14px);filter:blur(10px);
  mix-blend-mode:multiply;
  animation:logoReveal 1.3s .45s cubic-bezier(.22,1,.36,1) forwards, logoPulse 5s 3.5s ease-in-out infinite;
}
@keyframes logoReveal{0%{opacity:0;transform:scale(.82) translateY(14px);filter:blur(10px)}38%{filter:blur(0)}66%{transform:scale(1.04) translateY(-3px);opacity:1}83%{transform:scale(.98) translateY(1px)}100%{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 14px rgba(91,115,196,.30))}50%{filter:drop-shadow(0 0 32px rgba(91,115,196,.65)) drop-shadow(0 0 60px rgba(91,115,196,.20))}}
.logo-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(108deg,transparent 25%,rgba(255,255,255,.55) 50%,transparent 75%);transform:translateX(-140%);animation:shimmer 1.1s 1.9s ease-out forwards;pointer-events:none}
@keyframes shimmer{to{transform:translateX(250%)}}

/* ── Tagline section ─────────────────────────── */
.tagline-section{
  display:flex;flex-direction:column;align-items:stretch;
  width:520px;margin-top:36px;
}

.tl-rule{display:flex;align-items:center;gap:0;width:100%}

.tl-d{
  width:10px;height:10px;background:var(--blue);
  transform:rotate(45deg) scale(0);opacity:0;flex-shrink:0;
  box-shadow:0 0 12px var(--glow);position:relative;z-index:1;
}
@keyframes diamondCrystal{
  0%  {transform:rotate(45deg) scale(0);opacity:0}
  18% {opacity:.30}
  55% {transform:rotate(45deg) scale(1.25);opacity:.80}
  72% {transform:rotate(45deg) scale(.90)}
  88% {transform:rotate(45deg) scale(1.06)}
  100%{transform:rotate(45deg) scale(1);opacity:1}
}
.tl-top .tl-d-l{animation:diamondCrystal 1.6s 3.20s ease-out forwards}
.tl-top .tl-d-r{animation:diamondCrystal 1.6s 4.70s ease-out forwards}
.tl-bot .tl-d-l{animation:diamondCrystal 1.6s 3.45s ease-out forwards}
.tl-bot .tl-d-r{animation:diamondCrystal 1.6s 4.95s ease-out forwards}

.tl-line{
  flex:1;height:1px;position:relative;
  transform:scaleX(0);transform-origin:left center;
  background-size:200% 100%;
  background-image:linear-gradient(90deg,
    rgba(91,115,196,.55) 0%,rgba(91,115,196,.20) 35%,
    rgba(150,175,230,.85) 50%,
    rgba(91,115,196,.20) 65%,rgba(91,115,196,.55) 100%);
  box-shadow:0 0 6px rgba(91,115,196,.20);
}
.tl-top .tl-line{animation:lineGrow .90s 3.80s ease-out forwards,lineShimmer 3.5s 5.0s ease-in-out infinite}
.tl-bot .tl-line{animation:lineGrow .90s 4.05s ease-out forwards,lineShimmer 3.5s 5.2s ease-in-out infinite}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lineShimmer{0%{background-position:-200% center}100%{background-position:400% center}}

.tagline{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:32px;
  color:var(--ink);letter-spacing:2px;
  text-align:center;line-height:1.55;
  padding:16px 0;
  text-shadow:0 0 18px rgba(91,115,196,.35), 0 2px 8px rgba(255,255,255,.60);
}
.tagline span{display:inline-block;opacity:0;animation:fadeUp .65s ease forwards}
.tagline span:nth-child(1){animation-delay:3.50s}
.tagline span:nth-child(2){animation-delay:3.72s}
.tagline span:nth-child(3){animation-delay:3.94s}
.tagline span:nth-child(4){animation-delay:4.16s}

.sub{
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:7px;
  color:var(--blue);text-transform:uppercase;
  margin-top:28px;opacity:0;animation:fadeUp .6s 5.2s ease forwards;
  text-shadow:0 0 10px rgba(91,115,196,.35);
}

.bot-rule{display:flex;align-items:center;gap:12px;margin-top:32px;opacity:0;animation:fadeUp .5s 5.6s ease forwards}
.bot-line{width:75px;height:1px;background:linear-gradient(90deg,transparent,rgba(91,115,196,.50),transparent)}
.bot-gem {width:8px;height:8px;background:var(--blue);  transform:rotate(45deg);box-shadow:0 0 10px var(--glow)}
.bot-gsm {width:5px;height:5px;background:var(--blue-l);transform:rotate(45deg)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>

  <div class="content">

    <div class="top-rule">
      <div class="tr-line"></div>
      <div class="tr-dot"></div>
      <div class="tr-text">Est. Baku, Azerbaijan</div>
      <div class="tr-dot"></div>
      <div class="tr-line" style="background:linear-gradient(90deg,rgba(91,115,196,.60),transparent)"></div>
    </div>

    <div class="eyebrow">
      <div class="ey-line"></div>
      <div class="ey-text">Destination Management Company</div>
      <div class="ey-line right"></div>
    </div>

    <div class="logo-frame">
      <svg class="frame-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect class="frame-rect" x=".8" y=".8" width="98.4" height="98.4"/>
      </svg>
      <div class="prog-bar"></div>

      <div class="corner c-tl"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">01</div></div>
      <div class="corner c-tr"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">02</div></div>
      <div class="corner c-bl"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">03</div></div>
      <div class="corner c-br"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">04</div></div>

      <div class="edge-t"></div><div class="edge-b"></div>
      <div class="edge-l"></div><div class="edge-r"></div>

      <div class="tick tick-t"></div><div class="tick tick-b"></div>
      <div class="tick tick-l"></div><div class="tick tick-r"></div>

      <div class="crosshair"><div class="ch-h"></div><div class="ch-v"></div><div class="ch-ring"></div></div>
      <div class="scan-line"></div>

      <div class="logo-wrap">
        <img class="logo-img"
             src="../TRUST DMC BLUE PNG.png"
             alt="Trust DMC">
      </div>
    </div>

    <div class="tagline-section">
      <div class="tl-rule tl-top">
        <div class="tl-d tl-d-l"></div>
        <div class="tl-line"></div>
        <div class="tl-d tl-d-r"></div>
      </div>
      <div class="tagline">
        <span>Your</span>&nbsp;<span>Journey.</span>&nbsp;<span>Our</span>&nbsp;<span>Expertise.</span>
      </div>
      <div class="tl-rule tl-bot">
        <div class="tl-d tl-d-l"></div>
        <div class="tl-line"></div>
        <div class="tl-d tl-d-r"></div>
      </div>
    </div>

    <div class="sub">Trusted &nbsp;·&nbsp; Experienced &nbsp;·&nbsp; Dedicated</div>

    <div class="bot-rule">
      <div class="bot-line"></div>
      <div class="bot-gsm"></div>
      <div class="bot-gem"></div>
      <div class="bot-gsm"></div>
      <div class="bot-line"></div>
    </div>

  </div>
</div>

<script>
// Scale stage to fit viewport while keeping 9:16
(function(){
  const s = document.getElementById('stage');
  function resize(){
    const scl = Math.min(window.innerWidth/1080, window.innerHeight/1920);
    s.style.transform = 'scale('+scl+')';
  }
  resize();
  window.addEventListener('resize', resize);
})();

// Canvas particles — full 9:16 canvas
const cv = document.getElementById('cv');
const W = 1080, H = 1920;
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const COLS = ['#5B73C4','#8B9FD8','#3A55A8','#A8BCE8','#7090CC','#C8D4F0'];

class Spark {
  constructor(){ this.reset(true) }
  reset(init){
    this.x=Math.random()*W; this.y=init?Math.random()*H:H+5;
    this.vx=(Math.random()-.5)*.38; this.vy=-(0.25+Math.random()*.70);
    this.r=.5+Math.random()*1.8;
    this.col=COLS[Math.floor(Math.random()*COLS.length)];
    this.alpha=0; this.life=0; this.maxLife=180+Math.random()*320;
    this.waver=Math.random()*Math.PI*2;
    this.isStar=Math.random()<.15;
  }
  tick(){
    this.life++;
    this.x+=this.vx+Math.sin(this.life*.03+this.waver)*.22; this.y+=this.vy;
    const t=this.life/this.maxLife;
    this.alpha=(t<.15?t/.15:t>.78?(1-t)/.22:1)*(this.isStar?.40:.22);
    if(this.life>=this.maxLife||this.y<-8) this.reset(false);
  }
  draw(){
    ctx.save(); ctx.globalAlpha=this.alpha;
    ctx.shadowColor=this.col; ctx.shadowBlur=this.r*(this.isStar?10:6);
    ctx.fillStyle=this.col;
    if(this.isStar){
      const s=this.r*2.5;
      ctx.fillRect(this.x-s/2,this.y-.7,s,1.4);
      ctx.fillRect(this.x-.7,this.y-s/2,1.4,s);
    } else {
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// More sparks to fill taller canvas
const sparks=Array.from({length:110},()=>new Spark());
(function loop(){
  ctx.clearRect(0,0,W,H);
  sparks.forEach(s=>{s.tick();s.draw()});
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
