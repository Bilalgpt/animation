<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aristokrat — 3D Particle Assembly</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body { width:100vw; height:100vh; background:#000; overflow:hidden; }

.stage {
  position:absolute;
  width:1080px; height:1920px;
  transform-origin:top left; overflow:hidden;
  background:
    radial-gradient(ellipse 100% 55% at 50% 46%,
      #0c1230 0%, #080d22 24%, #04061a 50%, #010210 74%, #000008 100%);
}

/* Ember canvas — z:2, below everything */
#emberCv { position:absolute; inset:0; z-index:2; pointer-events:none; }

/* Three.js renderer canvas — z:5, over embers */
#threeCanvas {
  position:absolute; inset:0; z-index:5; pointer-events:none;
  width:100% !important; height:100% !important;
}

/* Final PNG logo — fades in after assembly, z:6 */
.logo-img {
  position:absolute; z-index:6; pointer-events:none;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:860px; opacity:0;
}

/* Vignette */
.vignette {
  position:absolute; inset:0; z-index:10; pointer-events:none;
  background:radial-gradient(ellipse 90% 65% at 50% 50%,
    transparent 22%, rgba(0,0,10,0.45) 65%, rgba(0,0,6,0.90) 100%);
}

/* Letterbox bars */
.bar { position:absolute; left:0; right:0; z-index:15; height:48px; background:#000; }
.bar.t { top:0; } .bar.b { bottom:0; }

/* Credit */
.credit {
  position:absolute; bottom:14px; left:0; right:0;
  z-index:16; pointer-events:none; opacity:0;
  text-align:center; font-family:'Cinzel',serif;
  font-size:22px; font-weight:300;
  letter-spacing:8px; color:rgba(255,255,255,0.38);
  text-transform:uppercase;
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Ember particles (Canvas 2D) -->
  <canvas id="emberCv" width="1080" height="1920"></canvas>

  <!-- Three.js renderer injected here by JS -->

  <!-- Final sharp PNG logo (fades in at end) -->
  <img class="logo-img" id="logoImg" src="aristokrat_logo.png" alt="Aristokrat Travel">

  <div class="vignette"></div>
  <div class="bar t"></div>
  <div class="bar b"></div>
  <div class="credit" id="credit">Aristokrat Travel &nbsp;·&nbsp; Azerbaijan</div>

</div>

<script src="../libs/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ═══════════════════════════════════════════════
   STAGE SCALE
═══════════════════════════════════════════════ */
const stageEl = document.getElementById('stage');
function fitStage(){
  const scl = Math.min(window.innerWidth/1080, window.innerHeight/1920);
  stageEl.style.transform = `scale(${scl})`;
  stageEl.style.left = Math.max(0,(window.innerWidth -1080*scl)/2)+'px';
  stageEl.style.top  = Math.max(0,(window.innerHeight-1920*scl)/2)+'px';
}
fitStage(); window.addEventListener('resize', fitStage);

/* ═══════════════════════════════════════════════
   GOLDEN EMBER PARTICLES (Canvas 2D)
═══════════════════════════════════════════════ */
const eCv  = document.getElementById('emberCv');
const eCtx = eCv.getContext('2d');
const ECOLS = [[255,215,0],[255,190,0],[255,160,20],[255,140,30],[255,200,80]];

class Ember {
  constructor(init){ this.reset(init); }
  reset(init){
    this.x  = 20+Math.random()*1040;
    this.y  = init ? Math.random()*1920 : 1940+Math.random()*40;
    this.r  = 0.7+Math.random()*2.4;
    this.gr = this.r*(3.5+Math.random()*5);
    this.vx = (Math.random()-.5)*0.38; this.vy = -(0.30+Math.random()*0.88);
    this.wb = Math.random()*Math.PI*2; this.wbS = 0.012+Math.random()*0.022;
    this.wbA= 0.25+Math.random()*0.70;
    this.life=0; this.ml=200+Math.random()*800;
    this.pk = 0.38+Math.random()*0.55;
    this.col= ECOLS[Math.floor(Math.random()*ECOLS.length)];
  }
  tick(){
    this.life++; this.wb+=this.wbS;
    this.x+=this.vx+Math.sin(this.wb)*this.wbA; this.y+=this.vy;
    const t=this.life/this.ml;
    this.a=(t<.10?t/.10:t>.68?(1-t)/.32:1)*this.pk;
    if(this.life>=this.ml||this.y<-20) this.reset(false);
  }
  draw(){
    if(this.a<0.005) return;
    const [r,g,b]=this.col;
    const gr=eCtx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.gr);
    gr.addColorStop(0,  `rgba(${r},${g},${b},${(this.a*.55).toFixed(4)})`);
    gr.addColorStop(.40,`rgba(${r},${g},${b},${(this.a*.12).toFixed(4)})`);
    gr.addColorStop(1,  'transparent');
    eCtx.save(); eCtx.fillStyle=gr;
    eCtx.beginPath(); eCtx.arc(this.x,this.y,this.gr,0,Math.PI*2); eCtx.fill();
    eCtx.fillStyle=`rgba(${r},${g},${b},${Math.min(this.a*2,1).toFixed(4)})`;
    eCtx.beginPath(); eCtx.arc(this.x,this.y,this.r,0,Math.PI*2); eCtx.fill();
    eCtx.restore();
  }
}
const embers = Array.from({length:110},()=>new Ember(true));
function emberLoop(){
  eCtx.clearRect(0,0,1080,1920);
  embers.forEach(e=>{e.tick();e.draw();});
  requestAnimationFrame(emberLoop);
}
emberLoop();

/* ═══════════════════════════════════════════════
   THREE.JS — 3D PARTICLE ASSEMBLY
═══════════════════════════════════════════════ */
function buildScene(targetPositions){
  const W=1080, H=1920;
  const N = targetPositions.length;

  /* ── Scene ── */
  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(55, W/H, 1, 4000);
  camera.position.set(0, 0, 1400);

  const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);

  /* Inject renderer canvas into stage */
  const cv = renderer.domElement;
  cv.id = 'threeCanvas';
  cv.style.cssText = 'position:absolute;inset:0;z-index:5;pointer-events:none;width:100%!important;height:100%!important;';
  stageEl.insertBefore(cv, document.getElementById('logoImg'));

  /* ── Particle geometry ── */
  const posArr   = new Float32Array(N * 3);
  const startArr = new Float32Array(N * 3);
  const tgtArr   = new Float32Array(N * 3);
  const delArr   = new Float32Array(N);     /* per-particle delay 0..1 */

  /* Distribute particles randomly in a sphere */
  for(let i=0; i<N; i++){
    const theta = Math.random()*Math.PI*2;
    const phi   = Math.acos(2*Math.random()-1);
    const rad   = 300 + Math.random()*500;
    startArr[i*3]   = rad*Math.sin(phi)*Math.cos(theta);
    startArr[i*3+1] = rad*Math.sin(phi)*Math.sin(theta);
    startArr[i*3+2] = (Math.random()-.5)*600;
    tgtArr[i*3]     = targetPositions[i].x;
    tgtArr[i*3+1]   = targetPositions[i].y;
    tgtArr[i*3+2]   = 0;
    delArr[i]       = Math.random()*0.55; /* stagger depth */
    posArr[i*3]     = startArr[i*3];
    posArr[i*3+1]   = startArr[i*3+1];
    posArr[i*3+2]   = startArr[i*3+2];
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

  const mat = new THREE.PointsMaterial({
    color:           0xffffff,
    size:            3.2,
    sizeAttenuation: true,
    transparent:     true,
    opacity:         0.92,
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);

  /* ── Smoothstep helper ── */
  function smoothstep(t){ return t*t*(3-2*t); }

  /* ── Three.js render loop ── */
  function render(){
    requestAnimationFrame(render);
    renderer.render(scene, camera);
  }
  render();

  /* ── GSAP Master Timeline ── */
  const tl = gsap.timeline();

  /* Camera push-in: z 1400 → 320 over 6s */
  tl.to(camera.position, {
    z: 320, duration:6.0, ease:'power3.out',
    onUpdate: () => camera.updateProjectionMatrix()
  }, 0.4);

  /* Particle convergence — single progress tween */
  const prog = {p:0};
  tl.to(prog, {
    p: 1,
    duration: 5.8,
    ease: 'power3.out',
    onUpdate(){
      const p = prog.p;
      for(let i=0; i<N; i++){
        /* Each particle has its own start delay */
        const d  = delArr[i];
        const lt = d >= 1 ? 0 : Math.max(0, Math.min(1,(p-d)/(1-d)));
        const e  = smoothstep(lt);
        posArr[i*3]   = startArr[i*3]   + (tgtArr[i*3]   - startArr[i*3])   * e;
        posArr[i*3+1] = startArr[i*3+1] + (tgtArr[i*3+1] - startArr[i*3+1]) * e;
        posArr[i*3+2] = startArr[i*3+2] + (tgtArr[i*3+2] - startArr[i*3+2]) * e;
      }
      geo.attributes.position.needsUpdate = true;
    }
  }, 0.4);

  /* PNG logo fades in as particles arrive */
  tl.to('#logoImg', { opacity:1, duration:1.0, ease:'power2.out' }, 5.8);

  /* Particles dissolve once logo is visible */
  tl.to(mat, { opacity:0, duration:1.4, ease:'power2.in' }, 6.2);

  /* Credit text */
  tl.to('#credit', { opacity:1, duration:1.3, ease:'power2.out' }, 7.8);

  /* Hold then replay */
  tl.to({},{duration:1.2}, 9.8);
  tl.eventCallback('onComplete', ()=>{
    gsap.delayedCall(3.0, ()=>{
      /* Reset state */
      gsap.set('#logoImg', {opacity:0});
      gsap.set('#credit',  {opacity:0});
      mat.opacity = 0.92;
      camera.position.set(0,0,1400);
      for(let i=0;i<N;i++){
        posArr[i*3]  =startArr[i*3];
        posArr[i*3+1]=startArr[i*3+1];
        posArr[i*3+2]=startArr[i*3+2];
      }
      geo.attributes.position.needsUpdate=true;
      tl.restart();
    });
  });
}

/* ═══════════════════════════════════════════════
   STEP 1 — Sample logo PNG pixels → target list
   Load image → draw to hidden canvas → getImageData
   Collect visible (alpha > 100) pixel coords
   Scale to Three.js world space centred at (0,0)
═══════════════════════════════════════════════ */
function sampleLogo(src, targetCount, callback){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const iw = img.width, ih = img.height;

    /* Determine step so we get ~targetCount particles */
    const step = Math.max(1, Math.round(Math.sqrt(iw * ih / targetCount)));

    const tmp = document.createElement('canvas');
    tmp.width=iw; tmp.height=ih;
    const tCtx = tmp.getContext('2d');
    tCtx.drawImage(img, 0, 0);
    const data = tCtx.getImageData(0, 0, iw, ih).data;

    /* World scale: logo should span ~540px wide in Three.js units */
    const scale = 540 / iw;

    const pts = [];
    for(let y=0; y<ih; y+=step){
      for(let x=0; x<iw; x+=step){
        const idx = (y*iw + x)*4;
        if(data[idx+3] > 80){   /* alpha threshold */
          pts.push({
            x:  (x - iw/2) * scale,
            y: -(y - ih/2) * scale   /* flip Y for Three.js */
          });
        }
      }
    }

    /* Shuffle for organic arrival order */
    for(let i=pts.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pts[i],pts[j]]=[pts[j],pts[i]];
    }

    callback(pts);
  };
  img.src = src;
}

/* Boot */
sampleLogo('aristokrat_logo.png', 2500, buildScene);
</script>
</body>
</html>
