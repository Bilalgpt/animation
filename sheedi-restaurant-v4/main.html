<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Sheedi's Restaurant — Split Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --saffron:#FF7800;
  --gold:#C9922A;
  --gold-l:#F5D98E;
}
body{background:#000;display:flex;align-items:center;justify-content:center;
     width:100vw;height:100vh;overflow:hidden}
.stage{position:relative;width:820px;height:820px;overflow:hidden;background:#000}

.ambient{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 60% 54% at 50% 52%,
    rgba(90,0,8,.22) 0%,rgba(50,0,5,.08) 48%,transparent 68%);
  animation:ambientBreathe 5.5s 3s ease-in-out infinite;
}
@keyframes ambientBreathe{0%,100%{opacity:.5}50%{opacity:1}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* ── Content ── */
.content{
  position:absolute;top:96px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  z-index:8;pointer-events:none;
}

/* Eyebrow decorative lines */
.eyebrow{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  opacity:0;transition:opacity .7s ease;
}
.eyebrow.show{opacity:1}
.ey-ln{height:1px;width:80px;
       background:linear-gradient(90deg,transparent,rgba(255,120,0,.42),transparent)}
.ey-gm{width:5px;height:5px;background:var(--gold);
       transform:rotate(45deg);box-shadow:0 0 6px rgba(201,146,42,.5)}

/* ══════════════════════════════════════════════════════════════════
   LOGO ASSEMBLY
   Source image: 326 × 214 px   (measured via pixel scan)

   Detected boundaries (row std-dev scan):
     Quiet zone 1 (top ribbon solid) : y = 88 – 97
     Gold text band (banner centre)  : y = 99 – 108
     Quiet zone 2 (bot ribbon solid) : y = 109 – 118

   Three overlapping copies of the same <img>, each clipped:

   logo-top  : inset(0%      0%  57.48% 0%)   → rows 0–91    (top mandala)
   logo-mid  : inset(38.79%  0%  38.79% 0%)   → rows 83–131  (banner + text)
   logo-bot  : inset(54.67%  0%  0%     0%)   → rows 117–214 (bottom mandala)

   Overlaps at boundaries prevent seams between parts.

   ACT 1  ENTRY  (simultaneous ↕ convergence then banner flip)
     logo-top  wipes DOWN  : clip bottom  100% → 57.48%
     logo-bot  wipes UP    : clip top     100% → 54.67%
     logo-mid  flips IN    : rotateX −90° → 0°

   ACT 3  EXIT  (bottom + banner leave; top mandala remains as seal)
     logo-mid  flips OUT   : rotateX 0° → 90°
     logo-bot  wipes DOWN  : clip top  54.67% → 100%
══════════════════════════════════════════════════════════════════ */
.logo-assembly{
  position:relative;width:520px;
  perspective:900px;perspective-origin:50% 48%;
  z-index:5;
}
.logo-part{display:block;width:520px}
.logo-part.abs{position:absolute;top:0;left:0}

/* ── TOP (wipe down, stays forever) ── */
.logo-top{
  clip-path:inset(0 0 100% 0);   /* hidden until .reveal */
  position:relative;             /* establishes assembly height */
}
.logo-top.reveal{
  animation:topWipeDown 1.4s cubic-bezier(.38,0,.18,1) forwards;
}
@keyframes topWipeDown{
  0%  {clip-path:inset(0     0 100%   0)}
  100%{clip-path:inset(0     0 57.48% 0)}
}

/* ── BOTTOM (wipe up on entry, wipe down on exit) ── */
.logo-bot{clip-path:inset(100% 0 0 0)}
.logo-bot.reveal{
  animation:botWipeUp 1.4s cubic-bezier(.38,0,.18,1) forwards;
}
@keyframes botWipeUp{
  0%  {clip-path:inset(100%   0 0 0)}
  100%{clip-path:inset(54.67% 0 0 0)}
}
/* exit — applied via inline style so it overrides .reveal */
@keyframes botWipeDown{
  0%  {clip-path:inset(54.67% 0 0 0)}
  100%{clip-path:inset(100%   0 0 0)}
}

/* ── MIDDLE BANNER (flip in from behind, flip out on exit) ── */
.logo-mid{
  clip-path:inset(38.79% 0 38.79% 0);
  transform:rotateX(-90deg);
  transform-origin:50% 48%;   /* pivot at banner vertical centre */
  transform-style:preserve-3d;
}
.logo-mid.reveal{
  animation:bannerFlipIn 1.1s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes bannerFlipIn{
  0%  {transform:rotateX(-90deg)}
  60% {transform:rotateX(  8deg)}
  78% {transform:rotateX( -4deg)}
  90% {transform:rotateX(  2deg)}
  100%{transform:rotateX(  0deg)}
}
/* exit */
@keyframes bannerFlipOut{
  0%  {transform:rotateX(  0deg)}
  28% {transform:rotateX( -5deg)}  /* slight lean back before tip */
  100%{transform:rotateX( 90deg)}
}

/* ── Assembly glow ── */
.logo-assembly.glow{animation:assemblyGlow 7s ease-in-out infinite}
@keyframes assemblyGlow{
  0%,100%{filter:drop-shadow(0 0 10px rgba(201,146,42,.20))}
  50%    {filter:drop-shadow(0 0 38px rgba(255,100,0,.65))
                 drop-shadow(0 0 80px rgba(139,0,20,.18))}
}

/* Shimmer sweep */
.logo-assembly::after{
  content:'';position:absolute;inset:0;z-index:10;pointer-events:none;
  background:linear-gradient(110deg,
    transparent 14%,rgba(255,220,130,.22) 50%,transparent 86%);
  transform:translateX(-160%);
  animation:shimmer 1.2s ease-out forwards;animation-play-state:paused;
}
.logo-assembly.shimmer::after{animation-play-state:running}
@keyframes shimmer{to{transform:translateX(260%)}}

/* ── Outro fade helper ── */
.outro{transition:opacity .75s ease,transform .75s ease !important;opacity:0 !important}
.eyebrow.outro{transform:translateY(-8px)}
.sub-line.outro,.bot-orn.outro{transform:translateY(8px)}

/* ── Solo glow (after exit, top mandala alone) ── */
@keyframes soloGlow{
  0%,100%{filter:drop-shadow(0 0 14px rgba(201,146,42,.28))}
  50%    {filter:drop-shadow(0 0 32px rgba(255,120,0,.55))
                 drop-shadow(0 0 64px rgba(139,0,20,.14))}
}

/* ── Ornament divider ── */
.orn-div{margin:20px 0 4px;opacity:0;transition:opacity .7s}
.orn-div.show{opacity:1}
.orn-path{
  stroke:var(--saffron);stroke-width:.9;fill:none;opacity:.44;
  stroke-dasharray:300;stroke-dashoffset:300;
}
.orn-div.show .orn-path{animation:drawOrn 1.4s ease-out forwards}
@keyframes drawOrn{to{stroke-dashoffset:0}}

/* ── Tagline ── */
.tagline{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:23px;
  color:rgba(255,246,220,.78);letter-spacing:2px;text-align:center;
  filter:drop-shadow(0 0 12px rgba(255,100,0,.20));
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  min-height:36px;margin-top:4px;
  transition:opacity .75s ease,transform .75s ease;
}
.fw{display:inline-block;opacity:0}
.fw.flare{animation:wordFlare .68s cubic-bezier(.22,1,.36,1) forwards}
@keyframes wordFlare{
  0%  {opacity:0;transform:scale(1.90);filter:brightness(3.5) blur(7px)}
  25% {opacity:1;filter:brightness(1.6) blur(1px)}
  62% {transform:scale(.97)}
  100%{opacity:1;transform:scale(1);filter:brightness(1) blur(0)}
}

/* ── Sub caption ── */
.sub-line{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:6px;
  color:rgba(255,120,0,.38);text-transform:uppercase;
  margin-top:18px;opacity:0;transition:opacity .8s ease;
}
.sub-line.show{opacity:1}

/* ── Bottom ornament ── */
.bot-orn{
  display:flex;align-items:center;gap:8px;margin-top:14px;
  opacity:0;transition:opacity .7s .3s ease;
}
.bot-orn.show{opacity:1}
.bo-ln{width:54px;height:1px;
       background:linear-gradient(90deg,transparent,rgba(255,120,0,.36),transparent)}
.bo-gm{width:6px;height:6px;background:var(--saffron);
       transform:rotate(45deg);box-shadow:0 0 8px rgba(255,120,0,.5)}
.bo-sm{width:4px;height:4px;background:var(--gold-l);transform:rotate(45deg)}
</style>
</head>
<body>
<div class="stage">
  <div class="ambient"></div>
  <canvas id="cv"></canvas>

  <div class="content">

    <div class="eyebrow" id="eyRow">
      <div class="ey-ln"></div><div class="ey-gm"></div><div class="ey-ln"></div>
    </div>

    <!-- ══ 3-PART LOGO ASSEMBLY ══════════════════════════════ -->
    <div class="logo-assembly" id="asm">

      <!-- TOP mandala — wipes down, stays at end as the final seal -->
      <img class="logo-part logo-top" id="logoTop"
           src="../SHEEDI RESTAURANT.jpeg" alt="">

      <!-- BOTTOM mandala — wipes up on entry, wipes down on exit -->
      <img class="logo-part abs logo-bot" id="logoBot"
           src="../SHEEDI RESTAURANT.jpeg" alt="">

      <!-- MIDDLE banner — rotateX flips in, flips back out on exit -->
      <img class="logo-part abs logo-mid" id="logoMid"
           src="../SHEEDI RESTAURANT.jpeg"
           alt="The Sheedi's Restaurant">

    </div>

    <div class="orn-div" id="ornDiv">
      <svg width="280" height="20" viewBox="0 0 280 20">
        <path class="orn-path" d="M10,10 L116,10"/>
        <path class="orn-path" d="M164,10 L270,10"/>
        <circle cx="140" cy="10" r="5"   fill="none" stroke="rgba(255,120,0,.44)" stroke-width=".8"/>
        <circle cx="128" cy="10" r="2.5" fill="rgba(255,120,0,.30)"/>
        <circle cx="152" cy="10" r="2.5" fill="rgba(255,120,0,.30)"/>
        <polygon points="140,5 145,10 140,15 135,10"
                 fill="none" stroke="rgba(255,120,0,.52)" stroke-width=".8"/>
      </svg>
    </div>

    <div class="tagline" id="tagline">
      <span class="fw" id="tw0">Where</span>
      <span class="fw" id="tw1">Every</span>
      <span class="fw" id="tw2">Bite</span>
      <span class="fw" id="tw3">Tells</span>
      <span class="fw" id="tw4">a</span>
      <span class="fw" id="tw5">Story.</span>
    </div>

    <div class="sub-line" id="sub">Authentic &nbsp;·&nbsp; Flavourful &nbsp;·&nbsp; Unforgettable</div>

    <div class="bot-orn" id="bot">
      <div class="bo-ln"></div><div class="bo-sm"></div>
      <div class="bo-gm"></div>
      <div class="bo-sm"></div><div class="bo-ln"></div>
    </div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════
   CANVAS — petals + burst sparks
═══════════════════════════════════════ */
const cv  = document.getElementById('cv');
cv.width  = cv.height = 820;
const ctx = cv.getContext('2d');

const PC = ['#7B0016','#8B0018','#A31020','#B81428','#C9922A','#B08030','#D4A843'];
class Petal {
  constructor(init){ this.reset(init??true) }
  reset(init){
    this.x=Math.random()*820; this.y=init?Math.random()*820:-24;
    this.vy=.50+Math.random()*1.10; this.vx=(Math.random()-.5)*.55;
    this.rot=Math.random()*Math.PI*2; this.rotV=(Math.random()-.5)*.038;
    this.w=9+Math.random()*15; this.h=5+Math.random()*8;
    this.sway=Math.random()*Math.PI*2; this.swayS=.012+Math.random()*.018;
    this.a=init?Math.random()*.62:0; this.maxA=.48+Math.random()*.28;
    this.c=PC[Math.floor(Math.random()*PC.length)];
  }
  tick(){
    this.y+=this.vy; this.sway+=this.swayS;
    this.x+=this.vx+Math.sin(this.sway)*.45; this.rot+=this.rotV;
    this.a=Math.min(this.maxA,this.a+.020);
    if(this.y>844) this.reset(false);
  }
  draw(){
    ctx.save(); ctx.globalAlpha=this.a;
    ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.shadowColor=this.c; ctx.shadowBlur=3; ctx.fillStyle=this.c;
    ctx.beginPath(); ctx.ellipse(0,0,this.w/2,this.h/2,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

const SC=['#FF7800','#FFB940','#FF4500','#FFD060','#C9922A','#FF6020'];
class Spark{
  constructor(cx,cy){
    const a=Math.random()*Math.PI*2,spd=2.5+Math.random()*7;
    this.x=cx+(Math.random()-.5)*80; this.y=cy+(Math.random()-.5)*30;
    this.vx=Math.cos(a)*spd; this.vy=Math.sin(a)*spd-1.8;
    this.g=.10+Math.random()*.06; this.r=1+Math.random()*2.8;
    this.a=.9+Math.random()*.1; this.c=SC[Math.floor(Math.random()*SC.length)];
    this.dead=false;
  }
  tick(){
    this.vy+=this.g; this.x+=this.vx; this.y+=this.vy; this.vx*=.978;
    this.a-=.018+Math.random()*.008; if(this.a<=0)this.dead=true;
  }
  draw(){
    ctx.save(); ctx.globalAlpha=Math.max(0,this.a);
    ctx.shadowColor=this.c; ctx.shadowBlur=this.r*5; ctx.fillStyle=this.c;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

const petals=Array.from({length:60},()=>new Petal(true));
let burst=[];
function triggerBurst(cx,cy,n){for(let i=0;i<n;i++)burst.push(new Spark(cx,cy))}

(function loop(){
  ctx.clearRect(0,0,820,820);
  petals.forEach(p=>{p.tick();p.draw()});
  burst=burst.filter(s=>!s.dead);
  burst.forEach(s=>{s.tick();s.draw()});
  requestAnimationFrame(loop);
})();

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function flare(id,ms){setTimeout(()=>document.getElementById(id).classList.add('flare'),ms)}
function outro(el){el.classList.add('outro')}

/* ═══════════════════════════════════════════════════════════════════
   TIMELINE
   ─────────────────────────────────────────────────────────────────

   ACT 1 — ASSEMBLY
   0.00 s  Petals fall. Eyebrow lines fade in.
   0.70 s  logo-top WIPES DOWN  (1.4 s) ──┐ simultaneous ↕ convergence
   0.70 s  logo-bot WIPES UP    (1.4 s) ──┘
   1.60 s  logo-mid FLIPS IN from behind (1.1 s) + burst sparks
   2.10 s  top + bot finish
   2.70 s  logo-mid settles — full logo assembled

   ACT 2 — FULL PRESENCE
   2.50 s  Shimmer across logo
   2.80 s  Assembly glow pulse
   3.40 s  Ornament divider draws on
   3.70 s  Tagline words flare in  (6 × 165 ms stagger)
   5.90 s  Sub caption + bottom ornament

   ACT 3 — OUTRO  (banner + bottom leave; top mandala stays as seal)
   7.50 s  logo-mid FLIPS OUT    (0.9 s)  ──┐ simultaneous
   7.50 s  logo-bot WIPES DOWN   (0.9 s)  ──┘
   7.50 s  All text elements fade + drift out
   8.50 s  Upper mandala alone — solo glow pulse, indefinitely
═══════════════════════════════════════════════════════════════════ */
const logoTop = document.getElementById('logoTop');
const logoBot = document.getElementById('logoBot');
const logoMid = document.getElementById('logoMid');
const asm     = document.getElementById('asm');
const eyRow   = document.getElementById('eyRow');
const ornDiv  = document.getElementById('ornDiv');
const tagline = document.getElementById('tagline');
const sub     = document.getElementById('sub');
const bot     = document.getElementById('bot');

/* Canvas burst coords — content top:96, eyebrow ~30px, logo top ~140px
   Logo displayed at 520px wide, 520*(214/326) ≈ 341px tall
   Top-mandala: ~0-156px of logo height → CY_TOP ≈ 96+44+78 = 218
   Banner: 38.79-61.21% → banner mid at ~50% of 341 ≈ 170px → CY_MID ≈ 96+44+170 = 310
   Bottom-mandala: ~280px → CY_BOT ≈ 96+44+280 = 420                              */
const CX=410, CY_TOP=215, CY_MID=310, CY_BOT=400;

/* ACT 1 */
eyRow.classList.add('show');

setTimeout(()=>{
  logoTop.classList.add('reveal');
  logoBot.classList.add('reveal');
},700);

setTimeout(()=>{
  logoMid.classList.add('reveal');
  triggerBurst(CX,CY_TOP, 18);
  triggerBurst(CX,CY_MID, 30);
  triggerBurst(CX,CY_BOT, 18);
},1600);

/* ACT 2 */
setTimeout(()=>asm.classList.add('shimmer'), 2500);
setTimeout(()=>asm.classList.add('glow'),    2800);
setTimeout(()=>ornDiv.classList.add('show'), 3400);

flare('tw0',3700); flare('tw1',3865); flare('tw2',4030);
flare('tw3',4195); flare('tw4',4360); flare('tw5',4525);

setTimeout(()=>{
  sub.classList.add('show');
  bot.classList.add('show');
},5900);

/* ACT 3 */
setTimeout(()=>{
  /* Banner flips back behind */
  logoMid.style.animation='bannerFlipOut .90s cubic-bezier(.4,0,.6,1) forwards';
  /* Bottom wipes back down */
  logoBot.style.animation='botWipeDown  .90s cubic-bezier(.4,0,.6,1) forwards';
  /* All text fades out */
  [eyRow,ornDiv,tagline,sub,bot].forEach(outro);
},7500);

/* Solo glow after exit settles */
setTimeout(()=>{
  asm.style.animation='soloGlow 4s ease-in-out infinite';
},8500);
</script>
</body>
</html>
