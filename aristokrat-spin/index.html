<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aristokrat Travel — Logo Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  width:100vw; height:100vh;
  background:#000;
  overflow:hidden;
}

/* ── STAGE 1920×1080 ─────────────────────────── */
.stage {
  position:absolute;
  width:1920px; height:1080px;
  transform-origin:top left;
  overflow:hidden;
  /* Deep navy-to-black — matches video backdrop */
  background:
    radial-gradient(ellipse 75% 80% at 50% 46%,
      #0c1230 0%, #080d22 28%, #04061a 55%, #010210 78%, #000008 100%);
}

/* ── EMBER CANVAS (behind logo) ─────────────── */
#emberCv {
  position:absolute; inset:0;
  z-index:2; pointer-events:none;
}

/* ── LOGO GLOW (subtle cold-white ring at rest) */
.logo-glow {
  position:absolute; z-index:3; pointer-events:none;
  left:50%; top:50%;
  width:900px; height:520px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(ellipse 55% 55% at 50% 50%,
    rgba(200,215,255,0.055) 0%,
    rgba(160,185,255,0.018) 45%,
    transparent 70%);
  filter:blur(30px);
  opacity:0;
}

/* ── LOGO WRAP (GSAP animates this) ─────────── */
.logo-wrap {
  position:absolute; z-index:5; pointer-events:none;
  left:50%; top:50%;
  /* xPercent/yPercent set by GSAP */
}

.logo-img {
  /* PNG is white on transparent — display directly, no filter */
  width:640px;
  display:block;
  user-select:none;
}

/* ── VIGNETTE ────────────────────────────────── */
.vignette {
  position:absolute; inset:0; z-index:10; pointer-events:none;
  background:radial-gradient(ellipse 80% 72% at 50% 50%,
    transparent 25%, rgba(0,0,10,0.50) 68%, rgba(0,0,6,0.92) 100%);
}

/* ── CINEMATIC BARS ──────────────────────────── */
.bar {
  position:absolute; left:0; right:0; z-index:15;
  height:48px; background:#000;
}
.bar.t { top:0; }
.bar.b { bottom:0; }

/* ── CREDIT TEXT ─────────────────────────────── */
.credit {
  position:absolute; bottom:14px; left:0; right:0;
  z-index:16; pointer-events:none;
  text-align:center;
  font-family:'Cinzel',serif;
  font-size:11px; font-weight:300;
  letter-spacing:9px;
  color:rgba(255,255,255,0.35);
  text-transform:uppercase;
  opacity:0;
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Golden ember particles -->
  <canvas id="emberCv" width="1920" height="1080"></canvas>

  <!-- Soft glow ring behind resting logo -->
  <div class="logo-glow" id="logoGlow"></div>

  <!-- Logo — white PNG on dark bg, spins in -->
  <div class="logo-wrap" id="logoWrap">
    <img class="logo-img" id="logoImg"
         src="aristokrat_logo.png"
         alt="Aristokrat Travel Azerbaijan">
  </div>

  <!-- Cinematic framing -->
  <div class="vignette"></div>
  <div class="bar t"></div>
  <div class="bar b"></div>
  <div class="credit" id="credit">Aristokrat Travel &nbsp;·&nbsp; Azerbaijan</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ══════════════════════════════════════════════════
   STAGE SCALE — fit 1920×1080 into any viewport
══════════════════════════════════════════════════ */
(function(){
  const s = document.getElementById('stage');
  function fit(){
    const scl = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    s.style.transform = `scale(${scl})`;
    s.style.left = Math.max(0,(window.innerWidth -1920*scl)/2)+'px';
    s.style.top  = Math.max(0,(window.innerHeight-1080*scl)/2)+'px';
  }
  fit(); window.addEventListener('resize',fit);
})();

/* ══════════════════════════════════════════════════
   GOLDEN EMBER PARTICLES
   — warm gold/amber floating dots with glow halos,
     active from frame 0 throughout entire animation
══════════════════════════════════════════════════ */
const eCv  = document.getElementById('emberCv');
const eCtx = eCv.getContext('2d');

/* Ember colour palette — pure gold to warm amber */
const EMBER_COLS = [
  [255, 215,   0],   // gold
  [255, 190,   0],   // deep gold
  [255, 160,  20],   // amber-gold
  [255, 140,  30],   // warm amber
  [255, 120,  40],   // deep amber
  [255, 200,  80],   // bright gold
  [240, 180,   0],   // rich gold
];

class Ember {
  constructor(init){ this.reset(init); }

  reset(init){
    /* Spawn across full width, weighted toward lower half */
    this.x  = 30 + Math.random() * 1860;
    this.y  = init
               ? Math.random() * 1080              /* scatter on load */
               : 1090 + Math.random() * 60;        /* enter from bottom */

    this.r  = 0.7 + Math.random() * 2.4;          /* core radius */
    this.gr = this.r * (3.5 + Math.random()*4.5); /* glow radius */

    this.vx = (Math.random() - 0.5) * 0.38;
    this.vy = -(0.28 + Math.random() * 0.85);     /* float upward */

    this.wb    = Math.random() * Math.PI * 2;      /* wobble phase */
    this.wbSpd = 0.012 + Math.random() * 0.022;
    this.wbAmp = 0.25  + Math.random() * 0.70;

    this.life    = 0;
    this.maxLife = 180 + Math.random() * 720;
    this.peakA   = 0.38 + Math.random() * 0.58;   /* max opacity */

    this.col = EMBER_COLS[Math.floor(Math.random() * EMBER_COLS.length)];

    /* Occasional larger "firefly" ember */
    if(Math.random() < 0.08){
      this.r  *= 2.2;
      this.gr *= 1.8;
      this.peakA *= 0.7;
    }
  }

  tick(){
    this.life++;
    this.wb += this.wbSpd;
    this.x  += this.vx + Math.sin(this.wb) * this.wbAmp;
    this.y  += this.vy;

    /* Fade in / hold / fade out */
    const t = this.life / this.maxLife;
    this.a  = (t < 0.10 ? t/0.10 : t > 0.68 ? (1-t)/0.32 : 1) * this.peakA;

    if(this.life >= this.maxLife || this.y < -20 || this.x < -20 || this.x > 1940)
      this.reset(false);
  }

  draw(){
    if(this.a < 0.005) return;
    const [r,g,b] = this.col;

    /* Outer glow halo */
    const grd = eCtx.createRadialGradient(
      this.x, this.y, 0,
      this.x, this.y, this.gr
    );
    grd.addColorStop(0,   `rgba(${r},${g},${b},${(this.a * 0.55).toFixed(4)})`);
    grd.addColorStop(0.35,`rgba(${r},${g},${b},${(this.a * 0.18).toFixed(4)})`);
    grd.addColorStop(0.70,`rgba(${r},${g},${b},${(this.a * 0.04).toFixed(4)})`);
    grd.addColorStop(1,   'transparent');

    eCtx.save();
    eCtx.fillStyle = grd;
    eCtx.beginPath();
    eCtx.arc(this.x, this.y, this.gr, 0, Math.PI*2);
    eCtx.fill();

    /* Bright core dot */
    const coreA = Math.min(this.a * 2.2, 1.0);
    eCtx.fillStyle = `rgba(${r},${g},${b},${coreA.toFixed(4)})`;
    eCtx.beginPath();
    eCtx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    eCtx.fill();

    eCtx.restore();
  }
}

/* Pool of 110 embers — dense, rich field */
const emberPool = Array.from({length:110}, (_,i) => new Ember(true));

/* ══════════════════════════════════════════════════
   RAF LOOP — always running
══════════════════════════════════════════════════ */
(function loop(){
  eCtx.clearRect(0, 0, 1920, 1080);
  emberPool.forEach(e => { e.tick(); e.draw(); });
  requestAnimationFrame(loop);
})();

/* ══════════════════════════════════════════════════
   GSAP — SPIN-IN LOGO REVEAL
   Logo starts: tiny (scale 0.012) + spinning (900°)
   Logo ends:   full size, 0° rotation, sharp
══════════════════════════════════════════════════ */
const tl = gsap.timeline();

/* — Initial state: tiny, spinning, centered — */
gsap.set('#logoWrap', {
  xPercent : -50,
  yPercent : -50,
  scale    : 0.012,   /* starts as a tiny dot in the deep background */
  rotation : 900,     /* 2.5 full spins — will unwind to 0 */
  opacity  : 1,       /* always visible, just tiny */
});
gsap.set('#logoGlow',  { opacity: 0 });
gsap.set('#credit',    { opacity: 0, y: 6 });

/* ── SPIN-IN: 0.2 → 5.8s ──
   scale + rotation ease out together with power4
   → fast spinning approach, dramatic deceleration,
     logo "unspins" and lands perfectly still        */
tl.to('#logoWrap', {
  scale    : 1,
  rotation : 0,
  duration : 5.6,
  ease     : 'power4.out',
}, 0.2);

/* ── SUBTLE DEPTH BLUR: clears as logo approaches ── */
gsap.set('#logoWrap', { filter:'blur(4px)' });
tl.to('#logoWrap', {
  filter   : 'blur(0px)',
  duration : 4.0,
  ease     : 'power3.out',
}, 0.5);

/* ── GLOW BLOOMS as logo settles ── */
tl.to('#logoGlow', {
  opacity  : 1,
  duration : 2.2,
  ease     : 'power2.out',
}, 4.5);

/* ── CREDIT fades in on freeze frame ── */
tl.to('#credit', {
  opacity  : 1,
  y        : 0,
  duration : 1.4,
  ease     : 'power2.out',
}, 6.8);

/* ── HOLD freeze frame ── */
tl.to({}, { duration: 1.0 }, 9.5);

/* ── AUTO REPLAY after 3 s hold ── */
tl.eventCallback('onComplete', () => {
  gsap.delayedCall(3.0, () => {
    tl.restart();
  });
});
</script>
</body>
</html>
