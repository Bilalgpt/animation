<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trust DMC — V2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:    #07090F;
  --blue:  #7A9AE0;
  --blue-l:#A8BCEE;
  --blue-d:#4B6CB7;
  --ink:   rgba(255,255,255,.82);
  --glow:  rgba(122,154,224,.45);
}

body{
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  width:100vw;height:100vh;overflow:hidden;
}

.stage{
  position:relative;
  width:820px;height:820px;
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-color:var(--bg);
  background-image:radial-gradient(circle, rgba(122,154,224,.10) 1px, transparent 1px);
  background-size:26px 26px;
}
.stage::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse 72% 70% at 50% 46%,
    rgba(122,154,224,.06) 0%, transparent 45%, rgba(4,6,14,.55) 100%);
  pointer-events:none;
}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.watermark{
  position:absolute;font-family:'Cinzel',serif;font-weight:600;
  font-size:260px;letter-spacing:10px;color:rgba(255,255,255,.028);
  white-space:nowrap;pointer-events:none;user-select:none;z-index:0;
  top:50%;left:50%;transform:translate(-50%,-50%);
  opacity:0;animation:fadeIn 1.5s .5s ease forwards;
}

.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

/* ── Top rule ────────────────────────────────── */
.top-rule{display:flex;align-items:center;gap:10px;margin-bottom:18px;opacity:0;animation:fadeIn .5s .1s ease forwards}
.tr-line{height:1px;width:0;background:linear-gradient(90deg,transparent,rgba(122,154,224,.40));animation:growR70 .7s .15s ease forwards}
.tr-dot{width:3px;height:3px;background:var(--blue-l);border-radius:50%}
.tr-text{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:7px;color:rgba(122,154,224,.50);text-transform:uppercase}
@keyframes growR70{to{width:70px}}

/* ── Eyebrow ─────────────────────────────────── */
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.ey-line{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--blue));animation:ey-lineR .8s .25s ease forwards}
.ey-line.right{background:linear-gradient(90deg,var(--blue),transparent)}
@keyframes ey-lineR{to{width:50px}}
.ey-text{font-family:'Cinzel',serif;font-size:10px;letter-spacing:8px;color:rgba(122,154,224,.60);text-transform:uppercase;opacity:0;animation:fadeIn .7s .35s ease forwards}

/* ══ LOGO FRAME ════════════════════════════════ */
.logo-frame{position:relative;padding:24px 26px;display:inline-block}

.frame-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:0;animation:fadeIn .5s 2.4s ease forwards}
.frame-rect{fill:none;stroke:rgba(122,154,224,.18);stroke-width:.9;stroke-dasharray:5 8;animation:marchAnt 3s 2.4s linear infinite}
@keyframes marchAnt{to{stroke-dashoffset:-26}}

.corner{position:absolute;width:34px;height:34px;z-index:4}
.c-tl{top:0;left:0}.c-tr{top:0;right:0}.c-bl{bottom:0;left:0}.c-br{bottom:0;right:0}
.c-h{position:absolute;height:2px;width:0;background:var(--blue);box-shadow:0 0 10px var(--glow)}
.c-v{position:absolute;width:2px;height:0;background:var(--blue);box-shadow:0 0 10px var(--glow)}
.c-tl .c-h{top:0;left:0; animation:growH34 .45s 1.80s ease-out forwards}
.c-tl .c-v{top:0;left:0; animation:growV34 .45s 1.80s ease-out forwards}
.c-tr .c-h{top:0;right:0;animation:growH34 .45s 1.88s ease-out forwards}
.c-tr .c-v{top:0;right:0;animation:growV34 .45s 1.88s ease-out forwards}
.c-bl .c-h{bottom:0;left:0;  animation:growH34 .45s 1.96s ease-out forwards}
.c-bl .c-v{bottom:0;left:0;  animation:growV34 .45s 1.96s ease-out forwards}
.c-br .c-h{bottom:0;right:0; animation:growH34 .45s 2.04s ease-out forwards}
.c-br .c-v{bottom:0;right:0; animation:growV34 .45s 2.04s ease-out forwards}
@keyframes growH34{to{width:34px}} @keyframes growV34{to{height:34px}}

.corner::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--blue);opacity:0;
  animation:fadeIn .3s 2.25s ease forwards, cDotPulse 3s 3s ease-in-out infinite;
  box-shadow:0 0 10px var(--glow);
}
.c-tl::after{top:-1px;left:-1px}.c-tr::after{top:-1px;right:-1px}
.c-bl::after{bottom:-1px;left:-1px}.c-br::after{bottom:-1px;right:-1px}
@keyframes cDotPulse{0%,100%{box-shadow:0 0 7px var(--glow)}50%{box-shadow:0 0 18px rgba(122,154,224,.90),0 0 34px rgba(122,154,224,.32)}}

.c-arc{position:absolute;width:18px;height:18px;overflow:hidden;opacity:0;animation:fadeIn .4s 2.3s ease forwards}
.c-tl .c-arc{top:0;left:0}.c-tr .c-arc{top:0;right:0;transform:scaleX(-1)}
.c-bl .c-arc{bottom:0;left:0;transform:scaleY(-1)}.c-br .c-arc{bottom:0;right:0;transform:scale(-1,-1)}
.c-arc::after{content:'';position:absolute;width:34px;height:34px;border:1.5px solid rgba(122,154,224,.45);border-radius:50%;top:0;left:0;box-shadow:0 0 6px rgba(122,154,224,.30)}

.c-label{position:absolute;font-family:'Cinzel',serif;font-size:8px;letter-spacing:1.5px;color:rgba(122,154,224,.55);opacity:0;animation:fadeIn .4s 2.5s ease forwards;white-space:nowrap;z-index:5}
.c-tl .c-label{top:6px;left:38px}.c-tr .c-label{top:6px;right:38px}
.c-bl .c-label{bottom:6px;left:38px}.c-br .c-label{bottom:6px;right:38px}

.edge-t,.edge-b{position:absolute;left:34px;right:34px;height:1px;background:linear-gradient(90deg,rgba(122,154,224,.65) 0%,rgba(122,154,224,.12) 20%,rgba(122,154,224,.12) 80%,rgba(122,154,224,.65) 100%);z-index:3}
.edge-t{top:0;transform:scaleX(0);transform-origin:left;animation:edgeH .55s 2.35s ease-out forwards}
.edge-b{bottom:0;transform:scaleX(0);transform-origin:right;animation:edgeH .55s 2.40s ease-out forwards}
.edge-l,.edge-r{position:absolute;top:34px;bottom:34px;width:1px;background:linear-gradient(180deg,rgba(122,154,224,.65) 0%,rgba(122,154,224,.12) 20%,rgba(122,154,224,.12) 80%,rgba(122,154,224,.65) 100%);z-index:3}
.edge-l{left:0;transform:scaleY(0);transform-origin:top;animation:edgeV .55s 2.40s ease-out forwards}
.edge-r{right:0;transform:scaleY(0);transform-origin:bottom;animation:edgeV .55s 2.45s ease-out forwards}
@keyframes edgeH{to{transform:scaleX(1)}} @keyframes edgeV{to{transform:scaleY(1)}}

.tick{position:absolute;background:var(--blue);z-index:4;opacity:0;animation:fadeIn .35s 2.6s ease forwards;box-shadow:0 0 6px var(--glow)}
.tick-t,.tick-b{width:2px;height:10px;left:50%;transform:translateX(-50%)}.tick-t{top:0}.tick-b{bottom:0}
.tick-l,.tick-r{width:10px;height:2px;top:50%;transform:translateY(-50%)}.tick-l{left:0}.tick-r{right:0}

.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;opacity:0;animation:fadeIn .4s 2.55s ease forwards}
.ch-h{position:absolute;width:18px;height:1px;background:rgba(122,154,224,.30);top:0;left:-9px}
.ch-v{position:absolute;height:18px;width:1px;background:rgba(122,154,224,.30);left:0;top:-9px}
.ch-ring{position:absolute;width:9px;height:9px;border:1px solid rgba(122,154,224,.38);border-radius:50%;top:-4px;left:-4px;animation:ringPulse 3s 3s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.6);opacity:0}}

.prog-bar{position:absolute;bottom:0;left:0;height:2px;width:0;z-index:5;background:linear-gradient(90deg,var(--blue-d),var(--blue),var(--blue-l));box-shadow:0 0 10px var(--glow),0 0 20px rgba(122,154,224,.25);animation:progFill 2.8s .6s ease-out forwards}
@keyframes progFill{to{width:100%}}

.scan-line{position:absolute;left:0;right:0;height:2px;z-index:6;background:linear-gradient(90deg,transparent 0%,rgba(122,154,224,.45) 20%,rgba(122,154,224,.90) 50%,rgba(122,154,224,.45) 80%,transparent 100%);box-shadow:0 0 14px var(--glow),0 0 28px rgba(122,154,224,.20);top:0;opacity:0;animation:scanDown 1.6s 2.75s ease-in-out forwards;pointer-events:none}
@keyframes scanDown{0%{top:0;opacity:0}5%{opacity:1}88%{opacity:.9}100%{top:100%;opacity:0}}

.logo-wrap{position:relative;width:310px;overflow:hidden;z-index:2}
.logo-img{display:block;width:310px;opacity:0;transform:scale(.82) translateY(14px);filter:blur(10px);animation:logoReveal 1.3s .45s cubic-bezier(.22,1,.36,1) forwards, logoPulse 5s 3.5s ease-in-out infinite}
@keyframes logoReveal{0%{opacity:0;transform:scale(.82) translateY(14px);filter:blur(10px)}38%{filter:blur(0)}66%{transform:scale(1.04) translateY(-3px);opacity:1}83%{transform:scale(.98) translateY(1px)}100%{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 18px rgba(122,154,224,.28))}50%{filter:drop-shadow(0 0 38px rgba(122,154,224,.60)) drop-shadow(0 0 70px rgba(122,154,224,.20))}}
.logo-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(108deg,transparent 25%,rgba(180,205,255,.18) 50%,transparent 75%);transform:translateX(-140%);animation:shimmer 1.1s 1.9s ease-out forwards;pointer-events:none}
@keyframes shimmer{to{transform:translateX(250%)}}

/* ══════════════════════════════════════════════
   TAGLINE SECTION WITH ANIMATED RULE LINES

   Layout (top-to-bottom):
     top rule:  ◆ ─────────────── ◆
     tagline text (word by word)
     bot rule:  ◆ ─────────────── ◆

   Sequence per rule:
     1. Left diamond crystallises slowly (1.6s)
     2. Line draws left → right         (0.9s)
     3. Right diamond crystallises      (1.6s)
     4. Shimmer light travels the line  (loops)
   ══════════════════════════════════════════════ */
.tagline-section{
  display:flex;flex-direction:column;align-items:stretch;
  width:370px;
  margin-top:20px;
}

/* ── Rule row ─── */
.tl-rule{
  display:flex;align-items:center;
  gap:0;
  width:100%;
}

/* ── Diamond ─── */
.tl-d{
  width:8px;height:8px;
  background:var(--blue);
  transform:rotate(45deg) scale(0);
  opacity:0;
  flex-shrink:0;
  box-shadow:0 0 12px var(--glow);
  position:relative;z-index:1;
}

/*
  Left diamonds start first — they materialise slowly
  before the line even begins to draw.
  "Slow mo" = 1.6s duration with elastic micro-bounce.
*/
@keyframes diamondCrystal{
  0%   {transform:rotate(45deg) scale(0);   opacity:0}
  18%  {opacity:.30}
  55%  {transform:rotate(45deg) scale(1.25);opacity:.80}
  72%  {transform:rotate(45deg) scale(.90)}
  88%  {transform:rotate(45deg) scale(1.06)}
  100% {transform:rotate(45deg) scale(1);   opacity:1}
}

/* TOP rule timing */
.tl-top .tl-d-l{animation:diamondCrystal 1.6s 3.20s ease-out forwards}
.tl-top .tl-d-r{animation:diamondCrystal 1.6s 4.70s ease-out forwards}

/* BOTTOM rule — 0.25s offset so they don't feel identical */
.tl-bot .tl-d-l{animation:diamondCrystal 1.6s 3.45s ease-out forwards}
.tl-bot .tl-d-r{animation:diamondCrystal 1.6s 4.95s ease-out forwards}

/* ── Line ─── */
.tl-line{
  flex:1;
  height:1px;
  position:relative;
  transform:scaleX(0);
  transform-origin:left center;
  /* The gradient gives slight fade-out at both ends */
  background:linear-gradient(90deg,
    rgba(122,154,224,.80) 0%,
    rgba(122,154,224,.35) 40%,
    rgba(122,154,224,.35) 60%,
    rgba(122,154,224,.80) 100%);
  box-shadow:0 0 6px rgba(122,154,224,.30);
}

/* Line draws after left diamond is visible (~0.8s into its 1.6s animation) */
.tl-top .tl-line{animation:lineGrow .90s 3.80s ease-out forwards, lineShimmer 3.5s 5.0s ease-in-out infinite}
.tl-bot .tl-line{animation:lineGrow .90s 4.05s ease-out forwards, lineShimmer 3.5s 5.2s ease-in-out infinite}

@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/*
  After line draws, a soft light travels along it continuously.
  Achieved via background-position animation on a highlight gradient.
*/
@keyframes lineShimmer{
  0%  {background-position:-200% center}
  100%{background-position: 400% center}
}
.tl-top .tl-line,
.tl-bot .tl-line{
  background-size:200% 100%;
}
/* Override gradient to include the travelling highlight */
.tl-top .tl-line,
.tl-bot .tl-line{
  background-image:linear-gradient(90deg,
    rgba(122,154,224,.55) 0%,
    rgba(122,154,224,.20) 35%,
    rgba(200,218,255,.85) 50%,
    rgba(122,154,224,.20) 65%,
    rgba(122,154,224,.55) 100%);
}

/* ── Tagline text (word by word) ─────────────── */
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:23px;
  color:var(--ink);letter-spacing:1.5px;
  text-align:center;line-height:1.55;
  padding:10px 0;
}
.tagline span{
  display:inline-block;opacity:0;
  animation:fadeUp .65s ease forwards;
}
.tagline span:nth-child(1){animation-delay:3.50s}
.tagline span:nth-child(2){animation-delay:3.72s}
.tagline span:nth-child(3){animation-delay:3.94s}
.tagline span:nth-child(4){animation-delay:4.16s}

/* ── Sub ─────────────────────────────────────── */
.sub{
  font-family:'Cinzel',serif;
  font-size:9.5px;letter-spacing:6px;
  color:rgba(122,154,224,.55);text-transform:uppercase;
  margin-top:16px;
  opacity:0;animation:fadeUp .6s 5.2s ease forwards;
}

/* ── Bottom gem row ──────────────────────────── */
.bot-rule{
  display:flex;align-items:center;gap:9px;
  margin-top:22px;
  opacity:0;animation:fadeUp .5s 5.6s ease forwards;
}
.bot-line{width:55px;height:1px;background:linear-gradient(90deg,transparent,rgba(122,154,224,.38),transparent)}
.bot-gem {width:6px;height:6px;background:var(--blue);  transform:rotate(45deg);box-shadow:0 0 8px var(--glow)}
.bot-gsm {width:4px;height:4px;background:var(--blue-l);transform:rotate(45deg)}

/* ── Shared ──────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="watermark">DMC</div>

  <div class="content">

    <div class="top-rule">
      <div class="tr-line"></div>
      <div class="tr-dot"></div>
      <div class="tr-text">Est. Baku, Azerbaijan</div>
      <div class="tr-dot"></div>
      <div class="tr-line" style="background:linear-gradient(90deg,rgba(122,154,224,.40),transparent)"></div>
    </div>

    <div class="eyebrow">
      <div class="ey-line"></div>
      <div class="ey-text">Destination Management Company</div>
      <div class="ey-line right"></div>
    </div>

    <!-- ══ FRAMED LOGO ═══════════════════════════ -->
    <div class="logo-frame">
      <svg class="frame-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect class="frame-rect" x=".8" y=".8" width="98.4" height="98.4"/>
      </svg>
      <div class="prog-bar"></div>

      <div class="corner c-tl"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">01</div></div>
      <div class="corner c-tr"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">02</div></div>
      <div class="corner c-bl"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">03</div></div>
      <div class="corner c-br"><div class="c-h"></div><div class="c-v"></div><div class="c-arc"></div><div class="c-label">04</div></div>

      <div class="edge-t"></div><div class="edge-b"></div>
      <div class="edge-l"></div><div class="edge-r"></div>

      <div class="tick tick-t"></div><div class="tick tick-b"></div>
      <div class="tick tick-l"></div><div class="tick tick-r"></div>

      <div class="crosshair">
        <div class="ch-h"></div><div class="ch-v"></div><div class="ch-ring"></div>
      </div>
      <div class="scan-line"></div>

      <div class="logo-wrap">
        <img class="logo-img"
             src="../New_logo_design/TRUST DMC WHITE PNG.png"
             alt="Trust DMC">
      </div>
    </div>

    <!-- ══ TAGLINE SECTION ════════════════════════
         Top rule  →  tagline text  →  bottom rule
         Each rule: left ◆ ... line ... right ◆
    ═══════════════════════════════════════════════ -->
    <div class="tagline-section">

      <!-- Top rule -->
      <div class="tl-rule tl-top">
        <div class="tl-d tl-d-l"></div>
        <div class="tl-line"></div>
        <div class="tl-d tl-d-r"></div>
      </div>

      <!-- Tagline text -->
      <div class="tagline">
        <span>Your</span>&nbsp;<span>Journey.</span>&nbsp;<span>Our</span>&nbsp;<span>Expertise.</span>
      </div>

      <!-- Bottom rule -->
      <div class="tl-rule tl-bot">
        <div class="tl-d tl-d-l"></div>
        <div class="tl-line"></div>
        <div class="tl-d tl-d-r"></div>
      </div>

    </div>

    <div class="sub">Trusted &nbsp;·&nbsp; Experienced &nbsp;·&nbsp; Dedicated</div>

    <div class="bot-rule">
      <div class="bot-line"></div>
      <div class="bot-gsm"></div>
      <div class="bot-gem"></div>
      <div class="bot-gsm"></div>
      <div class="bot-line"></div>
    </div>

  </div>
</div>

<script>
const cv  = document.getElementById('cv');
cv.width  = cv.height = 820;
const ctx = cv.getContext('2d');
const COLS = ['#4B6CB7','#8099D8','#2E4A90','#A8BCEE','#6280C8','#BDCEf4'];

class Spark {
  constructor(){ this.reset(true) }
  reset(init){
    this.x=Math.random()*820; this.y=init?Math.random()*820:825;
    this.vx=(Math.random()-.5)*.38; this.vy=-(0.20+Math.random()*.60);
    this.r=.4+Math.random()*1.6;
    this.col=COLS[Math.floor(Math.random()*COLS.length)];
    this.alpha=0; this.life=0; this.maxLife=160+Math.random()*280;
    this.waver=Math.random()*Math.PI*2;
    this.isStar=Math.random()<.15;
  }
  tick(){
    this.life++;
    this.x+=this.vx+Math.sin(this.life*.03+this.waver)*.22; this.y+=this.vy;
    const t=this.life/this.maxLife;
    this.alpha=(t<.15?t/.15:t>.78?(1-t)/.22:1)*(this.isStar?.55:.32);
    if(this.life>=this.maxLife||this.y<-8) this.reset(false);
  }
  draw(){
    ctx.save(); ctx.globalAlpha=this.alpha;
    ctx.shadowColor=this.col; ctx.shadowBlur=this.r*(this.isStar?10:6);
    ctx.fillStyle=this.col;
    if(this.isStar){
      const s=this.r*2.5;
      ctx.fillRect(this.x-s/2,this.y-.7,s,1.4);
      ctx.fillRect(this.x-.7,this.y-s/2,1.4,s);
    } else {
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

const sparks=Array.from({length:60},()=>new Spark());
(function loop(){
  ctx.clearRect(0,0,820,820);
  sparks.forEach(s=>{s.tick();s.draw()});
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
