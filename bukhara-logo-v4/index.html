<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukhara — The Grand Curtain</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#060402;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

#stage {
  position:relative;
  width:540px; height:960px;
  background:#0a0604;
  overflow:hidden;
  flex-shrink:0;
}

/* ── Logo (always present, behind curtains) ─── */
#logo-wrap {
  position:absolute;
  left:50%; top:44%;
  transform:translate(-50%,-50%);
  z-index:1;
}
#logo-img {
  width:780px; display:block;
  filter: drop-shadow(0 0 16px rgba(255,190,50,0.60))
          drop-shadow(0 0 42px rgba(210,120,20,0.25));
}

/* ── SVG ring ─────────────────────────────────── */
#ring-wrap {
  position:absolute;
  left:50%; top:44%;
  transform:translate(-50%,-50%);
  width:660px; height:660px;
  z-index:2; pointer-events:none; opacity:0;
}
#ring-wrap svg { width:100%; height:100%; }

/* ── Shimmer ──────────────────────────────────── */
#shimmer {
  position:absolute; top:0; left:-70%; width:55%; height:100%;
  background:linear-gradient(90deg,
    transparent 0%, rgba(255,215,110,0.0) 30%,
    rgba(255,225,130,0.26) 50%, rgba(255,215,110,0.0) 70%, transparent 100%);
  z-index:3; pointer-events:none; mix-blend-mode:screen; opacity:0;
}

/* ── Text / UI ────────────────────────────────── */
#line-top {
  position:absolute; top:118px; left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel',serif; font-size:12px; font-weight:600;
  letter-spacing:0.30em; text-transform:uppercase;
  color:rgba(220,183,95,0.88); white-space:nowrap;
  opacity:0; z-index:3;
}
#line-top .char { display:inline-block; }

.divider {
  position:absolute; left:50%;
  transform:translateX(-50%);
  display:flex; align-items:center; gap:9px;
  opacity:0; white-space:nowrap; z-index:3;
}
#div-top { top:146px; }
#div-bot { top:798px; }
.dline { height:1px; background:rgba(195,150,45,0.48); width:0; }
.ddot  { width:4px; height:4px; border-radius:50%; background:rgba(205,160,52,0.82); flex-shrink:0; }

#tagline-block {
  position:absolute; top:845px; left:50%;
  transform:translateX(-50%);
  opacity:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  text-align:center;
}
#tagline-label {
  font-family:'Cinzel',serif; font-size:8.5px; letter-spacing:0.34em;
  text-transform:uppercase; color:rgba(190,145,42,0.65);
}
#typed-line {
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:17px; font-weight:300;
  color:rgba(232,197,115,0.90); letter-spacing:0.05em; min-height:24px;
}
.typed-cursor { color:rgba(255,198,58,0.85); animation:blink 0.9s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

#badge {
  position:absolute; top:908px; left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel',serif; font-size:10.5px;
  letter-spacing:0.22em; color:rgba(200,158,55,0.80);
  opacity:0; z-index:3;
  display:flex; align-items:center; gap:9px; white-space:nowrap;
}
.bdot { width:4px; height:4px; border-radius:50%; background:rgba(200,158,55,0.8); }

/* ── Tie-back ornaments ───────────────────────── */
.tieback {
  position:absolute; top:52%; z-index:8;
  width:42px; height:42px; border-radius:50%;
  border:1.5px solid rgba(200,158,50,0.75);
  background:radial-gradient(circle at 40% 40%,
    rgba(200,158,50,0.22) 0%, rgba(160,110,25,0.08) 60%, transparent 100%);
  opacity:0;
  display:flex; align-items:center; justify-content:center;
}
.tieback::after {
  content:'';
  width:14px; height:14px; border-radius:50%;
  background:rgba(200,158,50,0.35);
  border:1px solid rgba(200,158,50,0.6);
}
#tieback-left  { left:-50px; }
#tieback-right { right:-50px; }

/* ── Curtain valance (top frame bar) ─────────── */
#valance {
  position:absolute; top:0; left:0; right:0;
  height:52px; z-index:12;
  background:linear-gradient(180deg, #3a0d18 0%, #2c0912 60%, #1e060d 100%);
  border-bottom:2px solid rgba(200,155,48,0.65);
  box-shadow:0 4px 22px rgba(0,0,0,0.9);
}
/* Gold top stripe */
#valance::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,
    transparent 0%, rgba(200,158,50,0.5) 15%,
    rgba(220,175,65,0.85) 50%, rgba(200,158,50,0.5) 85%, transparent 100%);
}

/* ── Tassels ──────────────────────────────────── */
#tassels {
  position:absolute; top:52px; left:0; right:0;
  height:50px; z-index:11;
  display:flex; justify-content:space-around; align-items:flex-start;
  padding:0 8px;
  pointer-events:none;
}
.tassel {
  width:10px;
  background:linear-gradient(180deg,
    rgba(200,155,48,0.9) 0%, rgba(175,130,35,0.7) 60%, rgba(150,105,22,0.0) 100%);
  border-radius:0 0 5px 5px;
  transform-origin:top center;
  height:0; /* animated in */
}

/* ── CURTAINS ─────────────────────────────────── */
/* Left curtain */
#curtain-left {
  position:absolute; top:0; left:0;
  width:290px; height:100%;
  z-index:10;
  background:
    /* Fabric fold highlights */
    linear-gradient(90deg,
      transparent 0%,   rgba(255,255,255,0.05) 4%,   transparent 8%,
      transparent 18%,  rgba(255,255,255,0.07) 22%,  transparent 26%,
      transparent 38%,  rgba(255,255,255,0.04) 42%,  transparent 46%,
      transparent 56%,  rgba(255,255,255,0.08) 61%,  transparent 66%,
      transparent 76%,  rgba(255,255,255,0.05) 80%,  transparent 84%,
      transparent 92%,  rgba(255,255,255,0.10) 96%,  transparent 100%
    ),
    /* Base deep burgundy */
    linear-gradient(180deg, #3a0d18 0%, #2e0912 40%, #3a0d18 70%, #220810 100%);
  border-right:2px solid rgba(210,165,52,0.70);
  box-shadow:6px 0 30px rgba(0,0,0,0.85), inset -8px 0 18px rgba(0,0,0,0.50);
}
/* Curtain top curve (gathered fabric) */
#curtain-left::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:120px;
  background:linear-gradient(180deg, rgba(60,16,28,0.6) 0%, transparent 100%);
}

/* Right curtain */
#curtain-right {
  position:absolute; top:0; right:0;
  width:290px; height:100%;
  z-index:10;
  background:
    linear-gradient(90deg,
      transparent 0%,   rgba(255,255,255,0.10) 4%,  transparent 8%,
      transparent 16%,  rgba(255,255,255,0.05) 20%,  transparent 24%,
      transparent 36%,  rgba(255,255,255,0.08) 41%,  transparent 46%,
      transparent 54%,  rgba(255,255,255,0.04) 58%,  transparent 62%,
      transparent 74%,  rgba(255,255,255,0.07) 78%,  transparent 82%,
      transparent 92%,  rgba(255,255,255,0.05) 96%,  transparent 100%
    ),
    linear-gradient(180deg, #3a0d18 0%, #2e0912 40%, #3a0d18 70%, #220810 100%);
  border-left:2px solid rgba(210,165,52,0.70);
  box-shadow:-6px 0 30px rgba(0,0,0,0.85), inset 8px 0 18px rgba(0,0,0,0.50);
}
#curtain-right::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:120px;
  background:linear-gradient(180deg, rgba(60,16,28,0.6) 0%, transparent 100%);
}

/* Bottom of stage — small border */
#stage-floor {
  position:absolute; bottom:0; left:0; right:0;
  height:3px; z-index:12;
  background:linear-gradient(90deg,
    transparent 0%, rgba(200,155,48,0.45) 20%,
    rgba(220,175,65,0.70) 50%, rgba(200,155,48,0.45) 80%, transparent 100%);
}
</style>
</head>
<body>
<div id="stage">

  <!-- Logo + ring behind curtains -->
  <div id="logo-wrap">
    <img id="logo-img" src="bukhara-logo.png" alt="Bukhara">
  </div>
  <div id="ring-wrap">
    <svg viewBox="0 0 660 660" fill="none">
      <circle id="r-outer" cx="330" cy="330" r="308"
        stroke="rgba(195,152,48,0.30)" stroke-width="1"
        stroke-dasharray="1935" stroke-dashoffset="1935" fill="none"/>
      <circle id="r-inner" cx="330" cy="330" r="286"
        stroke="rgba(195,152,48,0.14)" stroke-width="0.5"
        stroke-dasharray="1797" stroke-dashoffset="1797" fill="none"/>
      <g id="ring-dots" opacity="0">
        <circle cx="330" cy="18"  r="3" fill="rgba(210,168,58,0.72)"/>
        <circle cx="330" cy="642" r="3" fill="rgba(210,168,58,0.72)"/>
        <circle cx="18"  cy="330" r="3" fill="rgba(210,168,58,0.72)"/>
        <circle cx="642" cy="330" r="3" fill="rgba(210,168,58,0.72)"/>
        <circle cx="108" cy="108" r="2" fill="rgba(210,168,58,0.42)"/>
        <circle cx="552" cy="108" r="2" fill="rgba(210,168,58,0.42)"/>
        <circle cx="108" cy="552" r="2" fill="rgba(210,168,58,0.42)"/>
        <circle cx="552" cy="552" r="2" fill="rgba(210,168,58,0.42)"/>
      </g>
    </svg>
  </div>

  <!-- UI text (below curtains in z-order, revealed after open) -->
  <div id="shimmer"></div>
  <div id="line-top">BUKHARA INDIAN RESTORAN</div>
  <div class="divider" id="div-top">
    <div class="dline" id="dtl"></div>
    <div class="ddot"></div><div class="ddot" style="opacity:.45"></div><div class="ddot"></div>
    <div class="dline" id="dtr"></div>
  </div>
  <div class="divider" id="div-bot">
    <div class="dline" id="dbl"></div>
    <div class="ddot"></div><div class="ddot" style="opacity:.45"></div><div class="ddot"></div>
    <div class="dline" id="dbr"></div>
  </div>
  <div id="tagline-block">
    <div id="tagline-label">A PROMISE OF FLAVOUR</div>
    <div id="typed-line"></div>
  </div>
  <div id="badge">
    <div class="bdot"></div>
    <span>Est. 2010 &nbsp;·&nbsp; Baku, Azerbaijan</span>
    <div class="bdot"></div>
  </div>

  <!-- Tie-back ornaments -->
  <div class="tieback" id="tieback-left"></div>
  <div class="tieback" id="tieback-right"></div>

  <!-- Valance + tassels (always on top) -->
  <div id="valance"></div>
  <div id="tassels"></div>

  <!-- Curtains -->
  <div id="curtain-left"></div>
  <div id="curtain-right"></div>

  <!-- Floor strip -->
  <div id="stage-floor"></div>
</div>

<script src="../libs/gsap.min.js"></script>
<script src="../libs/splitting.min.js"></script>
<script src="../libs/anime.min.js"></script>
<script src="../libs/typed.min.js"></script>
<script>

// ── Build tassels ─────────────────────────────────────────────────────────────
const tasselWrap = document.getElementById('tassels');
const TASSEL_COUNT = 28;
for (let i = 0; i < TASSEL_COUNT; i++) {
  const t = document.createElement('div');
  t.className = 'tassel';
  // Vary heights slightly for organic look
  t.dataset.h = 30 + Math.floor(Math.random() * 22);
  tasselWrap.appendChild(t);
}
const tassels = document.querySelectorAll('.tassel');

// ── Splitting ─────────────────────────────────────────────────────────────────
Splitting({ target:'#line-top', by:'chars' });

// ── Typed instance (created once, reused) ────────────────────────────────────
let typedInstance = null;

// ── GSAP Timeline ─────────────────────────────────────────────────────────────
const tl = gsap.timeline({ repeat:-1 });

// 0s — Stage is dark, curtains closed, logo already behind them
// Ensure curtains start in closed position
gsap.set('#curtain-left',  { x:0 });
gsap.set('#curtain-right', { x:0 });

// 0.3s — Tassels drop down from valance
tl.call(()=>{
  tassels.forEach((t)=>{
    const h = parseInt(t.dataset.h);
    anime({
      targets: t,
      height: [0, h],
      duration: 400 + Math.random()*300,
      delay: Math.random()*250,
      easing:'easeOutBounce'
    });
  });
}, [], 0.3);

// 0.8s — CURTAINS OPEN — the key moment
tl.to('#curtain-left',  {
  x:-295, duration:1.9, ease:'power2.inOut'
}, 0.8);
tl.to('#curtain-right', {
  x:295, duration:1.9, ease:'power2.inOut'
}, 0.8);

// 1.6s — Tie-backs slide in from sides as curtains gather
tl.to('#tieback-left', {
  left:'6px', opacity:1, duration:0.5, ease:'back.out(1.6)'
}, 1.6);
tl.to('#tieback-right', {
  right:'6px', opacity:1, duration:0.5, ease:'back.out(1.6)'
}, 1.6);

// 2.7s — Shimmer across the revealed logo
tl.set('#shimmer', { opacity:1, left:'-70%' }, 2.7);
tl.to('#shimmer', { left:'130%', duration:0.85, ease:'power2.inOut' }, 2.7);
tl.set('#shimmer', { opacity:0 }, 3.6);

// 2.8s — Ring draws in
tl.call(()=>{
  document.getElementById('ring-wrap').style.opacity = '1';
  anime({ targets:'#r-outer',
    strokeDashoffset:[1935,0], duration:1700, easing:'easeInOutSine' });
  anime({ targets:'#r-inner',
    strokeDashoffset:[1797,0], duration:1900, delay:180, easing:'easeInOutSine' });
  anime({ targets:'#ring-dots',
    opacity:[0,1], duration:500, delay:1400 });
}, [], 2.8);

// 3.4s — Top text chars appear from center outward
tl.set('#line-top', { opacity:1 }, 3.4);
tl.from('#line-top .char', {
  opacity:0, y:8, duration:0.40,
  stagger:{ each:0.038, from:'center' },
  ease:'power2.out'
}, 3.4);

// 4.0s — Dividers draw outward
tl.call(()=>{
  document.getElementById('div-top').style.opacity = '1';
  document.getElementById('div-bot').style.opacity = '1';
  anime({ targets:['#dtl','#dtr','#dbl','#dbr'],
    width:[0,125], duration:650, easing:'easeOutCubic',
    delay:anime.stagger(55) });
}, [], 4.0);

// 4.6s — Tagline block
tl.to('#tagline-block', { opacity:1, duration:0.6, ease:'power1.out' }, 4.6);
tl.call(()=>{
  if (typedInstance) { typedInstance.destroy(); }
  document.getElementById('typed-line').textContent = '';
  typedInstance = new Typed('#typed-line', {
    strings:[
      'Where Every Dish Tells a Story',
      'A Journey Through Mughal Flavours',
      'Authentic Tastes, Timeless Traditions',
      'Crafted with Spice &amp; Passion'
    ],
    typeSpeed:40, backSpeed:20, backDelay:2200,
    loop:true, showCursor:true, cursorChar:'|'
  });
}, [], 4.6);

// 5.0s — Logo scale breathe
tl.call(()=>{
  gsap.to('#logo-wrap', {
    scale:1.013, duration:3.8,
    ease:'sine.inOut', yoyo:true, repeat:-1
  });
}, [], 5.0);

// 5.4s — Badge
tl.from('#badge', { y:12, opacity:0, duration:0.6, ease:'power2.out' }, 5.4);
tl.set('#badge',  { opacity:1 }, 5.4);

// 5.8s — Tassels gentle sway
tl.call(()=>{
  tassels.forEach((t,i)=>{
    gsap.to(t, {
      rotation: (i%2===0 ? 4 : -4),
      duration:1.8 + Math.random()*0.8,
      ease:'sine.inOut', yoyo:true, repeat:-1,
      delay:Math.random()*0.5
    });
  });
}, [], 5.8);

// 8.0s — Second shimmer
tl.set('#shimmer', { opacity:1, left:'-70%' }, 8.0);
tl.to('#shimmer', { left:'130%', duration:0.85, ease:'power2.inOut' }, 8.0);
tl.set('#shimmer', { opacity:0 }, 8.9);

// 10.5s — Fade out UI (reverse order)
tl.to('#badge',            { opacity:0, duration:0.4 }, 10.5);
tl.to('#tagline-block',    { opacity:0, duration:0.4 }, 10.7);
tl.to(['#div-top','#div-bot'], { opacity:0, duration:0.4 }, 10.9);
tl.to('#line-top',         { opacity:0, duration:0.4 }, 11.0);
tl.to('#ring-wrap',        { opacity:0, duration:0.5 }, 11.1);

// 11.3s — CURTAINS CLOSE
tl.to('#curtain-left',  { x:0, duration:1.6, ease:'power2.inOut' }, 11.3);
tl.to('#curtain-right', { x:0, duration:1.6, ease:'power2.inOut' }, 11.3);

// 11.3s — Tie-backs slide out as curtains close
tl.to('#tieback-left',  { left:'-50px', opacity:0, duration:0.5 }, 11.3);
tl.to('#tieback-right', { right:'-50px', opacity:0, duration:0.5 }, 11.3);

// 12.6s — Tassels retract + full reset
tl.call(()=>{
  // Retract tassels
  tassels.forEach(t=>{
    gsap.killTweensOf(t);
    gsap.set(t, { rotation:0 });
    anime({ targets:t, height:0, duration:250, easing:'easeInCubic' });
  });
  // Kill breathe
  gsap.killTweensOf('#logo-wrap');
  gsap.set('#logo-wrap', { scale:1 });
  // Kill typed
  if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
  // Reset UI
  document.getElementById('ring-wrap').style.opacity = '0';
  document.getElementById('div-top').style.opacity   = '0';
  document.getElementById('div-bot').style.opacity   = '0';
  document.getElementById('line-top').style.opacity  = '0';
  document.getElementById('tagline-block').style.opacity = '0';
  document.getElementById('badge').style.opacity     = '0';
  // Reset SVG ring strokes
  document.getElementById('r-outer').setAttribute('stroke-dashoffset','1935');
  document.getElementById('r-inner').setAttribute('stroke-dashoffset','1797');
  document.getElementById('ring-dots').style.opacity = '0';
}, [], 12.6);

tl.to({}, { duration:0.6 }, 12.6); // total ~13.2s
</script>
</body>
</html>
