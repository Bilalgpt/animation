<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sheedi's Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#06040a;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  #stage {
    width:1080px; height:1080px;
    position:relative;
    background:#06040a;
    overflow:hidden;
    transform-origin:center center;
    flex:0 0 auto;
  }

  /* ===== CANVASES ===== */
  #bgCanvas, #particleCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
  }
  #bgCanvas       { z-index:0; }
  #particleCanvas { z-index:3; }
  /* Spotlight canvas — sits on top, masks everything, fades away after reveal */
  #spotCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    z-index:10; pointer-events:none;
  }

  /* ===== ORNAMENT RING ===== */
  #ornament-ring {
    position:absolute;
    width:800px; height:800px;
    top:43.7%; left:50%;
    transform:translate(-50%,-50%) rotate(0deg);
    z-index:2;
    opacity:0;
  }

  /* ===== LOGO IMAGE =====
     Electric teal-blue via CSS filter — stays this color permanently.
     Static teal drop-shadow glow. */
  #logo-img {
    position:absolute;
    width:740px;
    top:43.7%; left:50%;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    z-index:4;
    opacity:1;
    filter:
      sepia(1)
      saturate(6)
      hue-rotate(185deg)
      brightness(1.12)
      drop-shadow(0 0 20px rgba(0,220,215,0.70))
      drop-shadow(0 0 48px rgba(0,185,200,0.35));
  }

  /* ===== SHIMMER ===== */
  #shimmer {
    position:absolute;
    width:760px; height:600px;
    top:43.7%; left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    pointer-events:none;
    opacity:0;
    background:linear-gradient(110deg,
      transparent 28%,
      rgba(0,220,215,0.18) 46%,
      rgba(120,255,250,0.42) 50%,
      rgba(0,220,215,0.18) 54%,
      transparent 72%);
    background-size:300% 100%;
    background-position:150% 0;
    mix-blend-mode:screen;
  }

  /* ===== TOP TEXT ===== */
  #line-top {
    position:absolute;
    top:12px; left:0; right:0;
    text-align:center;
    font-family:'Cinzel', serif;
    font-size:21px;
    font-weight:400;
    color:rgba(100,230,225,0.9);
    letter-spacing:0.38em;
    text-indent:0.38em;
    z-index:6;
    opacity:0;
  }
  /* Splitting.js word spans */
  #line-top .word { display:inline-block; overflow:hidden; }

  /* ===== DIVIDERS ===== */
  .divider-svg {
    position:absolute;
    left:50%; transform:translateX(-50%);
    z-index:6; opacity:0;
  }
  #div-top { top:46px; }
  #div-bot { top:886px; }

  /* ===== TAGLINE BLOCK ===== */
  #tagline-block {
    position:absolute;
    top:916px; left:0; right:0;
    text-align:center;
    z-index:6; opacity:0;
  }
  #tagline-label {
    font-family:'Cinzel', serif;
    font-size:13px; font-weight:400;
    color:rgba(0,185,185,0.7);
    letter-spacing:0.5em; text-indent:0.5em;
    text-transform:uppercase; margin-bottom:16px;
  }
  #tagline-label .word { display:inline-block; margin:0 4px; opacity:0; }

  #tagline-typed-wrap {
    min-height:52px; width:960px;
    margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  #typed-tagline {
    font-family:'Cormorant Garamond', serif;
    font-size:32px; font-style:italic; font-weight:300;
    color:rgba(120,240,235,0.92);
    letter-spacing:0.10em; white-space:nowrap;
    text-shadow:0 0 28px rgba(0,200,210,0.32), 0 0 55px rgba(0,175,190,0.16);
  }
  .typed-cursor {
    font-family:'Cormorant Garamond', serif;
    font-size:32px;
    color:rgba(0,220,215,0.9);
    text-shadow:0 0 10px rgba(0,220,215,0.8);
    animation:cursorBlink 0.8s ease-in-out infinite;
    margin-left:1px;
  }
  @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ===== BOTTOM BADGE ===== */
  #bottom-badge {
    position:absolute;
    top:1017px;
    left:50%; transform:translateX(-50%);
    z-index:6;
    display:flex; align-items:center; gap:18px;
    opacity:0; white-space:nowrap;
  }
  .badge-dot { width:5px; height:5px; border-radius:50%; background:#00c4be; flex-shrink:0; }
  #bottom-badge span {
    font-family:'Cinzel', serif;
    font-size:17px; font-weight:400;
    color:rgba(0,195,195,0.82);
    letter-spacing:0.42em; text-indent:0.42em;
    text-transform:uppercase;
  }

  .char { display:inline-block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <!-- Ornament ring -->
  <svg id="ornament-ring" viewBox="0 0 640 640" fill="none">
    <circle cx="320" cy="320" r="308" stroke="rgba(0,190,200,0.30)" stroke-width="1" stroke-dasharray="4 9"/>
    <circle cx="320" cy="320" r="288" stroke="rgba(0,170,185,0.15)" stroke-width="0.7"/>
    <g stroke="rgba(0,200,210,0.65)" stroke-width="1.5">
      <line x1="320" y1="8"  x2="320" y2="30"/> <line x1="308" y1="12" x2="320" y2="8"/> <line x1="332" y1="12" x2="320" y2="8"/>
      <line x1="527" y1="113" x2="512" y2="128"/>
      <line x1="632" y1="320" x2="610" y2="320"/> <line x1="628" y1="308" x2="632" y2="320"/> <line x1="628" y1="332" x2="632" y2="320"/>
      <line x1="527" y1="527" x2="512" y2="512"/>
      <line x1="320" y1="632" x2="320" y2="610"/> <line x1="308" y1="628" x2="320" y2="632"/> <line x1="332" y1="628" x2="320" y2="632"/>
      <line x1="113" y1="527" x2="128" y2="512"/>
      <line x1="8"   y1="320" x2="30"  y2="320"/> <line x1="12" y1="308" x2="8" y2="320"/> <line x1="12" y1="332" x2="8" y2="320"/>
      <line x1="113" y1="113" x2="128" y2="128"/>
    </g>
    <g fill="rgba(0,200,210,0.65)">
      <polygon points="320,2 325,10 320,18 315,10"/>
      <polygon points="638,320 630,325 622,320 630,315"/>
      <polygon points="320,638 325,630 320,622 315,630"/>
      <polygon points="2,320 10,325 18,320 10,315"/>
      <polygon points="533,107 537,113 533,119 529,113"/>
      <polygon points="533,521 537,527 533,533 529,527"/>
      <polygon points="107,533 113,537 119,533 113,529"/>
      <polygon points="107,107 113,111 119,107 113,103"/>
    </g>
    <circle class="ring-stroke" cx="320" cy="320" r="298"
      stroke="rgba(0,200,210,0.50)" stroke-width="1.5"
      stroke-dasharray="1880" stroke-dashoffset="1880"/>
  </svg>

  <!-- Logo — electric teal-blue permanently -->
  <img id="logo-img" src="shedi_trans.png" alt="The Sheedi's Restaurant">

  <!-- Shimmer teal flash -->
  <div id="shimmer"></div>

  <!-- Top text -->
  <div id="line-top">FINE DINING &nbsp;&bull;&nbsp; AUTHENTIC CUISINE</div>

  <!-- Dividers -->
  <svg class="divider-svg" id="div-top" width="440" height="10" viewBox="0 0 440 10">
    <line class="dline" x1="0"   y1="5" x2="195" y2="5" stroke="rgba(0,185,195,0.58)" stroke-width="1" stroke-dasharray="200" stroke-dashoffset="200"/>
    <polygon points="220,1 225,5 220,9 215,5" fill="rgba(0,200,210,0.85)"/>
    <line class="dline" x1="245" y1="5" x2="440" y2="5" stroke="rgba(0,185,195,0.58)" stroke-width="1" stroke-dasharray="200" stroke-dashoffset="200"/>
  </svg>
  <svg class="divider-svg" id="div-bot" width="440" height="10" viewBox="0 0 440 10">
    <line class="dline" x1="0"   y1="5" x2="195" y2="5" stroke="rgba(0,185,195,0.58)" stroke-width="1" stroke-dasharray="200" stroke-dashoffset="200"/>
    <polygon points="220,1 225,5 220,9 215,5" fill="rgba(0,200,210,0.85)"/>
    <line class="dline" x1="245" y1="5" x2="440" y2="5" stroke="rgba(0,185,195,0.58)" stroke-width="1" stroke-dasharray="200" stroke-dashoffset="200"/>
  </svg>

  <!-- Tagline -->
  <div id="tagline-block">
    <div id="tagline-label">
      <span class="word">our</span>
      <span class="word">promise</span>
      <span class="word">to</span>
      <span class="word">you</span>
    </div>
    <div id="tagline-typed-wrap">
      <span id="typed-tagline"></span>
    </div>
  </div>

  <!-- Badge -->
  <div id="bottom-badge">
    <div class="badge-dot"></div>
    <span>Est. 2010</span>
    <div class="badge-dot"></div>
  </div>

  <!-- Spotlight overlay canvas — starts fully opaque (black), reveals via expanding circle -->
  <canvas id="spotCanvas"></canvas>
</div>

<script src="../libs/gsap.min.js"></script>
<script src="../libs/splitting.min.js"></script>
<script src="../libs/anime.min.js"></script>
<script src="../libs/typed.min.js"></script>

<script>
// ============================================================
// RESPONSIVE SCALE
// ============================================================
(function () {
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.min(window.innerWidth, window.innerHeight) / 1080;
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();

// ============================================================
// BACKGROUND CANVAS — deep teal-black
// ============================================================
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
bgCanvas.width = 1080; bgCanvas.height = 1080;
(function drawBg() {
  const grad = bgCtx.createRadialGradient(540, 472, 0, 540, 472, 720);
  grad.addColorStop(0,   'rgba(4, 12, 18, 1)');   // deep teal-black centre
  grad.addColorStop(0.5, 'rgba(2,  7, 12, 1)');
  grad.addColorStop(1,   'rgba(1,  3,  6, 1)');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, 1080, 1080);
  // Subtle teal noise
  for (let i = 0; i < 5000; i++) {
    const v = Math.random() * 0.022;
    bgCtx.fillStyle = `rgba(0,140,160,${v})`;
    bgCtx.fillRect(Math.random() * 1080, Math.random() * 1080, 1, 1);
  }
})();

// ============================================================
// PARTICLES — teal embers (stay teal throughout)
// ============================================================
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
pCanvas.width = 1080; pCanvas.height = 1080;
const particles = [];
let particlesActive = false;
function spawnParticle() {
  const angle = Math.random() * Math.PI * 2;
  const r = 60 + Math.random() * 280;
  particles.push({
    x: 540 + Math.cos(angle) * r * 0.5,
    y: 472 + Math.sin(angle) * r * 0.38,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -(0.25 + Math.random() * 0.7),
    alpha: 0,
    maxAlpha: 0.18 + Math.random() * 0.28,
    size: 0.9 + Math.random() * 2.0,
    life: 0,
    maxLife: 140 + Math.random() * 120,
    hue: 170 + Math.random() * 20   // stays in teal-cyan range 170–190°
  });
}
(function animParticles() {
  pCtx.clearRect(0, 0, 1080, 1080);
  if (particlesActive && Math.random() < 0.25) spawnParticle();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life++; p.x += p.vx; p.y += p.vy;
    p.vx += (Math.random() - 0.5) * 0.03;
    const t = p.life / p.maxLife;
    p.alpha = t < 0.2 ? (t/0.2)*p.maxAlpha : t > 0.7 ? ((1-t)/0.3)*p.maxAlpha : p.maxAlpha;
    pCtx.save();
    pCtx.globalAlpha = Math.max(0, p.alpha);
    pCtx.fillStyle = `hsl(${p.hue},80%,65%)`;
    pCtx.shadowColor = `hsl(${p.hue},80%,65%)`;
    pCtx.shadowBlur = 3;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
    pCtx.fill();
    pCtx.restore();
    if (p.life >= p.maxLife) particles.splice(i, 1);
  }
  requestAnimationFrame(animParticles);
})();

// ============================================================
// SPOTLIGHT CANVAS — starts black, expands circular reveal
// Uses canvas compositing: black layer with expanding hole
// ============================================================
const spotCanvas = document.getElementById('spotCanvas');
const spotCtx = spotCanvas.getContext('2d');
spotCanvas.width = 1080; spotCanvas.height = 1080;
const SPOT_CX = 540, SPOT_CY = 472;

const spotState = { r: 0, opacity: 1 };

function renderSpotlight() {
  spotCtx.clearRect(0, 0, 1080, 1080);
  if (spotState.opacity <= 0) return;
  spotCtx.globalAlpha = spotState.opacity;

  // Fill entire canvas black
  spotCtx.fillStyle = '#06040a';
  spotCtx.fillRect(0, 0, 1080, 1080);

  if (spotState.r > 0) {
    // Cut a soft-edged circle hole revealing logo beneath
    spotCtx.globalCompositeOperation = 'destination-out';
    const gr = spotCtx.createRadialGradient(
      SPOT_CX, SPOT_CY, spotState.r * 0.55,
      SPOT_CX, SPOT_CY, spotState.r
    );
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    spotCtx.fillStyle = gr;
    spotCtx.beginPath();
    spotCtx.arc(SPOT_CX, SPOT_CY, spotState.r, 0, Math.PI * 2);
    spotCtx.fill();
    spotCtx.globalCompositeOperation = 'source-over';
  }

  spotCtx.globalAlpha = 1;
}
renderSpotlight(); // begin fully black

// ============================================================
// SPLITTING.JS — words for top text, chars for nothing else
// ============================================================
Splitting({ target: '#line-top', by: 'words' });

// ============================================================
// TYPED.JS
// ============================================================
const TAGLINES = [
  "Where Every Meal Tells a Story",
  "A Culinary Journey Awaits You",
  "Taste the Tradition, Feel the Love",
  "Crafted with Passion, Served with Grace"
];
let typedInstance = null;
function startTyped() {
  if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
  document.getElementById('typed-tagline').innerHTML = '';
  typedInstance = new Typed('#typed-tagline', {
    strings: TAGLINES,
    typeSpeed: 42, backSpeed: 22, backDelay: 2200,
    startDelay: 0, loop: true, showCursor: true, cursorChar: '|'
  });
}

// ============================================================
// ANIME.JS helpers
// ============================================================
function drawRingStroke() {
  anime({ targets: '.ring-stroke', strokeDashoffset: [1880, 0], easing: 'easeInOutQuad', duration: 1900, delay: 300 });
}
function drawDividers() {
  anime({ targets: '#div-top .dline, #div-bot .dline', strokeDashoffset: [200, 0], easing: 'easeOutCubic', duration: 650, delay: (el,i) => i * 100 });
}
function floatLabelWords() {
  anime({ targets: '#tagline-label .word', opacity: [0,1], translateY: [16,0], easing: 'easeOutCubic', duration: 450, delay: anime.stagger(100) });
}
function resetAnime() {
  anime.set('#div-top .dline, #div-bot .dline', { strokeDashoffset: 200 });
  anime.set('.ring-stroke', { strokeDashoffset: 1880 });
  anime.set('#tagline-label .word', { opacity: 0, translateY: 16 });
}

// ============================================================
// GSAP MASTER TIMELINE
// ============================================================
const TEAL_FILTER = 'sepia(1) saturate(6) hue-rotate(185deg) brightness(1.12) drop-shadow(0 0 20px rgba(0,220,215,0.70)) drop-shadow(0 0 48px rgba(0,185,200,0.35))';

function buildTimeline() {
  const tl = gsap.timeline({
    repeat: -1,
    repeatDelay: 1.6,
    onRepeat: () => {
      spotState.r = 0; spotState.opacity = 1;
      renderSpotlight();
      gsap.set('#logo-img', { filter: TEAL_FILTER, scale: 1 });
      resetAnime();
      document.getElementById('shimmer').style.backgroundPosition = '150% 0';
    }
  });

  // 0.0s — particles warm up
  tl.add(() => { particlesActive = true; }, 0.0);

  // ── 0.3s: SPOTLIGHT OPENS (canvas hole expands) ──
  // GSAP animates spotState.r from 0 → 820, renderSpotlight called on each tick
  tl.to(spotState, {
    r: 820,
    duration: 1.8,
    ease: 'power2.inOut',
    onUpdate: renderSpotlight
  }, 0.3);
  // Fade the spotlight canvas out after circle fully open
  tl.to(spotState, {
    opacity: 0,
    duration: 0.5,
    ease: 'power1.in',
    onUpdate: renderSpotlight
  }, 1.9);

  // ── 2.0s: shimmer flash #1 ──
  tl.set('#shimmer',  { backgroundPosition: '150% 0' }, 1.99);
  tl.to('#shimmer',   { opacity: 1, duration: 0.01 }, 2.0);
  tl.to('#shimmer',   { backgroundPosition: '-150% 0', duration: 0.9, ease: 'power2.inOut' }, 2.0);
  tl.to('#shimmer',   { opacity: 0, duration: 0.3 }, 2.8);

  // ── 2.2s: subtle logo scale breathe (no filter pulse) ──
  tl.to('#logo-img', {
    scale: 1.014, duration: 4.0, ease: 'sine.inOut', yoyo: true, repeat: -1,
    transformOrigin: '50% 50%'
  }, 2.2);

  // ── 2.6s: ornament ring draws in AFTER logo is revealed ──
  tl.to('#ornament-ring', { opacity: 1, duration: 0.7, ease: 'power2.out' }, 2.6);
  tl.to('#ornament-ring', { rotation: 360, duration: 22, ease: 'none', transformOrigin: '50% 50%', repeat: -1 }, 2.6);
  tl.add(drawRingStroke, 2.6);

  // ── 3.2s: TOP TEXT — words slide from ALTERNATING sides ──
  // Splitting.js splits into .word spans; GSAP uses function-based x value
  tl.to('#line-top', { opacity: 1, duration: 0.01 }, 3.2);
  tl.from('#line-top .word', {
    opacity: 0,
    x: (i) => i % 2 === 0 ? -55 : 55,
    y: -6,
    stagger: 0.13,
    duration: 0.55,
    ease: 'power2.out'
  }, 3.2);

  // ── 3.7s: dividers draw outward ──
  tl.to('#div-top', { opacity: 1, duration: 0.01 }, 3.7);
  tl.to('#div-bot', { opacity: 1, duration: 0.01 }, 3.8);
  tl.add(drawDividers, 3.7);

  // ── 4.1s: tagline label words float up ──
  tl.to('#tagline-block', { opacity: 1, duration: 0.01 }, 4.1);
  tl.add(floatLabelWords, 4.1);

  // ── 4.5s: typed tagline ──
  tl.add(startTyped, 4.5);

  // ── 5.4s: badge slides up ──
  tl.fromTo('#bottom-badge',
    { opacity: 0, y: 14 },
    { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' },
    5.4
  );

  // ── 7.0s: shimmer flash #2 ──
  tl.set('#shimmer',  { backgroundPosition: '150% 0' }, 6.99);
  tl.to('#shimmer',   { opacity: 1, duration: 0.01 }, 7.0);
  tl.to('#shimmer',   { backgroundPosition: '-150% 0', duration: 0.9, ease: 'power2.inOut' }, 7.0);
  tl.to('#shimmer',   { opacity: 0, duration: 0.3 }, 7.8);

  // ── 7.0–11.0s: hold ──

  // ── 11.0s: REVERSE FADE-OUT (logo fades last) ──
  tl.to(['#tagline-block','#bottom-badge'], { opacity: 0, duration: 0.5, ease: 'power2.in' }, 11.0);
  tl.to(['#div-top','#div-bot','#line-top'], { opacity: 0, duration: 0.5, ease: 'power2.in' }, 11.3);
  tl.to('#ornament-ring', { opacity: 0, duration: 0.6, ease: 'power2.in' }, 11.5);
  tl.to('#logo-img',      { opacity: 0, duration: 0.9, ease: 'power2.in' }, 11.7);

  // ── 12.6s: full reset ──
  tl.add(() => {
    particlesActive = false;
    particles.length = 0;
    if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
    document.getElementById('typed-tagline').innerHTML = '';
    gsap.set('#logo-img', { opacity: 1, scale: 1 });
    gsap.set(['#line-top','#div-top','#div-bot','#tagline-block','#bottom-badge'], { opacity: 0 });
    gsap.set('#ornament-ring', { opacity: 0 });
    gsap.set('#bottom-badge', { y: 0 });
  }, 12.6);

  tl.set({}, {}, 12.7);
  return tl;
}

window.__tl = buildTimeline();
</script>
</body>
</html>
