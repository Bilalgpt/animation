<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukhara Indian Restoran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#0a0705;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  #stage {
    width:1080px; height:1080px;
    position:relative;
    background:#0a0705;
    overflow:hidden;
    transform-origin:center center;
    flex:0 0 auto;
  }

  /* ===== CANVASES ===== */
  #bgCanvas, #particleCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
  }
  #bgCanvas       { z-index:0; }
  #particleCanvas { z-index:3; }
  #spotCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    z-index:10; pointer-events:none;
  }

  /* ===== ORNAMENT RING ===== */
  #ornament-ring {
    position:absolute;
    width:700px; height:700px;
    top:43.5%; left:50%;
    transform:translate(-50%,-50%) rotate(0deg);
    z-index:2;
    opacity:0;
  }

  /* ===== LOGO ===== */
  #logo-img {
    position:absolute;
    width:820px;
    top:43.5%; left:50%;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    z-index:4;
    opacity:1;
    filter:
      drop-shadow(0 0 18px rgba(255,195,55,0.70))
      drop-shadow(0 0 48px rgba(255,145,20,0.32));
  }

  /* ===== SHIMMER ===== */
  #shimmer {
    position:absolute;
    width:860px; height:520px;
    top:43.5%; left:50%;
    transform:translate(-50%,-50%);
    z-index:5; pointer-events:none; opacity:0;
    background:linear-gradient(110deg,
      transparent 28%,
      rgba(255,215,90,0.18) 46%,
      rgba(255,240,160,0.44) 50%,
      rgba(255,215,90,0.18) 54%,
      transparent 72%);
    background-size:300% 100%;
    background-position:150% 0;
    mix-blend-mode:screen;
  }

  /* ===== TOP TEXT ===== */
  #line-top {
    position:absolute;
    top:12px; left:0; right:0;
    text-align:center;
    font-family:'Cinzel', serif;
    font-size:18px; font-weight:400;
    color:rgba(212,175,60,0.88);
    letter-spacing:0.42em; text-indent:0.42em;
    z-index:6; opacity:0;
  }
  #line-top .word { display:inline-block; overflow:hidden; }

  /* ===== DIVIDERS ===== */
  .divider-svg {
    position:absolute;
    left:50%; transform:translateX(-50%);
    z-index:6; opacity:0;
  }
  #div-top { top:46px; }
  #div-bot { top:724px; }

  /* ===== TAGLINE BLOCK ===== */
  #tagline-block {
    position:absolute;
    top:754px; left:0; right:0;
    text-align:center;
    z-index:6; opacity:0;
  }
  #tagline-label {
    font-family:'Cinzel', serif;
    font-size:12px; font-weight:400;
    color:rgba(185,148,52,0.72);
    letter-spacing:0.5em; text-indent:0.5em;
    text-transform:uppercase; margin-bottom:14px;
  }
  #tagline-label .word { display:inline-block; margin:0 4px; opacity:0; }

  #tagline-typed-wrap {
    min-height:48px; width:960px;
    margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  #typed-tagline {
    font-family:'Cormorant Garamond', serif;
    font-size:30px; font-style:italic; font-weight:300;
    color:rgba(232,198,105,0.92);
    letter-spacing:0.10em; white-space:nowrap;
    text-shadow:0 0 28px rgba(212,160,40,0.35), 0 0 55px rgba(200,125,15,0.18);
  }
  .typed-cursor {
    font-family:'Cormorant Garamond', serif;
    font-size:30px;
    color:rgba(218,178,55,0.92);
    text-shadow:0 0 10px rgba(218,178,55,0.80);
    animation:cursorBlink 0.8s ease-in-out infinite;
    margin-left:1px;
  }
  @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ===== BOTTOM BADGE ===== */
  #bottom-badge {
    position:absolute;
    top:870px;
    left:50%; transform:translateX(-50%);
    z-index:6;
    display:flex; align-items:center; gap:18px;
    opacity:0; white-space:nowrap;
  }
  .badge-dot { width:5px; height:5px; border-radius:50%; background:#d4a830; flex-shrink:0; }
  #bottom-badge span {
    font-family:'Cinzel', serif;
    font-size:15px; font-weight:400;
    color:rgba(205,163,68,0.84);
    letter-spacing:0.45em; text-indent:0.45em;
    text-transform:uppercase;
  }

  .char { display:inline-block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <!-- Ornament ring — gold -->
  <svg id="ornament-ring" viewBox="0 0 640 640" fill="none">
    <circle cx="320" cy="320" r="308" stroke="rgba(212,165,40,0.28)" stroke-width="1" stroke-dasharray="4 9"/>
    <circle cx="320" cy="320" r="288" stroke="rgba(212,165,40,0.13)" stroke-width="0.7"/>
    <g stroke="rgba(218,178,52,0.68)" stroke-width="1.5">
      <line x1="320" y1="8"  x2="320" y2="30"/> <line x1="308" y1="12" x2="320" y2="8"/> <line x1="332" y1="12" x2="320" y2="8"/>
      <line x1="527" y1="113" x2="512" y2="128"/>
      <line x1="632" y1="320" x2="610" y2="320"/> <line x1="628" y1="308" x2="632" y2="320"/> <line x1="628" y1="332" x2="632" y2="320"/>
      <line x1="527" y1="527" x2="512" y2="512"/>
      <line x1="320" y1="632" x2="320" y2="610"/> <line x1="308" y1="628" x2="320" y2="632"/> <line x1="332" y1="628" x2="320" y2="632"/>
      <line x1="113" y1="527" x2="128" y2="512"/>
      <line x1="8"   y1="320" x2="30"  y2="320"/> <line x1="12" y1="308" x2="8" y2="320"/> <line x1="12" y1="332" x2="8" y2="320"/>
      <line x1="113" y1="113" x2="128" y2="128"/>
    </g>
    <g fill="rgba(218,178,52,0.68)">
      <polygon points="320,2 325,10 320,18 315,10"/>
      <polygon points="638,320 630,325 622,320 630,315"/>
      <polygon points="320,638 325,630 320,622 315,630"/>
      <polygon points="2,320 10,325 18,320 10,315"/>
      <polygon points="533,107 537,113 533,119 529,113"/>
      <polygon points="533,521 537,527 533,533 529,527"/>
      <polygon points="107,533 113,537 119,533 113,529"/>
      <polygon points="107,107 113,111 119,107 113,103"/>
    </g>
    <circle class="ring-stroke" cx="320" cy="320" r="298"
      stroke="rgba(218,178,52,0.54)" stroke-width="1.5"
      stroke-dasharray="1880" stroke-dashoffset="1880"/>
  </svg>

  <!-- Logo -->
  <img id="logo-img" src="bukhara-logo.png" alt="Bukhara Indian Restoran">

  <!-- Shimmer -->
  <div id="shimmer"></div>

  <!-- Top text -->
  <div id="line-top">FINE DINING &nbsp;&bull;&nbsp; AUTHENTIC CUISINE</div>

  <!-- Dividers -->
  <svg class="divider-svg" id="div-top" width="500" height="10" viewBox="0 0 500 10">
    <line class="dline" x1="0"   y1="5" x2="223" y2="5" stroke="rgba(200,155,40,0.55)" stroke-width="1" stroke-dasharray="228" stroke-dashoffset="228"/>
    <polygon points="250,1 255,5 250,9 245,5" fill="rgba(218,178,52,0.90)"/>
    <line class="dline" x1="277" y1="5" x2="500" y2="5" stroke="rgba(200,155,40,0.55)" stroke-width="1" stroke-dasharray="228" stroke-dashoffset="228"/>
  </svg>
  <svg class="divider-svg" id="div-bot" width="500" height="10" viewBox="0 0 500 10">
    <line class="dline" x1="0"   y1="5" x2="223" y2="5" stroke="rgba(200,155,40,0.55)" stroke-width="1" stroke-dasharray="228" stroke-dashoffset="228"/>
    <polygon points="250,1 255,5 250,9 245,5" fill="rgba(218,178,52,0.90)"/>
    <line class="dline" x1="277" y1="5" x2="500" y2="5" stroke="rgba(200,155,40,0.55)" stroke-width="1" stroke-dasharray="228" stroke-dashoffset="228"/>
  </svg>

  <!-- Tagline -->
  <div id="tagline-block">
    <div id="tagline-label">
      <span class="word">our</span>
      <span class="word">promise</span>
      <span class="word">to</span>
      <span class="word">you</span>
    </div>
    <div id="tagline-typed-wrap">
      <span id="typed-tagline"></span>
    </div>
  </div>

  <!-- Badge -->
  <div id="bottom-badge">
    <div class="badge-dot"></div>
    <span>Baku &nbsp;&bull;&nbsp; Azerbaijan</span>
    <div class="badge-dot"></div>
  </div>

  <!-- Spotlight canvas -->
  <canvas id="spotCanvas"></canvas>
</div>

<script src="../libs/gsap.min.js"></script>
<script src="../libs/splitting.min.js"></script>
<script src="../libs/anime.min.js"></script>
<script src="../libs/typed.min.js"></script>

<script>
// ============================================================
// RESPONSIVE SCALE
// ============================================================
(function () {
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.min(window.innerWidth, window.innerHeight) / 1080;
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();

// ============================================================
// BACKGROUND — deep warm dark with radial gradient + saffron noise
// ============================================================
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx    = bgCanvas.getContext('2d');
bgCanvas.width = 1080; bgCanvas.height = 1080;
(function drawBg() {
  const grad = bgCtx.createRadialGradient(540, 470, 0, 540, 470, 740);
  grad.addColorStop(0,   'rgba(26, 16,  6, 1)');  // warm dark amber centre
  grad.addColorStop(0.45,'rgba(14,  9,  4, 1)');
  grad.addColorStop(1,   'rgba( 5,  3,  2, 1)');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, 1080, 1080);
  // Subtle saffron noise
  for (let i = 0; i < 6000; i++) {
    const v = Math.random() * 0.025;
    bgCtx.fillStyle = `rgba(180,110,20,${v})`;
    bgCtx.fillRect(Math.random()*1080, Math.random()*1080, 1, 1);
  }
})();

// ============================================================
// PARTICLES — saffron / amber embers
// ============================================================
const pCanvas = document.getElementById('particleCanvas');
const pCtx    = pCanvas.getContext('2d');
pCanvas.width = 1080; pCanvas.height = 1080;
const particles = [];
let particlesActive = false;

function spawnParticle() {
  const angle = Math.random() * Math.PI * 2;
  const r     = 70 + Math.random() * 320;
  particles.push({
    x: 540 + Math.cos(angle) * r * 0.65,
    y: 470 + Math.sin(angle) * r * 0.44,
    vx: (Math.random() - 0.5) * 0.55,
    vy: -(0.28 + Math.random() * 0.85),
    alpha:    0,
    maxAlpha: 0.16 + Math.random() * 0.28,
    size:     0.8 + Math.random() * 2.3,
    life: 0,
    maxLife: 130 + Math.random() * 130,
    hue: 28 + Math.random() * 24   // saffron-amber 28–52°
  });
}

(function animParticles() {
  pCtx.clearRect(0, 0, 1080, 1080);
  if (particlesActive && Math.random() < 0.28) spawnParticle();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life++; p.x += p.vx; p.y += p.vy;
    p.vx += (Math.random() - 0.5) * 0.03;
    const t  = p.life / p.maxLife;
    p.alpha  = t < 0.2 ? (t / 0.2) * p.maxAlpha
             : t > 0.7 ? ((1 - t) / 0.3) * p.maxAlpha
             : p.maxAlpha;
    pCtx.save();
    pCtx.globalAlpha  = Math.max(0, p.alpha);
    pCtx.fillStyle    = `hsl(${p.hue},90%,65%)`;
    pCtx.shadowColor  = `hsl(${p.hue},90%,65%)`;
    pCtx.shadowBlur   = 5;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
    pCtx.fill();
    pCtx.restore();
    if (p.life >= p.maxLife) particles.splice(i, 1);
  }
  requestAnimationFrame(animParticles);
})();

// ============================================================
// SPOTLIGHT CANVAS
// ============================================================
const spotCanvas = document.getElementById('spotCanvas');
const spotCtx    = spotCanvas.getContext('2d');
spotCanvas.width = 1080; spotCanvas.height = 1080;
const SPOT_CX = 540, SPOT_CY = 470;
const spotState = { r: 0, opacity: 1 };

function renderSpotlight() {
  spotCtx.clearRect(0, 0, 1080, 1080);
  if (spotState.opacity <= 0) return;
  spotCtx.globalAlpha = spotState.opacity;
  spotCtx.fillStyle   = '#0a0705';
  spotCtx.fillRect(0, 0, 1080, 1080);
  if (spotState.r > 0) {
    spotCtx.globalCompositeOperation = 'destination-out';
    const gr = spotCtx.createRadialGradient(
      SPOT_CX, SPOT_CY, spotState.r * 0.5,
      SPOT_CX, SPOT_CY, spotState.r
    );
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    spotCtx.fillStyle = gr;
    spotCtx.beginPath();
    spotCtx.arc(SPOT_CX, SPOT_CY, spotState.r, 0, Math.PI * 2);
    spotCtx.fill();
    spotCtx.globalCompositeOperation = 'source-over';
  }
  spotCtx.globalAlpha = 1;
}
renderSpotlight(); // start fully black

// ============================================================
// SPLITTING.JS
// ============================================================
Splitting({ target: '#line-top', by: 'words' });

// ============================================================
// TYPED.JS
// ============================================================
const TAGLINES = [
  "Where Every Dish Tells a Story",
  "A Journey Through Mughal Flavours",
  "Crafted with Saffron, Served with Love",
  "Authentic Indian Cuisine in the Heart of Baku"
];
let typedInstance = null;
function startTyped() {
  if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
  document.getElementById('typed-tagline').innerHTML = '';
  typedInstance = new Typed('#typed-tagline', {
    strings:    TAGLINES,
    typeSpeed:  42, backSpeed: 22, backDelay: 2400,
    startDelay: 0, loop: true, showCursor: true, cursorChar: '|'
  });
}

// ============================================================
// ANIME.JS helpers
// ============================================================
function drawRingStroke() {
  anime({ targets: '.ring-stroke', strokeDashoffset: [1880, 0], easing: 'easeInOutQuad', duration: 2200, delay: 300 });
}
function drawDividers() {
  anime({ targets: '#div-top .dline, #div-bot .dline', strokeDashoffset: [228, 0], easing: 'easeOutCubic', duration: 720, delay: (el, i) => i * 100 });
}
function floatLabelWords() {
  anime({ targets: '#tagline-label .word', opacity: [0, 1], translateY: [16, 0], easing: 'easeOutCubic', duration: 460, delay: anime.stagger(110) });
}
function resetAnime() {
  anime.set('#div-top .dline, #div-bot .dline', { strokeDashoffset: 228 });
  anime.set('.ring-stroke',                      { strokeDashoffset: 1880 });
  anime.set('#tagline-label .word',              { opacity: 0, translateY: 16 });
}

// ============================================================
// GSAP MASTER TIMELINE
// ============================================================
const LOGO_FILTER = 'drop-shadow(0 0 18px rgba(255,195,55,0.70)) drop-shadow(0 0 48px rgba(255,145,20,0.32))';

function buildTimeline() {
  const tl = gsap.timeline({
    repeat: -1,
    repeatDelay: 1.8,
    onRepeat: () => {
      spotState.r = 0; spotState.opacity = 1;
      renderSpotlight();
      gsap.set('#logo-img', { filter: LOGO_FILTER, scale: 1, opacity: 1 });
      resetAnime();
      document.getElementById('shimmer').style.backgroundPosition = '150% 0';
    }
  });

  // ── 0.0s: particles ignite ──
  tl.add(() => { particlesActive = true; }, 0.0);

  // ── 0.3s: spotlight expands ──
  tl.to(spotState, { r: 800, duration: 2.0, ease: 'power2.inOut', onUpdate: renderSpotlight }, 0.3);
  tl.to(spotState, { opacity: 0, duration: 0.55, ease: 'power1.in', onUpdate: renderSpotlight }, 2.0);

  // ── 2.2s: shimmer sweep #1 — golden flash across logo ──
  tl.set('#shimmer',  { backgroundPosition: '150% 0' }, 2.19);
  tl.to('#shimmer',   { opacity: 1, duration: 0.01 }, 2.2);
  tl.to('#shimmer',   { backgroundPosition: '-150% 0', duration: 1.05, ease: 'power2.inOut' }, 2.2);
  tl.to('#shimmer',   { opacity: 0, duration: 0.38 }, 3.1);

  // ── 2.4s: logo scale breathe ──
  tl.to('#logo-img', {
    scale: 1.012, duration: 4.2, ease: 'sine.inOut',
    yoyo: true, repeat: -1, transformOrigin: '50% 50%'
  }, 2.4);

  // ── 2.9s: ring fades in and draws ──
  tl.to('#ornament-ring', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 2.9);
  tl.to('#ornament-ring', { rotation: 360, duration: 26, ease: 'none', transformOrigin: '50% 50%', repeat: -1 }, 2.9);
  tl.add(drawRingStroke, 2.9);

  // ── 3.5s: top text — words slide from alternating sides ──
  tl.to('#line-top', { opacity: 1, duration: 0.01 }, 3.5);
  tl.from('#line-top .word', {
    opacity: 0, x: (i) => i % 2 === 0 ? -52 : 52, y: -6,
    stagger: 0.14, duration: 0.55, ease: 'power2.out'
  }, 3.5);

  // ── 4.0s: dividers draw outward ──
  tl.to('#div-top', { opacity: 1, duration: 0.01 }, 4.0);
  tl.to('#div-bot', { opacity: 1, duration: 0.01 }, 4.1);
  tl.add(drawDividers, 4.0);

  // ── 4.5s: tagline label floats up ──
  tl.to('#tagline-block', { opacity: 1, duration: 0.01 }, 4.5);
  tl.add(floatLabelWords, 4.5);

  // ── 4.9s: typed tagline starts ──
  tl.add(startTyped, 4.9);

  // ── 5.8s: bottom badge slides up ──
  tl.fromTo('#bottom-badge',
    { opacity: 0, y: 16 },
    { opacity: 1, y: 0, duration: 0.65, ease: 'power2.out' },
    5.8
  );

  // ── 7.5s: shimmer sweep #2 ──
  tl.set('#shimmer',  { backgroundPosition: '150% 0' }, 7.49);
  tl.to('#shimmer',   { opacity: 1, duration: 0.01 }, 7.5);
  tl.to('#shimmer',   { backgroundPosition: '-150% 0', duration: 1.05, ease: 'power2.inOut' }, 7.5);
  tl.to('#shimmer',   { opacity: 0, duration: 0.38 }, 8.4);

  // ── 11.3s: fade out sequence ──
  tl.to(['#tagline-block', '#bottom-badge'], { opacity: 0, duration: 0.55, ease: 'power2.in' }, 11.3);
  tl.to(['#div-top', '#div-bot', '#line-top'], { opacity: 0, duration: 0.55, ease: 'power2.in' }, 11.6);
  tl.to('#ornament-ring', { opacity: 0, duration: 0.65, ease: 'power2.in' }, 11.85);
  tl.to('#logo-img',      { opacity: 0, duration: 1.0,  ease: 'power2.in' }, 12.1);

  // ── 13.3s: full reset ──
  tl.add(() => {
    particlesActive = false;
    particles.length = 0;
    if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
    document.getElementById('typed-tagline').innerHTML = '';
    gsap.set('#logo-img', { opacity: 1, scale: 1 });
    gsap.set(['#line-top', '#div-top', '#div-bot', '#tagline-block', '#bottom-badge'], { opacity: 0 });
    gsap.set('#ornament-ring', { opacity: 0 });
    gsap.set('#bottom-badge', { y: 0 });
  }, 13.3);

  tl.set({}, {}, 13.4);
  return tl;
}

window.__tl = buildTimeline();
</script>
</body>
</html>
