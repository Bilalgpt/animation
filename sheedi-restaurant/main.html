<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Sheedi's Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e0003;
  --gold:#C9922A;
  --gold-l:#E8C55A;
  --glow:rgba(201,146,42,.55);
}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;
     width:100vw;height:100vh;overflow:hidden}

/* ── Stage ─────────────────────────────────────── */
.stage{
  position:relative;width:820px;height:820px;overflow:hidden;
  background:var(--bg);
}

/* ══════════════════════════════════════════════════
   BACKGROUND — 2 food photos (Pexels, free)
   1. Green & Red Chili Peppers  (#5966435)
   2. Fork, Knife & Spoon        (#175765)
══════════════════════════════════════════════════ */
.food-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;z-index:0;
}
.food-bg1{
  background-image:url('https://images.pexels.com/photos/5966435/pexels-photo-5966435.jpeg?auto=compress&cs=tinysrgb&w=1280');
  animation:foodBg1 13s .3s ease-in-out forwards;
}
.food-bg2{
  background-image:url('https://images.pexels.com/photos/175765/pexels-photo-175765.jpeg?auto=compress&cs=tinysrgb&w=1280');
  animation:foodBg2 13s .3s ease-in-out forwards;
}
@keyframes foodBg1{
  0%  {opacity:0;transform:scale(1.00)}
  5%  {opacity:.72}
  46% {opacity:.72;transform:scale(1.07)}
  59% {opacity:0}
  100%{opacity:0;transform:scale(1.10)}
}
@keyframes foodBg2{
  0%  {opacity:0;transform:scale(1.02)}
  46% {opacity:0}
  59% {opacity:.60}
  100%{opacity:.60;transform:scale(1.08)}
}

/* Dark crimson overlay — protects readability */
.food-overlay{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 64% 60% at 50% 48%,
      rgba(14,0,3,.12) 0%, rgba(14,0,3,.72) 100%),
    linear-gradient(180deg,
      rgba(14,0,3,.90) 0%,
      rgba(14,0,3,.10) 30%,
      rgba(14,0,3,.10) 70%,
      rgba(14,0,3,.92) 100%);
}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ══════════════════════════════════════════════════
   DECORATIVE RINGS — echo the mandala circle motif
   Three concentric rings rotate at different speeds
══════════════════════════════════════════════════ */
.logo-ring{
  position:absolute;border-radius:50%;
  left:50%;top:48%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:4;opacity:0;
}
.ring-a{
  width:456px;height:456px;
  border:1px solid rgba(201,146,42,.13);
  animation:ringFadeIn 1.6s 2.1s ease forwards,
            ringRotCW  32s  3.0s linear infinite;
}
.ring-b{
  width:386px;height:386px;
  border:1px solid rgba(201,146,42,.20);
  animation:ringFadeIn 1.6s 2.3s ease forwards,
            ringRotCCW 24s  3.0s linear infinite;
}
.ring-c{
  width:318px;height:318px;
  border:1px dashed rgba(201,146,42,.11);
  animation:ringFadeIn 1.6s 2.5s ease forwards,
            ringRotCW  18s  3.0s linear infinite;
}
@keyframes ringFadeIn{to{opacity:1}}
@keyframes ringRotCW {
  from{transform:translate(-50%,-50%) rotate(  0deg)}
  to  {transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes ringRotCCW{
  from{transform:translate(-50%,-50%) rotate(   0deg)}
  to  {transform:translate(-50%,-50%) rotate(-360deg)}
}

/* ── Flash overlay ─────────────────────────────── */
.flash{
  position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 66% 50% at 50% 40%,
    rgba(255,230,160,.90) 0%,rgba(201,146,42,.60) 35%,
    rgba(100,0,14,.38) 65%,transparent 85%);
}
@keyframes flashBurst{
  0%  {opacity:.88}
  15% {opacity:.50}
  45% {opacity:.12}
  100%{opacity:0}
}
.flash.pop{animation:flashBurst .55s ease-out forwards}

/* ── Logo image ────────────────────────────────── */
.logo-wrap{
  position:relative;width:400px;overflow:visible;
  z-index:5;margin-top:6px;
}
.logo-img{
  display:block;width:400px;
  opacity:0;
  transform:scale(.04) rotate(360deg);
  filter:blur(20px);
  border-radius:3px;
}
/* Mandala bloom: spins in from a tiny dot, blooms to full size */
.logo-img.animate{
  animation:mandalaSpin 1.8s cubic-bezier(.22,1,.36,1) forwards,
            logoPulse   6.5s 2.5s ease-in-out infinite;
}
@keyframes mandalaSpin{
  0%  {opacity:0;  transform:scale(.04) rotate(360deg);  filter:blur(20px)}
  26% {opacity:.55;filter:blur(6px)}
  65% {            transform:scale(1.09) rotate(-6deg);  opacity:1;filter:blur(0)}
  80% {            transform:scale(.94)  rotate( 2deg)}
  90% {            transform:scale(1.04) rotate(-0.5deg)}
  100%{opacity:1;  transform:scale(1)   rotate(0deg);    filter:blur(0)}
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 14px rgba(201,146,42,.22))}
  50%    {filter:drop-shadow(0 0 44px rgba(201,146,42,.72))
                 drop-shadow(0 0 88px rgba(139,0,20,.22))}
}
/* Shimmer sweep across logo */
.logo-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(108deg,
    transparent 16%,rgba(255,240,180,.24) 50%,transparent 84%);
  transform:translateX(-160%);
  animation:logoShimmer 1.1s ease-out forwards;
  animation-play-state:paused;
}
.logo-wrap.shimmer::after{animation-play-state:running}
@keyframes logoShimmer{to{transform:translateX(260%)}}

/* ── Content block ─────────────────────────────── */
.content{
  position:absolute;
  top:108px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  z-index:8;pointer-events:none;
}

/* Eyebrow */
.ey-row{
  display:flex;align-items:center;gap:14px;
  opacity:0;transition:opacity .5s ease;
}
.ey-row.show{opacity:1}
.ey-ln{height:1px;width:60px;
        background:linear-gradient(90deg,transparent,rgba(201,146,42,.50),transparent)}
.ey-tx{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:7px;
  color:rgba(201,146,42,.55);text-transform:uppercase;
}

/* Ornamental SVG divider */
.orn-div{
  margin:16px 0 6px;
  opacity:0;transition:opacity .6s;
}
.orn-div.show{opacity:1}
.orn-path{
  stroke:var(--gold);stroke-width:.9;fill:none;opacity:.55;
  stroke-dasharray:300;stroke-dashoffset:300;
}
.orn-div.show .orn-path{
  animation:drawOrn 1.3s ease-out forwards;
}
@keyframes drawOrn{to{stroke-dashoffset:0}}

/* Tagline */
.tagline{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;
  color:rgba(255,238,196,.78);letter-spacing:2px;text-align:center;
  filter:drop-shadow(0 0 14px rgba(201,146,42,.22));
  min-height:36px;
}

/* Sub */
.sub-line{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:6px;
  color:rgba(201,146,42,.42);text-transform:uppercase;
  margin-top:18px;
  opacity:0;transition:opacity .8s ease;
}
.sub-line.show{opacity:1}

/* Bottom ornament */
.bot-orn{
  display:flex;align-items:center;gap:8px;
  margin-top:14px;
  opacity:0;transition:opacity .6s .25s ease;
}
.bot-orn.show{opacity:1}
.bo-ln{width:52px;height:1px;
        background:linear-gradient(90deg,transparent,rgba(201,146,42,.40),transparent)}
.bo-gm{width:6px;height:6px;background:var(--gold);
        transform:rotate(45deg);box-shadow:0 0 8px var(--glow)}
.bo-sm{width:4px;height:4px;background:var(--gold-l);transform:rotate(45deg)}

/* Typewriter cursor */
.cur{
  display:inline-block;width:2px;height:.82em;
  background:var(--gold);margin-left:2px;vertical-align:middle;
  animation:blinkC .65s step-end infinite;
}
@keyframes blinkC{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="stage">

  <!-- Food backgrounds (2 only) -->
  <div class="food-bg food-bg1"></div>
  <div class="food-bg food-bg2"></div>
  <div class="food-overlay"></div>

  <!-- Gold ember particles -->
  <canvas id="cv"></canvas>

  <!-- Rotating rings (echo the mandala circle design) -->
  <div class="logo-ring ring-a"></div>
  <div class="logo-ring ring-b"></div>
  <div class="logo-ring ring-c"></div>

  <!-- Gold flash burst -->
  <div class="flash" id="fl"></div>

  <!-- Content -->
  <div class="content">

    <div class="ey-row" id="eyRow">
      <div class="ey-ln"></div>
      <div class="ey-tx" id="eyTx"></div>
      <div class="ey-ln"></div>
    </div>

    <!-- Logo: JPEG blooms in like a mandala unfolding -->
    <div class="logo-wrap" id="logoWrap">
      <img class="logo-img" id="logoImg"
           src="../SHEEDI RESTAURANT.jpeg"
           alt="The Sheedi's Restaurant">
    </div>

    <!-- Classical ornament divider -->
    <div class="orn-div" id="ornDiv">
      <svg width="300" height="18" viewBox="0 0 300 18">
        <path class="orn-path"
          d="M0,9 L40,9 Q55,9 65,3 Q80,0 95,3 Q105,9 150,9
             Q195,9 205,3 Q220,0 235,3 Q245,9 260,9 L300,9"/>
      </svg>
    </div>

    <div class="tagline" id="tgl"></div>

    <div class="sub-line" id="sub">Fine Dining &nbsp;·&nbsp; Authentic Flavours &nbsp;·&nbsp; Catering</div>

    <div class="bot-orn" id="bot">
      <div class="bo-ln"></div>
      <div class="bo-sm"></div>
      <div class="bo-gm"></div>
      <div class="bo-sm"></div>
      <div class="bo-ln"></div>
    </div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   PARTICLES — warm gold & crimson embers
   Matches the restaurant's gold/maroon palette
═══════════════════════════════════════════════════ */
const cv  = document.getElementById('cv');
cv.width  = cv.height = 820;
const ctx = cv.getContext('2d');
const PC  = ['#C9922A','#E8C55A','#E06020','#FFE0A0','#D4A843','#AA2020'];

class Ember {
  constructor(){ this.reset(true) }
  reset(init){
    this.x   = Math.random() * 820;
    this.y   = init ? Math.random() * 820 : 826;
    this.vx  = (Math.random() - .5) * .42;
    this.vy  = -(0.18 + Math.random() * .58);
    this.r   = .4 + Math.random() * 1.8;
    this.c   = PC[Math.floor(Math.random() * PC.length)];
    this.a   = 0;  this.l = 0;
    this.ml  = 160 + Math.random() * 300;
    this.w   = Math.random() * Math.PI * 2;
    this.st  = Math.random() < .12;   /* 12% are star/cross sparks */
  }
  tick(){
    this.l++;
    this.x += this.vx + Math.sin(this.l * .03 + this.w) * .22;
    this.y += this.vy;
    const t = this.l / this.ml;
    this.a = (t < .15 ? t / .15 : t > .78 ? (1 - t) / .22 : 1)
             * (this.st ? .44 : .26);
    if(this.l >= this.ml || this.y < -8) this.reset(false);
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = this.a;
    ctx.shadowColor = this.c;
    ctx.shadowBlur  = this.r * (this.st ? 11 : 6);
    ctx.fillStyle   = this.c;
    if(this.st){
      const s = this.r * 2.6;
      ctx.fillRect(this.x - s/2, this.y - .7,  s,   1.4);
      ctx.fillRect(this.x - .7,  this.y - s/2, 1.4, s);
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

const embers = Array.from({length: 60}, () => new Ember());
(function loop(){
  ctx.clearRect(0, 0, 820, 820);
  embers.forEach(e => { e.tick(); e.draw(); });
  requestAnimationFrame(loop);
})();

/* ═══════════════════════════════════════════════════
   FLASH
═══════════════════════════════════════════════════ */
const flEl = document.getElementById('fl');
function doFlash(){
  flEl.classList.remove('pop');
  void flEl.offsetWidth;
  flEl.classList.add('pop');
}

/* ═══════════════════════════════════════════════════
   TYPEWRITER
═══════════════════════════════════════════════════ */
function typewrite(el, text, speed, onDone){
  let i = 0;
  const cur = document.createElement('span');
  cur.className = 'cur';
  el.innerHTML  = '';
  el.appendChild(cur);
  const iv = setInterval(() => {
    if(i >= text.length){
      clearInterval(iv);
      cur.remove();
      if(onDone) onDone();
      return;
    }
    el.insertBefore(document.createTextNode(text[i]), cur);
    i++;
  }, speed);
}

/* ═══════════════════════════════════════════════════
   TIMELINE
   -----------------------------------------------
   0.00 s  opening gold flash
   0.40 s  "Fine Dining & Catering" types (22 ch × 58 ms → ~1.3 s)
   1.90 s  flash #2
   2.10 s  logo mandala blooms in (1.8 s anim → settles ~3.9 s)
   2.65 s  shimmer sweeps across logo
   3.90 s  flash #3  +  ornamental divider draws on
   4.20 s  tagline types (41 ch × 55 ms → ~2.3 s, done ~6.5 s)
   6.80 s  flash #4  +  sub line  +  bottom ornament
═══════════════════════════════════════════════════ */
const eyRow   = document.getElementById('eyRow');
const eyTx    = document.getElementById('eyTx');
const logoWrap= document.getElementById('logoWrap');
const logoImg = document.getElementById('logoImg');
const ornDiv  = document.getElementById('ornDiv');
const tgl     = document.getElementById('tgl');
const sub     = document.getElementById('sub');
const bot     = document.getElementById('bot');

// t = 0 s — gold-crimson flash
doFlash();

// t = 0.4 s — eyebrow label types in
setTimeout(() => {
  eyRow.classList.add('show');
  typewrite(eyTx, 'Fine Dining & Catering', 58);
}, 400);

// t = 1.9 s — flash before logo
setTimeout(doFlash, 1900);

// t = 2.1 s — logo mandala blooms in
setTimeout(() => logoImg.classList.add('animate'), 2100);

// t = 2.65 s — shimmer sweeps logo
setTimeout(() => logoWrap.classList.add('shimmer'), 2650);

// t = 3.9 s — flash + ornamental divider
setTimeout(() => {
  doFlash();
  ornDiv.classList.add('show');
  // t = 4.2 s — tagline
  setTimeout(() => {
    typewrite(tgl, 'Authentic Flavours. Timeless Hospitality.', 55);
  }, 280);
}, 3900);

// t = 6.8 s — flash + sub + bot ornament
setTimeout(() => {
  doFlash();
  sub.classList.add('show');
  bot.classList.add('show');
}, 6800);
</script>
</body>
</html>
