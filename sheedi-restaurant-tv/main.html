<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Sheedi's Restaurant — TV Commercial</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000000;
  --room:#08090d;
  --saffron:#FF7800;
  --crimson:#8B0018;
  --gold:#C9922A;
  --gold-l:#F5D98E;
}
body{
  background:var(--room);
  display:flex;align-items:center;justify-content:center;
  width:100vw;height:100vh;overflow:hidden;
}

/* ── Stage — the "dark room" ── */
.stage{
  position:relative;width:820px;height:820px;overflow:hidden;
  background:radial-gradient(ellipse 130% 110% at 50% 50%,
    #10111a 0%, #06070c 100%);
}

/* ══════════════════════════════════════════════
   TV BEZEL — sits on top of screen as a frame
   Uses CSS border to create a physical bezel ring
══════════════════════════════════════════════ */
.tv-bezel{
  position:absolute;inset:0;
  border:32px solid #1b1c1f;
  border-radius:22px;
  /* Inner edge highlight + outer shadow for depth */
  box-shadow:
    inset 0 0 0 1px #2a2a2e,        /* inner rim highlight */
    inset 0 0 28px rgba(0,0,0,.75), /* screen inset depth */
    0 0 0 2px #0d0d0f,              /* outer edge */
    0 24px 80px rgba(0,0,0,.90),    /* cast shadow below TV */
    0 0 120px rgba(255,100,0,.04);  /* warm screen glow on room */
  pointer-events:none;
  z-index:50;
}
/* Subtle bevel gradient on bezel surface */
.tv-bezel::before{
  content:'';position:absolute;inset:-32px;
  border-radius:22px;
  background:linear-gradient(145deg,
    rgba(80,80,90,.18) 0%,
    transparent 35%,
    transparent 65%,
    rgba(0,0,0,.30) 100%);
  pointer-events:none;
}

/* Brand name on bezel bottom */
.tv-brand{
  position:absolute;bottom:11px;left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:7px;letter-spacing:4px;
  color:rgba(255,120,0,.22);
  z-index:51;pointer-events:none;white-space:nowrap;
}

/* LED power indicator on bezel (bottom-right of bezel) */
.led{
  position:absolute;right:44px;bottom:13px;
  width:7px;height:7px;border-radius:50%;
  background:#440000;
  box-shadow:0 0 4px rgba(100,0,0,.5);
  z-index:52;transition:background .4s,box-shadow .4s;
}
.led.on{
  background:#ff3300;
  box-shadow:0 0 8px rgba(255,50,0,.90),0 0 16px rgba(255,60,0,.45);
  animation:ledPulse 3s 1s ease-in-out infinite;
}
@keyframes ledPulse{
  0%,100%{box-shadow:0 0 6px rgba(255,50,0,.8), 0 0 12px rgba(255,60,0,.3)}
  50%    {box-shadow:0 0 10px rgba(255,50,0,1),  0 0 22px rgba(255,60,0,.6)}
}

/* ══════════════════════════════════════════════
   CRT OVERLAYS — sit inside the bezel (under it)
══════════════════════════════════════════════ */
/* Horizontal scan lines */
.scanlines{
  position:absolute;inset:0;z-index:38;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.10) 3px,
    rgba(0,0,0,.10) 4px
  );
}
/* CRT vignette — darker corners/edges */
.crt-vignette{
  position:absolute;inset:0;z-index:39;pointer-events:none;
  background:radial-gradient(ellipse 86% 80% at 50% 50%,
    transparent 40%,
    rgba(0,0,0,.18) 68%,
    rgba(0,0,0,.48) 88%,
    rgba(0,0,0,.68) 100%);
}

/* ══════════════════════════════════════════════
   SCREEN WRAP — everything inside the TV screen.
   Gets the CRT power-on animation.
══════════════════════════════════════════════ */
.screen-wrap{
  position:absolute;inset:0;
  background:#000;
  transform:scaleY(0.002);
  filter:brightness(0);
  /* animation triggered by JS adding .boot class */
}
.screen-wrap.boot{
  animation:crtBoot 1.65s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes crtBoot{
  /* 0%: thin bright white line (classic CRT power-on) */
  0%  {transform:scaleY(0.002);filter:brightness(22) saturate(0) contrast(2)}
  8%  {transform:scaleY(0.07); filter:brightness(9)  saturate(0)}
  26% {transform:scaleY(0.48); filter:brightness(3.5) saturate(0.15)}
  46% {transform:scaleY(0.91); filter:brightness(2.0) saturate(0.55)}
  62% {transform:scaleY(1.05); filter:brightness(1.35) saturate(0.85)}
  75% {transform:scaleY(0.98); filter:brightness(1.08)}
  86% {transform:scaleY(1.02); filter:brightness(1.02)}
  100%{transform:scaleY(1);    filter:brightness(1) saturate(1)}
}

/* ── Ambient breathing glow (inside screen) ── */
.ambient{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 62% 54% at 50% 52%,
    rgba(90,0,8,.24) 0%,rgba(50,0,5,.10) 46%,transparent 68%);
  animation:ambientBreathe 5s 3s ease-in-out infinite;
}
@keyframes ambientBreathe{0%,100%{opacity:.6}50%{opacity:1}}

/* Canvas behind content */
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* ── Content block ── */
.content{
  position:absolute;top:108px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  z-index:8;pointer-events:none;
}

/* Eyebrow */
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ey-line{height:1px;width:60px;
         background:linear-gradient(90deg,transparent,rgba(255,120,0,.46),transparent)}
.ey-words{
  display:flex;gap:7px;
  font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:7px;
  color:rgba(255,120,0,.54);text-transform:uppercase;
}

/* Word flare-in */
.fw{display:inline-block;opacity:0}
.fw.flare{animation:wordFlare .68s cubic-bezier(.22,1,.36,1) forwards}
@keyframes wordFlare{
  0%  {opacity:0;transform:scale(1.90);filter:brightness(3.5) blur(7px)}
  25% {opacity:1;filter:brightness(1.6) blur(1px)}
  62% {transform:scale(.97)}
  100%{opacity:1;transform:scale(1);filter:brightness(1) blur(0)}
}

/* Logo — same 3D tumble-in from v3 */
.logo-wrap{position:relative;width:400px;overflow:visible;z-index:5;margin-top:2px}
.logo-img{
  display:block;width:400px;border-radius:3px;
  opacity:0;
  transform:perspective(700px) rotateY(-180deg) scale(0.06);
  filter:blur(12px);
}
.logo-img.tumble{
  animation:
    logoTumbleIn 1.9s cubic-bezier(.22,1,.36,1) forwards,
    logoPulse    7s  2.2s ease-in-out infinite;
}
@keyframes logoTumbleIn{
  0%  {opacity:0; transform:perspective(700px) rotateY(-180deg) scale(0.06);filter:blur(12px)}
  18% {opacity:.7;filter:blur(3px)}
  62% {           transform:perspective(700px) rotateY(11deg)  scale(1.07);opacity:1;filter:blur(0)}
  78% {           transform:perspective(700px) rotateY(-6deg)  scale(0.96)}
  90% {           transform:perspective(700px) rotateY( 3deg)  scale(1.02)}
  100%{opacity:1; transform:perspective(700px) rotateY(0deg)   scale(1);   filter:blur(0)}
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 10px rgba(255,80,0,.18))}
  50%    {filter:drop-shadow(0 0 44px rgba(255,100,0,.70))
                 drop-shadow(0 0 88px rgba(139,0,20,.20))}
}
/* Shimmer */
.logo-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,
    transparent 16%,rgba(255,220,130,.24) 50%,transparent 84%);
  transform:translateX(-160%);
  animation:logoShimmer 1.15s ease-out forwards;
  animation-play-state:paused;
}
.logo-wrap.shimmer::after{animation-play-state:running}
@keyframes logoShimmer{to{transform:translateX(260%)}}

/* Ornament divider */
.orn-div{margin:18px 0 4px;opacity:0;transition:opacity .6s}
.orn-div.show{opacity:1}
.orn-path{
  stroke:var(--saffron);stroke-width:.9;fill:none;opacity:.46;
  stroke-dasharray:300;stroke-dashoffset:300;
}
.orn-div.show .orn-path{animation:drawOrn 1.4s ease-out forwards}
@keyframes drawOrn{to{stroke-dashoffset:0}}

/* Tagline */
.tagline{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:23px;
  color:rgba(255,246,220,.78);letter-spacing:2px;text-align:center;
  filter:drop-shadow(0 0 12px rgba(255,100,0,.20));
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  min-height:36px;margin-top:4px;
}

/* Sub caption */
.sub-line{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:6px;
  color:rgba(255,120,0,.38);text-transform:uppercase;
  margin-top:18px;opacity:0;transition:opacity .8s ease;
}
.sub-line.show{opacity:1}

/* Bottom ornament */
.bot-orn{
  display:flex;align-items:center;gap:8px;margin-top:14px;
  opacity:0;transition:opacity .7s .3s ease;
}
.bot-orn.show{opacity:1}
.bo-ln{width:54px;height:1px;
       background:linear-gradient(90deg,transparent,rgba(255,120,0,.36),transparent)}
.bo-gm{width:6px;height:6px;background:var(--saffron);
       transform:rotate(45deg);box-shadow:0 0 8px rgba(255,120,0,.5)}
.bo-sm{width:4px;height:4px;background:var(--gold-l);transform:rotate(45deg)}

/* ══════════════════════════════════════════════
   REMOTE CONTROL
   CSS-drawn, positioned bottom-right outside screen
══════════════════════════════════════════════ */
.remote{
  position:absolute;right:38px;bottom:55px;
  width:52px;height:138px;
  background:linear-gradient(160deg,#2c2c30,#18181b);
  border-radius:14px 14px 22px 22px;
  box-shadow:
    0 10px 28px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 0 12px rgba(0,0,0,.5);
  transform:rotate(7deg);
  z-index:55;
  opacity:1;
  transition:opacity .8s ease;
}
.remote.hide{opacity:0;pointer-events:none}
/* Top glossy strip */
.remote::before{
  content:'';position:absolute;top:0;left:0;right:0;height:50px;
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 100%);
  border-radius:14px 14px 0 0;
}
/* IR emitter nub at top */
.remote::after{
  content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;
  background:#111;border-radius:3px;
  box-shadow:0 0 4px rgba(200,100,0,.25);
}
/* Power button */
.power-btn{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 40% 36%, #ff5500, #8b0000);
  box-shadow:0 0 10px rgba(255,60,0,.85),0 0 24px rgba(255,50,0,.45);
  animation:pwrGlow 1.1s ease-in-out infinite;
  cursor:default;
}
@keyframes pwrGlow{
  0%,100%{box-shadow:0 0 8px rgba(255,60,0,.80),0 0 18px rgba(255,50,0,.35)}
  50%    {box-shadow:0 0 16px rgba(255,80,0,1.0),0 0 34px rgba(255,60,0,.70)}
}
.power-btn.pressed{
  animation:pwrPress .18s ease-out forwards;
}
@keyframes pwrPress{
  0%  {transform:translateX(-50%) scale(1.0);filter:brightness(1)}
  35% {transform:translateX(-50%) scale(0.74);filter:brightness(2.8)}
  100%{transform:translateX(-50%) scale(1.0);
       box-shadow:0 0 4px rgba(120,40,0,.4);
       animation:none}
}
/* Small nav/number buttons */
.btn-grid{
  position:absolute;top:50px;left:0;right:0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 8px;
}
.btn-sm{
  height:10px;background:#252528;border-radius:3px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
/* D-pad */
.dpad{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  width:30px;height:30px;
}
.dpad::before,.dpad::after{
  content:'';position:absolute;background:#252528;border-radius:2px;
}
.dpad::before{top:0;bottom:0;left:33%;right:33%}   /* vertical bar */
.dpad::after {left:0;right:0;top:33%;bottom:33%}   /* horizontal bar */
.dpad-c{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;
  background:#1e1e22;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8);
}
</style>
</head>
<body>
<div class="stage">

  <!-- ══ SCREEN WRAP — all screen content, gets CRT boot anim ══ -->
  <div class="screen-wrap" id="screenWrap">
    <div class="ambient"></div>
    <canvas id="cv"></canvas>

    <div class="content">
      <div class="eyebrow">
        <div class="ey-line"></div>
        <div class="ey-words">
          <span class="fw" id="ew0">The</span>
          <span class="fw" id="ew1">Sheedi's</span>
          <span class="fw" id="ew2">Restaurant</span>
        </div>
        <div class="ey-line"></div>
      </div>

      <div class="logo-wrap" id="logoWrap">
        <img class="logo-img" id="logoImg"
             src="../SHEEDI RESTAURANT.jpeg"
             alt="The Sheedi's Restaurant">
      </div>

      <div class="orn-div" id="ornDiv">
        <svg width="280" height="20" viewBox="0 0 280 20">
          <path class="orn-path" d="M10,10 L116,10"/>
          <path class="orn-path" d="M164,10 L270,10"/>
          <circle cx="140" cy="10" r="5"   fill="none" stroke="rgba(255,120,0,.44)" stroke-width=".8"/>
          <circle cx="128" cy="10" r="2.5" fill="rgba(255,120,0,.30)"/>
          <circle cx="152" cy="10" r="2.5" fill="rgba(255,120,0,.30)"/>
          <polygon points="140,5 145,10 140,15 135,10"
                   fill="none" stroke="rgba(255,120,0,.52)" stroke-width=".8"/>
        </svg>
      </div>

      <div class="tagline">
        <span class="fw" id="tw0">Where</span>
        <span class="fw" id="tw1">Every</span>
        <span class="fw" id="tw2">Bite</span>
        <span class="fw" id="tw3">Tells</span>
        <span class="fw" id="tw4">a</span>
        <span class="fw" id="tw5">Story.</span>
      </div>

      <div class="sub-line" id="sub">Authentic &nbsp;·&nbsp; Flavourful &nbsp;·&nbsp; Unforgettable</div>

      <div class="bot-orn" id="bot">
        <div class="bo-ln"></div>
        <div class="bo-sm"></div>
        <div class="bo-gm"></div>
        <div class="bo-sm"></div>
        <div class="bo-ln"></div>
      </div>
    </div>
  </div><!-- /screen-wrap -->

  <!-- ══ CRT OVERLAYS (outside screen-wrap so they aren't scaled) ══ -->
  <div class="scanlines"></div>
  <div class="crt-vignette"></div>

  <!-- ══ TV BEZEL FRAME ══ -->
  <div class="tv-bezel"></div>
  <div class="tv-brand">SHEEDI &nbsp;·&nbsp; TV</div>
  <div class="led" id="led"></div>

  <!-- ══ REMOTE CONTROL ══ -->
  <div class="remote" id="remote">
    <div class="power-btn" id="powerBtn"></div>
    <div class="btn-grid">
      <div class="btn-sm"></div><div class="btn-sm"></div><div class="btn-sm"></div>
      <div class="btn-sm"></div><div class="btn-sm"></div><div class="btn-sm"></div>
      <div class="btn-sm"></div><div class="btn-sm"></div><div class="btn-sm"></div>
    </div>
    <div class="dpad"><div class="dpad-c"></div></div>
  </div>

</div><!-- /stage -->

<script>
/* ═══════════════════════════════════════════════════════════
   CANVAS — two phases:
   Phase 1 (boot): CRT static noise fades in/out
   Phase 2 (on):   Falling crimson+gold petals + burst sparks
═══════════════════════════════════════════════════════════ */
const cv  = document.getElementById('cv');
cv.width  = cv.height = 820;
const ctx = cv.getContext('2d');

/* ── Static noise buffer (205×205, scaled up 4× on draw) ── */
const noiseBuf    = document.createElement('canvas');
noiseBuf.width    = noiseBuf.height = 205;
const nCtx        = noiseBuf.getContext('2d');

function drawStatic(alpha) {
  const id = nCtx.createImageData(205, 205);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = (Math.random() * 200 + 18) | 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = 255;
  }
  nCtx.putImageData(id, 0, 0);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(noiseBuf, 0, 0, 820, 820);
  ctx.restore();
}

/* ── Petals ── */
const PETAL_C = ['#7B0016','#8B0018','#A31020','#B81428','#C9922A','#B08030','#D4A843'];

class Petal {
  constructor(init){ this.reset(init ?? true) }
  reset(init){
    this.x    = Math.random() * 820;
    this.y    = init ? Math.random() * 820 : -24;
    this.vy   = 0.55 + Math.random() * 1.20;
    this.vx   = (Math.random() - .5) * 0.55;
    this.rot  = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - .5) * 0.038;
    this.w    = 9  + Math.random() * 15;
    this.h    = 5  + Math.random() * 8;
    this.sway = Math.random() * Math.PI * 2;
    this.swayS= 0.012 + Math.random() * 0.018;
    this.a    = init ? Math.random() * 0.65 : 0;
    this.maxA = 0.52 + Math.random() * 0.28;
    this.c    = PETAL_C[Math.floor(Math.random() * PETAL_C.length)];
  }
  tick(){
    this.y    += this.vy;
    this.sway += this.swayS;
    this.x    += this.vx + Math.sin(this.sway) * 0.48;
    this.rot  += this.rotV;
    this.a     = Math.min(this.maxA, this.a + 0.022);
    if(this.y > 844) this.reset(false);
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = this.a;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowColor = this.c;
    ctx.shadowBlur  = 3;
    ctx.fillStyle   = this.c;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.w/2, this.h/2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ── Burst sparks ── */
const SPARK_C = ['#FF7800','#FFB940','#FF4500','#FFD060','#C9922A','#FF6020'];
class BurstSpark {
  constructor(cx, cy){
    const angle = Math.random() * Math.PI * 2;
    const spd   = 2.5 + Math.random() * 7;
    this.x  = cx + (Math.random() - .5) * 70;
    this.y  = cy + (Math.random() - .5) * 50;
    this.vx = Math.cos(angle) * spd;
    this.vy = Math.sin(angle) * spd - 1.5;
    this.g  = 0.10 + Math.random() * 0.06;
    this.r  = 1.0  + Math.random() * 2.8;
    this.a  = 0.9  + Math.random() * 0.1;
    this.c  = SPARK_C[Math.floor(Math.random() * SPARK_C.length)];
    this.dead = false;
  }
  tick(){
    this.vy += this.g;
    this.x  += this.vx;
    this.y  += this.vy;
    this.vx *= 0.978;
    this.a  -= 0.018 + Math.random() * 0.008;
    if(this.a <= 0) this.dead = true;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.a);
    ctx.shadowColor = this.c;
    ctx.shadowBlur  = this.r * 5;
    ctx.fillStyle   = this.c;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const petals   = Array.from({length: 60}, () => new Petal(false)); /* start off-screen */
let   burstPool = [];
let   bootTime  = null;  /* set when TV boots */
const STATIC_FADE_START = 900;   /* ms after boot: static starts fading */
const STATIC_FADE_END   = 1700;  /* ms after boot: static gone */
const PETALS_START      = 1500;  /* ms after boot: petals begin */

function triggerBurst(cx, cy, count){
  for(let i = 0; i < count; i++) burstPool.push(new BurstSpark(cx, cy));
}

(function loop(){
  ctx.clearRect(0, 0, 820, 820);

  if(bootTime !== null){
    const elapsed = Date.now() - bootTime;

    /* CRT static noise */
    if(elapsed < STATIC_FADE_END){
      const alpha = elapsed < STATIC_FADE_START ? 0.88 :
        0.88 * (1 - (elapsed - STATIC_FADE_START) / (STATIC_FADE_END - STATIC_FADE_START));
      drawStatic(alpha);
    }

    /* Petals */
    if(elapsed > PETALS_START){
      petals.forEach(p => { p.tick(); p.draw(); });
    }

    /* Burst sparks */
    burstPool = burstPool.filter(s => !s.dead);
    burstPool.forEach(s => { s.tick(); s.draw(); });
  }

  requestAnimationFrame(loop);
})();

/* ═══════════════════════════════════════════════════════════
   WORD FLARE HELPER
═══════════════════════════════════════════════════════════ */
function flareWord(id, delay){
  setTimeout(() => document.getElementById(id).classList.add('flare'), delay);
}

/* ═══════════════════════════════════════════════════════════
   TIMELINE
   ----------------------------------------------------------
   0.00 s  Remote visible, power button glows red
   0.75 s  Power button PRESSED (visual press animation)
   0.88 s  TV screen boots — CRT scaleY line expands
            LED turns on (red)  /  remote fades away
   0.88 s  Static noise fills screen (canvas phase 1)
   1.50 s  Petals start falling (canvas phase 2 begins)
   1.70 s  Static fully faded — screen clear
   2.60 s  Eyebrow words flare in  (3 × 140 ms stagger)
   3.80 s  Logo TUMBLES IN from behind + burst sparks
   4.90 s  Shimmer sweeps logo
   5.70 s  Ornament divider draws on
   6.00 s  Tagline words flare in   (6 × 165 ms stagger)
   8.30 s  Sub caption  + bottom ornament
═══════════════════════════════════════════════════════════ */
const screenWrap = document.getElementById('screenWrap');
const logoWrap   = document.getElementById('logoWrap');
const logoImg    = document.getElementById('logoImg');
const ornDiv     = document.getElementById('ornDiv');
const sub        = document.getElementById('sub');
const bot        = document.getElementById('bot');
const remote     = document.getElementById('remote');
const powerBtn   = document.getElementById('powerBtn');
const led        = document.getElementById('led');

/* Logo centre on 820×820 canvas */
const LOGO_CX = 410, LOGO_CY = 355;

/* t = 0.75 s — power button pressed */
setTimeout(() => {
  powerBtn.classList.add('pressed');
}, 750);

/* t = 0.88 s — TV boots */
setTimeout(() => {
  screenWrap.classList.add('boot');
  led.classList.add('on');
  bootTime = Date.now();
}, 880);

/* t = 1.6 s — remote fades (served its purpose) */
setTimeout(() => remote.classList.add('hide'), 1600);

/* t = 2.6 s — eyebrow */
flareWord('ew0', 2600);
flareWord('ew1', 2740);
flareWord('ew2', 2880);

/* t = 3.8 s — logo tumbles in + burst */
setTimeout(() => {
  logoImg.classList.add('tumble');
  triggerBurst(LOGO_CX, LOGO_CY, 65);
}, 3800);

/* t = 4.9 s — shimmer */
setTimeout(() => logoWrap.classList.add('shimmer'), 4900);

/* t = 5.7 s — ornament + soft burst */
setTimeout(() => {
  ornDiv.classList.add('show');
  triggerBurst(LOGO_CX, LOGO_CY + 200, 28);
}, 5700);

/* t = 6.0 s — tagline words */
flareWord('tw0', 6000);
flareWord('tw1', 6165);
flareWord('tw2', 6330);
flareWord('tw3', 6495);
flareWord('tw4', 6660);
flareWord('tw5', 6825);

/* t = 8.3 s — sub + bottom ornament */
setTimeout(() => {
  sub.classList.add('show');
  bot.classList.add('show');
}, 8300);
</script>
</body>
</html>
